name: oneliferelay

services:
  oneliferelay-api:
    container_name: oneliferelay-api
    image: ${ONELIFERELAY_API_IMAGE:-oneliferelay-api:latest}
    build:
      context: ..
    restart: unless-stopped
    env_file: ${ONELIFERELAY_ENV_FILE:-/srv/api-platform/apps/oneliferelay/secrets/runtime.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8798"
    ports:
      - "127.0.0.1:8798:8798"
    networks:
      - oneliferelay_edge
      - postgres_platform_db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:8798/v1/health\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
  oneliferelay-migrate:
    container_name: oneliferelay-migrate
    image: ${ONELIFERELAY_MIGRATIONS_IMAGE:-oneliferelay-migrations:latest}
    build:
      context: ..
      target: migrations
    env_file: ${ONELIFERELAY_OWNER_ENV_FILE:-/srv/api-platform/apps/oneliferelay/secrets/owner.env}
    environment:
      NODE_ENV: production
    profiles: ["ops"]
    networks:
      - postgres_platform_db
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

networks:
  oneliferelay_edge:
    name: oneliferelay_edge
  postgres_platform_db:
    external: true
