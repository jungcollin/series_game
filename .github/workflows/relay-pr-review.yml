name: Relay PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  relay-pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          node relay-tools/scripts/build_pages_site.js --out "$RUNNER_TEMP/relay-site"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/relay-site" > "$RUNNER_TEMP/relay-http.log" 2>&1 &
          echo $! > /tmp/relay-http.pid

      - name: Run relay PR review
        id: review
        run: |
          set +e
          node relay-tools/scripts/pr_review.js \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref "HEAD" \
            --base-url "http://127.0.0.1:4173" > relay-pr-review.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload relay review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relay-pr-review
          path: |
            relay-pr-review.json
            output/relay-tools/**
          if-no-files-found: ignore

      - name: Fail when relay review fails
        if: steps.review.outputs.status != '0'
        run: |
          cat relay-pr-review.json
          exit 1
