<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>저울 달인</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 걸너뛰기</a>
    <p id="stage-instructions" class="sr-only">저울 달인. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 터치로 추를 저울에 올리기입니다. 아래 추 트레이에서 추를 터치하면 오른쪽 접시에 올라가고, 접시 위의 추를 다시 터치하면 낼 수 있습니다. 왼쪽 접시의 목표 무게와 추의 합계가 정확히 같아지면 성공입니다. 문제 5개를 정확히 맞추면 클리어, 제한 시간 90초를 초과하면 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="저울 달인" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("scale-balance") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      const TOTAL_PROBLEMS = 5;
      const TIME_LIMIT = 90;
      const DENOMS = [1, 2, 5, 10, 20, 50];
      const BEAM_HALF = 250;
      const PIVOT = { x: VIEW.width / 2, y: 190 };
      const PAN_DROP = 110;

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "추를 조합해 양팔저울을 목표 무게로 맞추세요",
        failReason: "",
        problemIndex: 0,
        target: 0,
        tray: [],
        onPan: [],
        solved: 0,
        beamAngle: 0,
        successFlash: 0,
        timeLeft: TIME_LIMIT,
        weights: [],
      };

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) return;
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) return;
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) return;
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function panSum() {
        return state.onPan.reduce((sum, w) => sum + w.value, 0);
      }

      function makeProblem(index) {
        // 목표: 사용 가능한 추의 부분집합 합으로 보장된 해 존재
        const available = DENOMS.slice(0, 4 + Math.min(index, 2)); // 문제 진행에 따라 큰 추 추가
        const counts = available.map(() => 1 + Math.floor(Math.random() * 2));
        // 부분합으로 목표 생성 (최소 2개 이상 사용)
        let target = 0;
        const picks = [];
        for (let i = 0; i < available.length; i += 1) {
          for (let c = 0; c < counts[i]; c += 1) {
            if (Math.random() < 0.55) {
              target += available[i];
              picks.push(available[i]);
            }
          }
        }
        if (picks.length < 2 || target < 5) {
          target = available[available.length - 1] + available[0] * 2;
        }
        state.target = target;
        state.tray = [];
        for (let i = 0; i < available.length; i += 1) {
          for (let c = 0; c < counts[i]; c += 1) {
            state.tray.push({ value: available[i], onPan: false });
          }
        }
        state.onPan = [];
      }

      function layoutWeights() {
        state.weights = [];
        const trayY = 470;
        const startX = 90;
        const gapX = 132;
        state.tray.forEach((w, i) => {
          w.x = startX + (i % 6) * gapX;
          w.y = trayY - Math.floor(i / 6) * 72;
          w.r = 30;
        });
        state.onPan.forEach((w, i) => {
          const pan = panCenter("right");
          const cols = 3;
          w.x = pan.x - 70 + (i % cols) * 70;
          w.y = pan.y - 24 - Math.floor(i / cols) * 46;
          w.r = 26;
        });
        state.weights = [...state.tray, ...state.onPan];
      }

      function panCenter(side) {
        const dir = side === "left" ? -1 : 1;
        const endX = PIVOT.x + dir * BEAM_HALF * Math.cos(state.beamAngle);
        const endY = PIVOT.y + dir * BEAM_HALF * Math.sin(state.beamAngle);
        return { x: endX, y: endY + PAN_DROP };
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.failReason = "";
        state.problemIndex = 0;
        state.solved = 0;
        state.timeLeft = TIME_LIMIT;
        state.beamAngle = 0;
        state.successFlash = 0;
        makeProblem(0);
        layoutWeights();
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        state.failReason = reason;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function toggleWeight(w) {
        if (state.successFlash > 0) return;
        if (w.onPan) {
          w.onPan = false;
          state.onPan = state.onPan.filter((item) => item !== w);
          state.tray.push(w);
        } else {
          w.onPan = true;
          state.tray = state.tray.filter((item) => item !== w);
          state.onPan.push(w);
        }
        layoutWeights();
        if (panSum() === state.target) {
          state.successFlash = 0.9;
          state.solved += 1;
        }
      }

      function pointerPos(event) {
        const rect = canvas.getBoundingClientRect();
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const clientY = event.touches ? event.touches[0].clientY : event.clientY;
        return {
          x: ((clientX - rect.left) / rect.width) * VIEW.width,
          y: ((clientY - rect.top) / rect.height) * VIEW.height,
        };
      }

      function handleTap(pos) {
        // 접시 위 추부터 검사(겹침 우선)
        for (let i = state.onPan.length - 1; i >= 0; i -= 1) {
          const w = state.onPan[i];
          if (Math.hypot(pos.x - w.x, pos.y - w.y) <= w.r + 8) {
            toggleWeight(w);
            return;
          }
        }
        for (let i = state.tray.length - 1; i >= 0; i -= 1) {
          const w = state.tray[i];
          if (Math.hypot(pos.x - w.x, pos.y - w.y) <= w.r + 8) {
            toggleWeight(w);
            return;
          }
        }
      }

      function update(dt) {
        if (state.mode !== "running") return;
        state.elapsed += dt;
        state.timeLeft -= dt;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          failStage("time_over");
          return;
        }

        // 빔 각도: (왼쪽 목표 - 오른쪽 합계)에 비례, 오른쪽이 무거우면 오른쪽이 낮아짐
        const diff = panSum() - state.target;
        const targetAngle = Math.max(-0.22, Math.min(0.22, diff * 0.006));
        state.beamAngle += (targetAngle - state.beamAngle) * Math.min(1, dt * 6);
        layoutWeights();

        if (state.successFlash > 0) {
          state.successFlash -= dt;
          if (state.successFlash <= 0) {
            if (state.solved >= TOTAL_PROBLEMS) {
              clearStage();
              return;
            }
            state.problemIndex += 1;
            makeProblem(state.problemIndex);
            layoutWeights();
          }
        }
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(128, 92, 704, 356);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 92, 704, 356);

        ctx.fillStyle = accent;
        ctx.font = "700 42px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 162);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 24px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 232 + index * 46);
        });
        ctx.textAlign = "left";
      }

      function drawWeight(w) {
        const grd = ctx.createRadialGradient(w.x - 8, w.y - 10, 4, w.x, w.y, w.r);
        grd.addColorStop(0, "#cbd5e1");
        grd.addColorStop(1, "#475569");
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#f8fafc";
        ctx.font = `800 ${w.r * 0.72}px Trebuchet MS`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`${w.value}`, w.x, w.y + 1);
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
      }

      function drawPan(side, label, sub) {
        const pan = panCenter(side);
        const beamEndX = PIVOT.x + (side === "left" ? -1 : 1) * BEAM_HALF * Math.cos(state.beamAngle);
        const beamEndY = PIVOT.y + (side === "left" ? -1 : 1) * BEAM_HALF * Math.sin(state.beamAngle);
        // chains
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(beamEndX, beamEndY);
        ctx.lineTo(pan.x - 55, pan.y);
        ctx.moveTo(beamEndX, beamEndY);
        ctx.lineTo(pan.x + 55, pan.y);
        ctx.stroke();
        // pan
        ctx.fillStyle = "#94a3b8";
        ctx.beginPath();
        ctx.ellipse(pan.x, pan.y, 90, 20, 0, 0, Math.PI);
        ctx.fill();
        ctx.strokeStyle = "#334155";
        ctx.stroke();
        // label
        ctx.fillStyle = "#0f172a";
        ctx.font = "800 22px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(label, pan.x, pan.y + 46);
        ctx.font = "700 18px Trebuchet MS";
        ctx.fillStyle = "#475569";
        ctx.fillText(sub, pan.x, pan.y + 72);
        ctx.textAlign = "left";
        return pan;
      }

      function drawTargetItem(pan) {
        // 목표 물건(보석 상자)
        ctx.fillStyle = "#b45309";
        ctx.fillRect(pan.x - 34, pan.y - 44, 68, 44);
        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(pan.x - 34, pan.y - 44, 68, 14);
        ctx.strokeStyle = "#78350f";
        ctx.lineWidth = 2;
        ctx.strokeRect(pan.x - 34, pan.y - 44, 68, 44);
        ctx.fillStyle = "#fff7ed";
        ctx.font = "800 20px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(`${state.target}g`, pan.x, pan.y - 14);
        ctx.textAlign = "left";
      }

      function renderRunning() {
        // background
        const grad = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        grad.addColorStop(0, "#fef3c7");
        grad.addColorStop(1, "#fde68a");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        ctx.fillStyle = "#a16207";
        ctx.fillRect(0, 500, VIEW.width, 40);

        // pillar
        ctx.fillStyle = "#78350f";
        ctx.fillRect(PIVOT.x - 14, PIVOT.y, 28, 310);
        ctx.beginPath();
        ctx.arc(PIVOT.x, PIVOT.y, 16, 0, Math.PI * 2);
        ctx.fill();

        // beam
        ctx.save();
        ctx.translate(PIVOT.x, PIVOT.y);
        ctx.rotate(state.beamAngle);
        ctx.fillStyle = "#92400e";
        ctx.fillRect(-BEAM_HALF, -7, BEAM_HALF * 2, 14);
        ctx.restore();

        const leftPan = drawPan("left", "목표 물건", `${state.target}g`);
        const rightPan = drawPan("right", "추 합계", `${panSum()}g`);
        drawTargetItem(leftPan);
        void rightPan;

        // tray label
        ctx.fillStyle = "#78350f";
        ctx.font = "800 20px Trebuchet MS";
        ctx.fillText("추 트레이 — 터치해서 올리기 / 접시 위 추 터치로 내리기", 90, 428);

        for (const w of state.tray) drawWeight(w);
        for (const w of state.onPan) drawWeight(w);

        // balance verdict
        const diff = panSum() - state.target;
        let verdict = "";
        let verdictColor = "#475569";
        if (state.successFlash > 0 || diff === 0) {
          verdict = "정확합니다! ⚖";
          verdictColor = "#15803d";
        } else if (diff > 0) {
          verdict = `초과 +${diff}g`;
          verdictColor = "#b91c1c";
        } else {
          verdict = `부족 ${diff}g`;
          verdictColor = "#1d4ed8";
        }
        ctx.fillStyle = verdictColor;
        ctx.font = "800 26px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(verdict, VIEW.width / 2, 92);
        ctx.textAlign = "left";

        // HUD
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, 0, VIEW.width, 56);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 24px Trebuchet MS";
        ctx.fillText(`문제 ${Math.min(state.solved + 1, TOTAL_PROBLEMS)}/${TOTAL_PROBLEMS}`, 20, 37);
        ctx.fillText(`합계 ${panSum()}g / 목표 ${state.target}g`, 220, 37);
        ctx.textAlign = "right";
        ctx.fillStyle = state.timeLeft < 15 ? "#fca5a5" : "#fde68a";
        ctx.fillText(`남은 시간 ${Math.ceil(state.timeLeft)}초`, VIEW.width - 20, 37);
        ctx.textAlign = "left";
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("저울 달인", [
            "추를 조합해 양팔저울을 목표 무게로 맞추세요",
            "조작: 터치로 추를 저울에 올리기",
            "클리어 조건: 문제 5개를 정확히 맞추면 클리어",
            "실패 조건: 제한 시간 90초 초과 시 실패",
            "접시 위의 추를 다시 터치하면 내릴 수 있어요",
            "터치 또는 Enter로 시작",
          ], "#b45309");
          return;
        }

        if (state.mode === "running") {
          renderRunning();
          return;
        }

        if (state.mode === "failed") {
          renderRunning();
          renderCard("실패", [
            "제한 시간 90초 초과 시 실패",
            `해결한 문제 ${state.solved}/${TOTAL_PROBLEMS}`,
            "공유 목숨 1개가 즉시 종료되었습니다.",
            "터치 또는 Enter로 다시 시작",
          ], "#b91c1c");
          return;
        }

        renderRunning();
        renderCard("클리어", [
          "문제 5개를 정확히 맞추면 클리어",
          `5개 모두 해결! 남은 시간 ${Math.ceil(state.timeLeft)}초`,
          "호스트가 다음 미플레이 스테이지를 선택합니다.",
          "터치 또는 Enter로 다시 시작",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down; left pan = target, right pan = weights",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          problem: Math.min(state.problemIndex + 1, TOTAL_PROBLEMS),
          solved: state.solved,
          target_g: state.target,
          pan_sum_g: panSum(),
          time_left: Math.round(state.timeLeft * 10) / 10,
          tray_values: state.tray.map((w) => w.value),
          pan_values: state.onPan.map((w) => w.value),
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode !== "running") {
          event.preventDefault();
          startStage();
        }
      }

      canvas.addEventListener("touchstart", (event) => {
        event.preventDefault();
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        handleTap(pointerPos(event));
      }, { passive: false });
      canvas.addEventListener("pointerdown", (event) => {
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        handleTap(pointerPos(event));
      });
      canvas.addEventListener("mousedown", (event) => {
        if (state.mode === "running") handleTap(pointerPos(event));
      });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "scale-balance",
        title: "저울 달인",
        creator: "Anonymous Creator",
        genre: "Weight puzzle",
        clearCondition: "문제 5개를 정확히 맞추면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          state.solved = TOTAL_PROBLEMS;
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
