<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스키 슬라롬</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">스키 슬라롬. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 화면 좌우 터치로 조향입니다. 화면 왼쪽 절반을 누르면 왼쪽으로, 오른쪽 절반을 누르면 오른쪽으로 조향하며, 화면 하단의 좌우 버튼이나 키보드 방향키로도 조향할 수 있습니다. 파란 깃발 게이트 사이를 15개 통과하면 클리어, 게이트를 3회 누락하면 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="스키 슬라롬" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" class="mobile-btn" id="btn-left" aria-label="왼쪽으로 조향">◀</button>
        <button type="button" class="mobile-btn" id="btn-right" aria-label="오른쪽으로 조향">▶</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("ski-slalom") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      const TOTAL_GATES = 15;
      const MAX_MISSES = 3;
      const SKIER_Y = 410;
      const GATE_GAP = 150;
      const GATE_SPACING = 330;
      const SLOPE_MIN_X = 90;
      const SLOPE_MAX_X = 870;
      const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches ?? false;

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "게이트 사이를 빠짐없이 통과하며 활강하세요",
        failReason: "",
        skierX: VIEW.width / 2,
        steerVel: 0,
        speed: 240,
        gates: [],
        passed: 0,
        missed: 0,
        gateIndex: 0,
        tracks: [],
        particles: [],
        flash: null,
        keys: { left: false, right: false },
        touchSteer: 0,
      };

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) return;
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) return;
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) return;
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function makeGate(index, prevX) {
        const margin = GATE_GAP / 2 + 60;
        const maxDelta = 240;
        const base = typeof prevX === "number" ? prevX : VIEW.width / 2;
        const low = Math.max(margin, base - maxDelta);
        const high = Math.min(VIEW.width - margin, base + maxDelta);
        const centerX = low + Math.random() * (high - low);
        return {
          index,
          x: centerX,
          y: -index * GATE_SPACING - 60,
          judged: false,
        };
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.failReason = "";
        state.skierX = VIEW.width / 2;
        state.steerVel = 0;
        state.speed = 240;
        state.gates = [];
        for (let i = 0; i < TOTAL_GATES; i += 1) {
          const prev = i > 0 ? state.gates[i - 1].x : undefined;
          state.gates.push(makeGate(i, prev));
        }
        state.passed = 0;
        state.missed = 0;
        state.gateIndex = 0;
        state.tracks = [];
        state.particles = [];
        state.flash = null;
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        state.failReason = reason;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function bindHoldButton(button, side) {
        if (!button) return;
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          if (state.touchSteer === side) state.touchSteer = 0;
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          if (state.mode !== "running") {
            startFromTouch();
            return;
          }
          button.dataset.active = "true";
          state.touchSteer = side;
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      bindHoldButton(document.querySelector("#btn-left"), -1);
      bindHoldButton(document.querySelector("#btn-right"), 1);

      function update(dt) {
        if (state.mode !== "running") return;
        state.elapsed += dt;

        const steerInput =
          state.touchSteer +
          (state.keys.left ? -1 : 0) +
          (state.keys.right ? 1 : 0);
        const steer = Math.max(-1, Math.min(1, steerInput));
        state.steerVel += steer * 3400 * dt;
        state.steerVel *= Math.pow(0.0003, dt);
        state.skierX += state.steerVel * dt;
        if (state.skierX < SLOPE_MIN_X) {
          state.skierX = SLOPE_MIN_X;
          state.steerVel = Math.max(0, state.steerVel);
        }
        if (state.skierX > SLOPE_MAX_X) {
          state.skierX = SLOPE_MAX_X;
          state.steerVel = Math.min(0, state.steerVel);
        }

        state.speed = Math.min(520, 240 + state.gateIndex * 20);

        for (const gate of state.gates) {
          gate.y += state.speed * dt;
          if (!gate.judged && gate.y >= SKIER_Y) {
            gate.judged = true;
            state.gateIndex += 1;
            const half = GATE_GAP / 2;
            if (Math.abs(state.skierX - gate.x) <= half - 8) {
              state.passed += 1;
              state.flash = { text: "통과!", color: "#15803d", t: 0.8 };
              if (!reducedMotion) {
                for (let i = 0; i < 14; i += 1) {
                  state.particles.push({
                    x: state.skierX + (Math.random() - 0.5) * 40,
                    y: SKIER_Y + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 160,
                    vy: -60 - Math.random() * 120,
                    life: 0.6,
                    color: "#ffffff",
                  });
                }
              }
            } else {
              state.missed += 1;
              state.flash = { text: "누락!", color: "#b91c1c", t: 0.9 };
              if (state.missed >= MAX_MISSES) {
                failStage("gate_missed_3");
                return;
              }
            }
          }
        }
        state.gates = state.gates.filter((gate) => gate.y < VIEW.height + 120);

        if (!reducedMotion) {
          state.tracks.push({ x: state.skierX, y: SKIER_Y + 14, t: 1.2 });
          if (Math.random() < 0.5) {
            state.particles.push({
              x: state.skierX + (Math.random() - 0.5) * 26,
              y: SKIER_Y + 12,
              vx: -state.steerVel * 0.12 + (Math.random() - 0.5) * 60,
              vy: 40 + Math.random() * 60,
              life: 0.5,
              color: "rgba(226, 232, 240, 0.9)",
            });
          }
        }
        for (const track of state.tracks) track.t -= dt;
        state.tracks = state.tracks.filter((track) => track.t > 0);
        for (const p of state.particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 220 * dt;
          p.life -= dt;
        }
        state.particles = state.particles.filter((p) => p.life > 0);

        if (state.flash) {
          state.flash.t -= dt;
          if (state.flash.t <= 0) state.flash = null;
        }

        if (state.passed >= TOTAL_GATES) {
          clearStage();
        }
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(128, 92, 704, 356);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 92, 704, 356);

        ctx.fillStyle = accent;
        ctx.font = "700 42px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 162);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 24px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 232 + index * 46);
        });
        ctx.textAlign = "left";
      }

      function drawFlag(x, y) {
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - 44);
        ctx.stroke();
        ctx.fillStyle = "#2563eb";
        ctx.beginPath();
        ctx.moveTo(x, y - 44);
        ctx.lineTo(x + 26, y - 36);
        ctx.lineTo(x, y - 28);
        ctx.closePath();
        ctx.fill();
      }

      function drawGate(gate) {
        const half = GATE_GAP / 2;
        drawFlag(gate.x - half, gate.y);
        drawFlag(gate.x + half - 26, gate.y);
        ctx.strokeStyle = gate.judged ? "rgba(37, 99, 235, 0.35)" : "rgba(37, 99, 235, 0.75)";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(gate.x - half, gate.y);
        ctx.lineTo(gate.x + half, gate.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#0f172a";
        ctx.font = "700 18px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(String(gate.index + 1), gate.x, gate.y - 52);
        ctx.textAlign = "left";
      }

      function drawSkier() {
        const lean = Math.max(-0.5, Math.min(0.5, state.steerVel / 700));
        ctx.save();
        ctx.translate(state.skierX, SKIER_Y);
        ctx.rotate(lean * 0.6);
        // skis
        ctx.strokeStyle = "#7c2d12";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-16, 12);
        ctx.lineTo(-14, 28);
        ctx.moveTo(4, 12);
        ctx.lineTo(6, 28);
        ctx.stroke();
        // body
        ctx.fillStyle = "#dc2626";
        ctx.beginPath();
        ctx.arc(0, -2, 14, 0, Math.PI * 2);
        ctx.fill();
        // head
        ctx.fillStyle = "#fde68a";
        ctx.beginPath();
        ctx.arc(0, -22, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1d4ed8";
        ctx.fillRect(-9, -30, 18, 6);
        ctx.restore();
      }

      function renderRunning() {
        // snow background
        const grad = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        grad.addColorStop(0, "#dbeafe");
        grad.addColorStop(1, "#f8fafc");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        // slope edge markers
        ctx.fillStyle = "rgba(148, 163, 184, 0.35)";
        ctx.fillRect(0, 0, SLOPE_MIN_X - 30, VIEW.height);
        ctx.fillRect(SLOPE_MAX_X + 30, 0, VIEW.width - SLOPE_MAX_X - 30, VIEW.height);

        // ski tracks
        ctx.strokeStyle = "rgba(100, 116, 139, 0.45)";
        ctx.lineWidth = 3;
        for (const track of state.tracks) {
          ctx.globalAlpha = Math.min(1, track.t / 1.2) * 0.6;
          ctx.beginPath();
          ctx.arc(track.x - 8, track.y, 2.4, 0, Math.PI * 2);
          ctx.arc(track.x + 8, track.y, 2.4, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        for (const gate of state.gates) {
          if (gate.y > -80 && gate.y < VIEW.height + 40) drawGate(gate);
        }

        for (const p of state.particles) {
          ctx.globalAlpha = Math.max(0, p.life * 1.6);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        drawSkier();

        if (state.flash) {
          ctx.globalAlpha = Math.min(1, state.flash.t * 2);
          ctx.fillStyle = state.flash.color;
          ctx.font = "800 40px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText(state.flash.text, VIEW.width / 2, 200);
          ctx.textAlign = "left";
          ctx.globalAlpha = 1;
        }

        // HUD
        ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
        ctx.fillRect(0, 0, VIEW.width, 58);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 24px Trebuchet MS";
        ctx.fillText(`게이트 ${state.passed}/${TOTAL_GATES}`, 20, 38);
        ctx.fillStyle = state.missed > 0 ? "#fca5a5" : "#f8fafc";
        ctx.fillText(`누락 ${state.missed}/${MAX_MISSES}`, 240, 38);
        ctx.textAlign = "right";
        ctx.fillStyle = "#93c5fd";
        ctx.fillText(`속도 ${Math.round(state.speed / 8)} km/h`, VIEW.width - 20, 38);
        ctx.textAlign = "left";
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("스키 슬라롬", [
            "게이트 사이를 빠짐없이 통과하며 활강하세요",
            "조작: 화면 좌우 터치로 조향",
            "클리어 조건: 게이트 15개를 통과하면 클리어",
            "실패 조건: 게이트 3회 누락 시 실패",
            "화면 하단 ◀ ▶ 버튼이나 방향키로도 조향할 수 있어요",
            "터치 또는 Enter로 시작",
          ], "#2563eb");
          return;
        }

        if (state.mode === "running") {
          renderRunning();
          return;
        }

        if (state.mode === "failed") {
          renderRunning();
          renderCard("실패", [
            "게이트 3회 누락 시 실패",
            `통과 ${state.passed}/${TOTAL_GATES}, 누락 ${state.missed}/${MAX_MISSES}`,
            "공유 목숨 1개가 즉시 종료되었습니다.",
            "터치 또는 Enter로 다시 시작",
          ], "#b91c1c");
          return;
        }

        renderRunning();
        renderCard("클리어", [
          "게이트 15개를 통과하면 클리어",
          `전부 통과! 소요 시간 ${state.lastRunTime.toFixed(1)}초`,
          "호스트가 다음 미플레이 스테이지를 선택합니다.",
          "터치 또는 Enter로 다시 시작",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down; skier fixed at y=410, gates scroll down",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          skier_x: Math.round(state.skierX),
          speed: Math.round(state.speed),
          gates_passed: state.passed,
          gates_missed: state.missed,
          gates_total: TOTAL_GATES,
          next_gate: state.gates.find((g) => !g.judged) || null,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode !== "running") {
          event.preventDefault();
          startStage();
          return;
        }
        if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") {
          event.preventDefault();
          state.keys.left = true;
        }
        if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") {
          event.preventDefault();
          state.keys.right = true;
        }
      }

      function onKeyUp(event) {
        if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") state.keys.left = false;
        if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") state.keys.right = false;
      }

      function steerFromPointer(clientX) {
        const rect = canvas.getBoundingClientRect();
        const ratio = (clientX - rect.left) / rect.width;
        state.touchSteer = ratio < 0.5 ? -1 : 1;
      }

      canvas.addEventListener("touchstart", (event) => {
        event.preventDefault();
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        steerFromPointer(event.touches[0].clientX);
      }, { passive: false });
      canvas.addEventListener("touchmove", (event) => {
        event.preventDefault();
        if (state.mode === "running") steerFromPointer(event.touches[0].clientX);
      }, { passive: false });
      canvas.addEventListener("touchend", (event) => {
        event.preventDefault();
        if (event.touches.length === 0) state.touchSteer = 0;
      }, { passive: false });
      canvas.addEventListener("pointerdown", (event) => {
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        steerFromPointer(event.clientX);
      });
      canvas.addEventListener("mousedown", (event) => {
        if (state.mode === "running") steerFromPointer(event.clientX);
      });
      window.addEventListener("mouseup", () => {
        state.touchSteer = 0;
      });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "ski-slalom",
        title: "스키 슬라롬",
        creator: "Anonymous Creator",
        genre: "Slalom steering",
        clearCondition: "게이트 15개를 통과하면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          state.passed = TOTAL_GATES;
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
