<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주차의 달인</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">주차의 달인. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 화면 버튼으로 조향·전진·후진 입니다. 키보드는 방향키를 사용합니다. 녹색 주차칸 안에 차를 완전히 넣고 멈추면 성공입니다. 다른 차나 벽에 닿으면 접촉 1회로 차가 처음 위치로 돌아갑니다.</p>
    <canvas id="game" width="960" height="540" aria-label="주차의 달인" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" class="mobile-btn" id="btn-left" aria-label="왼쪽 조향">◀</button>
        <button type="button" class="mobile-btn" id="btn-fwd" aria-label="전진">▲</button>
        <button type="button" class="mobile-btn" id="btn-rev" aria-label="후진">▼</button>
        <button type="button" class="mobile-btn" id="btn-right" aria-label="오른쪽 조향">▶</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <!-- Optional: ../sdk/v2/relay-sdk.js for the v2 host contract. Legacy RelayStageHost callbacks remain required. -->
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("parking-master") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const WALL = 24;
      const CAR_W = 34;
      const CAR_L = 62;
      const MAX_SPEED = 150;
      const ACCEL = 220;
      const FRICTION = 2.2;
      const STEER_RATE = 2.6;
      const MAX_STEER = 0.55;
      const ANGLE_TOLERANCE = (28 * Math.PI) / 180;

      // Each round: target spot + parked obstacle cars + player spawn.
      const ROUNDS = [
        {
          spot: { x: 700, y: 90, w: 70, h: 110, angle: 0 },
          obstacles: [
            { x: 590, y: 90, w: 70, h: 110 },
            { x: 810, y: 90, w: 70, h: 110 },
            { x: 200, y: 90, w: 70, h: 110 },
            { x: 420, y: 400, w: 70, h: 110 },
          ],
          spawn: { x: 180, y: 440, heading: -Math.PI / 2 },
        },
        {
          spot: { x: 130, y: 360, w: 110, h: 70, angle: Math.PI / 2 },
          obstacles: [
            { x: 130, y: 120, w: 110, h: 70 },
            { x: 130, y: 230, w: 110, h: 70 },
            { x: 560, y: 120, w: 110, h: 70 },
            { x: 760, y: 360, w: 110, h: 70 },
            { x: 560, y: 360, w: 110, h: 70 },
          ],
          spawn: { x: 800, y: 120, heading: Math.PI / 2 },
        },
        {
          spot: { x: 460, y: 405, w: 70, h: 110, angle: Math.PI },
          obstacles: [
            { x: 350, y: 405, w: 70, h: 110 },
            { x: 570, y: 405, w: 70, h: 110 },
            { x: 240, y: 130, w: 70, h: 110 },
            { x: 460, y: 130, w: 70, h: 110 },
            { x: 680, y: 130, w: 70, h: 110 },
          ],
          spawn: { x: 850, y: 460, heading: Math.PI },
        },
      ];

      const input = { left: false, right: false, fwd: false, rev: false };

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "조향과 속도를 조절해 주차칸에 정확히 세우세요",
        round: 0,
        parked: 0,
        contacts: 0,
        car: { x: 0, y: 0, heading: 0, speed: 0, steer: 0 },
        flash: 0,
        flashKind: "",
        celebrate: 0,
      };

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function currentRound() {
        return ROUNDS[Math.min(state.round, ROUNDS.length - 1)];
      }

      function resetCar() {
        const spawn = currentRound().spawn;
        state.car.x = spawn.x;
        state.car.y = spawn.y;
        state.car.heading = spawn.heading;
        state.car.speed = 0;
        state.car.steer = 0;
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.round = 0;
        state.parked = 0;
        state.contacts = 0;
        state.flash = 0;
        state.celebrate = 0;
        resetCar();
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function bindHoldButton(button, onPress, onRelease) {
        if (!button) {
          return;
        }
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          onRelease?.();
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          startFromTouch();
          button.dataset.active = "true";
          onPress?.();
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function carCorners() {
        const { x, y, heading } = state.car;
        const c = Math.cos(heading);
        const s = Math.sin(heading);
        const hl = CAR_L / 2;
        const hw = CAR_W / 2;
        const corners = [];
        for (const [lx, ly] of [[-hl, -hw], [hl, -hw], [hl, hw], [-hl, hw]]) {
          corners.push({ x: x + lx * c - ly * s, y: y + lx * s + ly * c });
        }
        return corners;
      }

      function pointInRect(px, py, rect) {
        return px >= rect.x - rect.w / 2 && px <= rect.x + rect.w / 2 &&
          py >= rect.y - rect.h / 2 && py <= rect.y + rect.h / 2;
      }

      function checkContact() {
        const corners = carCorners();
        for (const p of corners) {
          if (p.x < WALL || p.x > VIEW.width - WALL || p.y < WALL || p.y > VIEW.height - WALL) {
            return true;
          }
          for (const ob of currentRound().obstacles) {
            if (pointInRect(p.x, p.y, ob)) {
              return true;
            }
          }
        }
        return false;
      }

      function angleDiff(a, b) {
        let d = a - b;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return Math.abs(d);
      }

      function checkParked() {
        const spot = currentRound().spot;
        const corners = carCorners();
        const allInside = corners.every((p) => pointInRect(p.x, p.y, spot));
        const aligned = angleDiff(state.car.heading, spot.angle) <= ANGLE_TOLERANCE;
        return allInside && aligned && Math.abs(state.car.speed) < 4;
      }

      function update(dt) {
        if (state.flash > 0) state.flash = Math.max(0, state.flash - dt);
        if (state.celebrate > 0) {
          state.celebrate = Math.max(0, state.celebrate - dt);
          if (state.celebrate === 0 && state.mode === "running") {
            state.round += 1;
            if (state.parked >= 3) {
              clearStage();
            } else {
              resetCar();
            }
          }
          return;
        }
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;

        const car = state.car;
        if (input.left) car.steer = Math.max(-MAX_STEER, car.steer - STEER_RATE * dt);
        else if (input.right) car.steer = Math.min(MAX_STEER, car.steer + STEER_RATE * dt);
        else car.steer *= Math.max(0, 1 - 8 * dt);

        if (input.fwd) car.speed = Math.min(MAX_SPEED, car.speed + ACCEL * dt);
        else if (input.rev) car.speed = Math.max(-MAX_SPEED * 0.5, car.speed - ACCEL * dt);
        else car.speed *= Math.max(0, 1 - FRICTION * dt);

        if (Math.abs(car.speed) > 0.1) {
          car.heading += (car.speed / CAR_L) * Math.tan(car.steer) * dt;
          car.x += Math.cos(car.heading) * car.speed * dt;
          car.y += Math.sin(car.heading) * car.speed * dt;
        }

        if (checkContact()) {
          state.contacts += 1;
          state.flash = 0.4;
          state.flashKind = "contact";
          if (state.contacts >= 3) {
            failStage("vehicle_contact_3");
            return;
          }
          resetCar();
          return;
        }

        if (checkParked()) {
          state.parked += 1;
          state.flash = 0.5;
          state.flashKind = "parked";
          state.celebrate = 0.9;
          car.speed = 0;
        }
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(128, 92, 704, 356);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 92, 704, 356);

        ctx.fillStyle = accent;
        ctx.font = "700 42px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 162);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 24px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 232 + index * 46);
        });
        ctx.textAlign = "left";
      }

      function drawCar(x, y, heading, w, l, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(heading);
        ctx.fillStyle = color;
        ctx.fillRect(-l / 2, -w / 2, l, w);
        ctx.fillStyle = "rgba(219, 234, 254, 0.9)";
        ctx.fillRect(l * 0.05, -w / 2 + 5, l * 0.22, w - 10);
        ctx.restore();
      }

      function renderLot() {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        ctx.fillStyle = "#334155";
        ctx.fillRect(WALL, WALL, VIEW.width - WALL * 2, VIEW.height - WALL * 2);
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 3;
        ctx.strokeRect(WALL, WALL, VIEW.width - WALL * 2, VIEW.height - WALL * 2);

        const round = currentRound();
        const spot = round.spot;
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.2 * Math.sin(state.elapsed * 5);
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(spot.x - spot.w / 2, spot.y - spot.h / 2, spot.w, spot.h);
        ctx.restore();
        ctx.strokeStyle = "#4ade80";
        ctx.setLineDash([10, 8]);
        ctx.lineWidth = 3;
        ctx.strokeRect(spot.x - spot.w / 2, spot.y - spot.h / 2, spot.w, spot.h);
        ctx.setLineDash([]);
        // 방향 표시 화살표
        ctx.save();
        ctx.translate(spot.x, spot.y);
        ctx.rotate(spot.angle);
        ctx.fillStyle = "#bbf7d0";
        ctx.beginPath();
        ctx.moveTo(spot.h / 2 - 12, 0);
        ctx.lineTo(spot.h / 2 - 32, -10);
        ctx.lineTo(spot.h / 2 - 32, 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        for (const ob of round.obstacles) {
          drawCar(ob.x, ob.y, 0, ob.w, ob.h, "#64748b");
        }
        drawCar(state.car.x, state.car.y, state.car.heading, CAR_W, CAR_L, "#f97316");
      }

      function renderHud() {
        ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
        ctx.fillRect(0, 0, VIEW.width, 56);
        ctx.fillStyle = "#4ade80";
        ctx.font = "800 24px Trebuchet MS";
        ctx.fillText(`주차 성공 ${state.parked}/3`, 24, 38);
        ctx.fillStyle = "#f87171";
        ctx.textAlign = "right";
        ctx.fillText(`접촉 ${state.contacts}/3`, VIEW.width - 24, 38);
        ctx.textAlign = "center";
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "700 20px Trebuchet MS";
        ctx.fillText(`${Math.round(Math.abs(state.car.speed))} km/h`, VIEW.width / 2, 36);
        ctx.textAlign = "left";

        if (state.flash > 0) {
          ctx.fillStyle = state.flashKind === "parked"
            ? `rgba(34, 197, 94, ${state.flash * 0.5})`
            : `rgba(239, 68, 68, ${state.flash * 0.5})`;
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        }
        if (state.celebrate > 0) {
          ctx.fillStyle = "#166534";
          ctx.font = "800 44px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText("주차 성공!", VIEW.width / 2, VIEW.height / 2);
          ctx.textAlign = "left";
        }
      }

      function render() {
        if (state.mode === "menu") {
          renderLot();
          renderCard("주차의 달인", [
            "조향과 속도를 조절해 주차칸에 정확히 세우세요",
            "조작: 화면 버튼으로 조향·전진·후진",
            "키보드: 방향키 ←→ 조향, ↑ 전진, ↓ 후진",
            "클리어 조건: 주차 3회를 성공하면 클리어",
            "실패 조건: 차량 접촉 3회 시 실패",
            "터치 또는 Enter로 시작",
          ], "#f97316");
          return;
        }

        if (state.mode === "running") {
          renderLot();
          renderHud();
          return;
        }

        if (state.mode === "failed") {
          renderLot();
          renderCard("실패", [
            "차량 접촉 3회 시 실패",
            `주차 성공 ${state.parked}/3 · 소요 ${state.lastRunTime.toFixed(1)}초`,
            "다른 차나 벽에 닿지 않게 조심하세요.",
            "터치 또는 Enter로 다시 도전",
          ], "#b91c1c");
          return;
        }

        renderLot();
        renderCard("클리어", [
          "주차 3회를 성공하면 클리어",
          `접촉 ${state.contacts}/3 · 소요 ${state.lastRunTime.toFixed(1)}초`,
          "완벽한 주차 실력이네요!",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down, top-down parking lot",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          parked: state.parked,
          contacts: state.contacts,
          round: state.round + 1,
          car: {
            x: Math.round(state.car.x),
            y: Math.round(state.car.y),
            heading_deg: Math.round((state.car.heading * 180) / Math.PI),
            speed: Math.round(state.car.speed),
          },
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      const KEY_MAP = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "fwd",
        ArrowDown: "rev",
      };

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode !== "running") {
          event.preventDefault();
          startStage();
          return;
        }
        const dir = KEY_MAP[event.key];
        if (dir) {
          event.preventDefault();
          input[dir] = true;
        }
      }

      function onKeyUp(event) {
        const dir = KEY_MAP[event.key];
        if (dir) {
          input[dir] = false;
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "parking-master",
        title: "주차의 달인",
        creator: "Anonymous Creator",
        genre: "Precision driving",
        clearCondition: "주차 3회를 성공하면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      bindHoldButton(document.querySelector("#btn-left"), () => { input.left = true; }, () => { input.left = false; });
      bindHoldButton(document.querySelector("#btn-right"), () => { input.right = true; }, () => { input.right = false; });
      bindHoldButton(document.querySelector("#btn-fwd"), () => { input.fwd = true; }, () => { input.fwd = false; });
      bindHoldButton(document.querySelector("#btn-rev"), () => { input.rev = true; }, () => { input.rev = false; });

      canvas.addEventListener("touchstart", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
        }
      }, { passive: false });
      canvas.addEventListener("pointerdown", () => {
        if (state.mode !== "running") {
          startFromTouch();
        }
      });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
