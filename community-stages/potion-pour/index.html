<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포션 장인</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 160px;
        min-width: 120px;
        min-height: 64px;
        padding: 0 20px;
        background: rgba(88, 28, 135, 0.85);
        color: #f8fafc;
        font: 800 22px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(147, 51, 234, 0.95);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-btn {
          min-height: 56px;
          border-radius: 18px;
          font-size: 19px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">포션 장인. 캔버스를 터치하거나 Enter로 시작하세요. 화면이나 붓기 버튼을 누르고 있으면 주전자가 기울며 물약이 차오르고, 떼면 붓기가 멈춥니다. 키보드는 스페이스를 눌렀다 떼면 됩니다. 액면이 초록색 목표 눈금 안에 멈추면 주문 성공이며, 오래 누를수록 유속이 빨라집니다. 주문 5개 성공 시 클리어, 3회 실패 또는 넘치면 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="포션 장인" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" class="mobile-btn" id="pour-btn" aria-label="누르고 있으면 붓기, 떼면 정지">붓기</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <!-- Optional: ../sdk/v2/relay-sdk.js for the v2 host contract. Legacy RelayStageHost callbacks remain required. -->
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("potion-pour") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      const TOTAL_ORDERS = 5;
      const MAX_FAILS = 3;
      const SETTLE_TIME = 0.7;
      const JUDGE_SHOW_TIME = 1.0;

      // Flask geometry (body: cylinder-ish beaker)
      const FLASK = { x: 400, top: 190, bottom: 470, w: 190 };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;
      let orderSeed = 0;

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        phase: "idle", // idle | pouring | settling | judged
        level: 0,
        pourTime: 0,
        pourHeld: false,
        settleTimer: 0,
        judgeTimer: 0,
        judgeResult: null, // "success" | "fail" | "overflow"
        successCount: 0,
        failCount: 0,
        orderIndex: 0,
        order: null,
        slosh: 0,
        effects: [],
        failReason: "",
        note: "눈금선에 맞춰 물약을 정확히 부으세요",
      };

      function makeOrder(index) {
        // deterministic-ish variety per order
        const rng = (n) => {
          const v = Math.sin((index + 1) * 997.3 + orderSeed * 131.7 + n * 57.1) * 43758.5453;
          return v - Math.floor(v);
        };
        const target = 38 + Math.round(rng(1) * 44); // 38..82%
        const tolerance = 4 + Math.round(rng(2) * 2); // 4..6%
        const baseRate = 26 + rng(3) * 14; // %/s at pour start
        const accel = 0.7 + rng(4) * 0.7; // flow speed-up per second held
        const hue = Math.round(rng(5) * 360);
        return { target, tolerance, baseRate, accel, hue };
      }

      function currentFlowRate() {
        if (!state.order) return 0;
        return state.order.baseRate * (1 + state.pourTime * state.order.accel);
      }

      function levelToY(level) {
        return FLASK.bottom - (FLASK.bottom - FLASK.top) * (level / 100);
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function nextOrder() {
        state.orderIndex += 1;
        state.order = makeOrder(state.orderIndex);
        state.level = 0;
        state.pourTime = 0;
        state.phase = "idle";
        state.judgeResult = null;
        state.slosh = 0;
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.successCount = 0;
        state.failCount = 0;
        state.orderIndex = 0;
        state.effects = [];
        state.failReason = "";
        state.pourHeld = false;
        orderSeed = Math.random();
        nextOrder();
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        if (state.mode !== "running") {
          return;
        }
        state.mode = "failed";
        state.failReason = reason;
        state.lastRunTime = state.elapsed;
        state.pourHeld = false;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        if (state.mode !== "running") {
          return;
        }
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        state.pourHeld = false;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function addSparkles(color, count) {
        for (let index = 0; index < count; index += 1) {
          state.effects.push({
            x: FLASK.x + (Math.random() - 0.5) * FLASK.w,
            y: levelToY(state.level) + (Math.random() - 0.5) * 60,
            vx: (Math.random() - 0.5) * 90,
            vy: -Math.random() * 120 - 30,
            age: 0,
            life: 0.6 + Math.random() * 0.5,
            color,
            size: 3 + Math.random() * 4,
          });
        }
      }

      function judgePour() {
        const order = state.order;
        const diff = Math.abs(state.level - order.target);
        state.phase = "judged";
        state.judgeTimer = JUDGE_SHOW_TIME;
        if (state.level >= 100) {
          state.judgeResult = "overflow";
          state.failCount += 1;
        } else if (diff <= order.tolerance) {
          state.judgeResult = "success";
          state.successCount += 1;
          addSparkles("rgba(254, 240, 138, 0.95)", 22);
        } else {
          state.judgeResult = "fail";
          state.failCount += 1;
        }
        if (state.successCount >= TOTAL_ORDERS) {
          // clear after showing the success
          state.judgeTimer = JUDGE_SHOW_TIME;
        } else if (state.failCount >= MAX_FAILS) {
          state.judgeTimer = JUDGE_SHOW_TIME;
        }
      }

      function pressPour() {
        if (state.mode === "menu") {
          startStage();
          return;
        }
        if (state.mode !== "running") {
          return;
        }
        state.pourHeld = true;
        if (state.phase === "idle") {
          state.phase = "pouring";
        }
      }

      function releasePour() {
        state.pourHeld = false;
        if (state.mode !== "running" || state.phase !== "pouring") {
          return;
        }
        state.phase = "settling";
        state.settleTimer = SETTLE_TIME;
        state.slosh = 1;
      }

      function update(dt) {
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;
        state.slosh = Math.max(0, state.slosh - dt * 1.4);

        if (state.phase === "pouring") {
          if (state.pourHeld) {
            state.pourTime += dt;
            state.level += currentFlowRate() * dt;
            state.slosh = Math.min(1, state.slosh + dt * 3);
            if (state.level >= 100.4) {
              state.level = 100.4;
              state.pourHeld = false;
              judgePour();
            }
          } else {
            releasePour();
          }
        } else if (state.phase === "settling") {
          state.settleTimer -= dt;
          if (state.settleTimer <= 0) {
            judgePour();
          }
        } else if (state.phase === "judged") {
          state.judgeTimer -= dt;
          if (state.judgeTimer <= 0) {
            if (state.successCount >= TOTAL_ORDERS) {
              clearStage();
            } else if (state.failCount >= MAX_FAILS) {
              failStage(state.judgeResult === "overflow" ? "overflow_3_times" : "wrong_amount_3_times");
            } else {
              nextOrder();
            }
          }
        }

        state.effects = state.effects.filter((fx) => {
          fx.age += dt;
          fx.x += fx.vx * dt;
          fx.y += fx.vy * dt;
          fx.vy += 260 * dt;
          return fx.age < fx.life;
        });
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        grad.addColorStop(0, "#3b2f4a");
        grad.addColorStop(1, "#1d1530");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        // shelf & table
        ctx.fillStyle = "#5b3a29";
        ctx.fillRect(0, 486, VIEW.width, 54);
        ctx.fillStyle = "#6d4a33";
        ctx.fillRect(0, 486, VIEW.width, 10);

        // ambient bottles
        for (let i = 0; i < 5; i += 1) {
          const bx = 60 + i * 52;
          ctx.fillStyle = `hsla(${i * 70 + 20}, 60%, 55%, 0.35)`;
          roundedRect(bx, 60, 30, 54, 8);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.25)";
          ctx.fillRect(bx + 10, 48, 10, 14);
        }
      }

      function drawFlask() {
        const order = state.order;
        const level = Math.min(state.level, 100);
        const surfaceY = levelToY(level);
        const sloshAmp = state.slosh * 7;

        // target band
        if (order && state.mode === "running") {
          const bandTop = levelToY(Math.min(100, order.target + order.tolerance));
          const bandBottom = levelToY(Math.max(0, order.target - order.tolerance));
          ctx.fillStyle = "rgba(34, 197, 94, 0.28)";
          ctx.fillRect(FLASK.x - FLASK.w / 2 - 14, bandTop, FLASK.w + 28, bandBottom - bandTop);
          ctx.strokeStyle = "rgba(34, 197, 94, 0.9)";
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 6]);
          const targetY = levelToY(order.target);
          ctx.beginPath();
          ctx.moveTo(FLASK.x - FLASK.w / 2 - 16, targetY);
          ctx.lineTo(FLASK.x + FLASK.w / 2 + 16, targetY);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#86efac";
          ctx.font = "700 17px Trebuchet MS";
          ctx.textAlign = "left";
          ctx.fillText(`목표 ${order.target}% ±${order.tolerance}`, FLASK.x + FLASK.w / 2 + 24, targetY + 6);
        }

        // liquid
        if (level > 0.2) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(FLASK.x - FLASK.w / 2, FLASK.top - 40, FLASK.w, FLASK.bottom - FLASK.top + 40);
          ctx.clip();
          const hue = order ? order.hue : 280;
          const lg = ctx.createLinearGradient(0, surfaceY, 0, FLASK.bottom);
          lg.addColorStop(0, `hsla(${hue}, 75%, 62%, 0.95)`);
          lg.addColorStop(1, `hsla(${hue}, 70%, 40%, 0.98)`);
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.moveTo(FLASK.x - FLASK.w / 2, FLASK.bottom);
          for (let x = -FLASK.w / 2; x <= FLASK.w / 2; x += 6) {
            const y = surfaceY + Math.sin(x * 0.08 + state.elapsed * 7) * sloshAmp;
            ctx.lineTo(FLASK.x + x, y);
          }
          ctx.lineTo(FLASK.x + FLASK.w / 2, FLASK.bottom);
          ctx.closePath();
          ctx.fill();
          // bubbles
          ctx.fillStyle = "rgba(255,255,255,0.3)";
          for (let i = 0; i < 4; i += 1) {
            const bub = ((state.elapsed * 40 + i * 53) % Math.max(1, FLASK.bottom - surfaceY));
            ctx.beginPath();
            ctx.arc(FLASK.x - 40 + i * 27, FLASK.bottom - bub - 6, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // glass body
        ctx.strokeStyle = "rgba(226, 232, 240, 0.85)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(FLASK.x - 26, FLASK.top - 58);
        ctx.lineTo(FLASK.x - 26, FLASK.top - 10);
        ctx.lineTo(FLASK.x - FLASK.w / 2, FLASK.top + 44);
        ctx.lineTo(FLASK.x - FLASK.w / 2, FLASK.bottom);
        ctx.lineTo(FLASK.x + FLASK.w / 2, FLASK.bottom);
        ctx.lineTo(FLASK.x + FLASK.w / 2, FLASK.top + 44);
        ctx.lineTo(FLASK.x + 26, FLASK.top - 10);
        ctx.lineTo(FLASK.x + 26, FLASK.top - 58);
        ctx.stroke();

        // scale ticks
        ctx.strokeStyle = "rgba(226, 232, 240, 0.5)";
        ctx.lineWidth = 2;
        ctx.font = "600 13px Trebuchet MS";
        ctx.fillStyle = "rgba(226, 232, 240, 0.75)";
        ctx.textAlign = "right";
        for (let p = 20; p <= 100; p += 20) {
          const y = levelToY(p);
          ctx.beginPath();
          ctx.moveTo(FLASK.x - FLASK.w / 2, y);
          ctx.lineTo(FLASK.x - FLASK.w / 2 + 14, y);
          ctx.stroke();
          ctx.fillText(`${p}`, FLASK.x - FLASK.w / 2 - 8, y + 4);
        }
        ctx.textAlign = "left";

        // current level readout
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 24px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(`${Math.min(100, state.level).toFixed(1)}%`, FLASK.x, FLASK.bottom + 34);
      }

      function drawKettle() {
        const pouring = state.phase === "pouring" && state.pourHeld;
        const tilt = pouring ? Math.min(1, state.pourTime * 4) : 0;
        const kx = FLASK.x + 40;
        const ky = 96;

        ctx.save();
        ctx.translate(kx, ky);
        ctx.rotate(-tilt * 0.55);
        // body
        ctx.fillStyle = "#9ca3af";
        roundedRect(-46, -26, 92, 52, 16);
        ctx.fill();
        ctx.fillStyle = "#6b7280";
        roundedRect(-46, -26, 92, 14, 8);
        ctx.fill();
        // spout
        ctx.fillStyle = "#9ca3af";
        ctx.beginPath();
        ctx.moveTo(-46, -10);
        ctx.lineTo(-84, 6);
        ctx.lineTo(-46, 16);
        ctx.closePath();
        ctx.fill();
        // handle
        ctx.strokeStyle = "#6b7280";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(48, -2, 20, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
        ctx.restore();

        // stream
        if (pouring) {
          const spoutX = kx - 82;
          const spoutY = ky + 8;
          ctx.strokeStyle = `hsla(${state.order.hue}, 75%, 62%, 0.9)`;
          ctx.lineWidth = 5 + Math.min(4, state.pourTime * 3);
          ctx.beginPath();
          ctx.moveTo(spoutX, spoutY);
          const midX = (spoutX + FLASK.x) / 2 - 10;
          ctx.quadraticCurveTo(midX, spoutY + 60, FLASK.x, FLASK.top - 60);
          ctx.stroke();
          // droplets
          ctx.fillStyle = `hsla(${state.order.hue}, 80%, 70%, 0.9)`;
          for (let i = 0; i < 3; i += 1) {
            const t = (state.elapsed * 3 + i / 3) % 1;
            const dx = spoutX + (FLASK.x - spoutX) * t;
            const dy = spoutY + (FLASK.top - 60 - spoutY) * t * t;
            ctx.beginPath();
            ctx.arc(dx, dy, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawEffects() {
        state.effects.forEach((fx) => {
          ctx.globalAlpha = 1 - fx.age / fx.life;
          ctx.fillStyle = fx.color;
          ctx.beginPath();
          ctx.arc(fx.x, fx.y, fx.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function drawHud() {
        ctx.fillStyle = "rgba(15, 23, 42, 0.55)";
        roundedRect(20, 16, 300, 64, 12);
        ctx.fill();
        ctx.fillStyle = "#f8fafc";
        ctx.font = "700 19px Trebuchet MS";
        ctx.textAlign = "left";
        ctx.fillText(`주문 ${Math.min(state.orderIndex, TOTAL_ORDERS)}/${TOTAL_ORDERS}`, 36, 42);
        ctx.fillStyle = "#fca5a5";
        ctx.fillText(`실패 ${state.failCount}/${MAX_FAILS}`, 36, 68);

        ctx.fillStyle = "rgba(15, 23, 42, 0.55)";
        roundedRect(VIEW.width - 220, 16, 200, 64, 12);
        ctx.fill();
        ctx.fillStyle = "#f8fafc";
        ctx.textAlign = "right";
        ctx.fillText(`${state.elapsed.toFixed(1)}s`, VIEW.width - 36, 42);
        if (state.phase === "pouring") {
          ctx.fillStyle = "#fde68a";
          ctx.fillText(`유속 ${currentFlowRate().toFixed(0)}%/s`, VIEW.width - 36, 68);
        } else if (state.order) {
          ctx.fillStyle = "#a5b4fc";
          ctx.fillText(`기본 유속 ${state.order.baseRate.toFixed(0)}%/s`, VIEW.width - 36, 68);
        }
        ctx.textAlign = "left";

        // phase prompt
        ctx.textAlign = "center";
        ctx.font = "700 20px Trebuchet MS";
        if (state.phase === "idle") {
          ctx.fillStyle = "rgba(248, 250, 252, 0.9)";
          ctx.fillText("화면을 누르고 있으면 붓기 시작!", VIEW.width / 2, 128);
        } else if (state.phase === "judged") {
          if (state.judgeResult === "success") {
            ctx.fillStyle = "#4ade80";
            ctx.fillText("주문 성공! ✨", VIEW.width / 2, 128);
          } else if (state.judgeResult === "overflow") {
            ctx.fillStyle = "#f87171";
            ctx.fillText("넘쳤어요! 실패 1회", VIEW.width / 2, 128);
          } else {
            ctx.fillStyle = "#f87171";
            const diff = state.level - state.order.target;
            ctx.fillText(`실패 1회 (${diff > 0 ? "+" : ""}${diff.toFixed(1)}%)`, VIEW.width / 2, 128);
          }
        }
        ctx.textAlign = "left";
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.97)";
        roundedRect(150, 84, 660, 372, 18);
        ctx.fill();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = accent;
        ctx.font = "800 40px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 152);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 22px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 216 + index * 42);
        });
        ctx.textAlign = "left";
      }

      function renderScene() {
        drawBackground();
        drawKettle();
        drawFlask();
        drawEffects();
      }

      function render() {
        if (state.mode === "menu") {
          renderScene();
          renderCard("포션 장인", [
            "눈금선에 맞춰 물약을 정확히 부으세요",
            "조작: 터치를 유지해 붓기, 떼면 정지",
            "키보드: 스페이스를 눌렀다 떼면 붓기",
            "오래 누를수록 유속이 점점 빨라져요!",
            "클리어 조건: 주문 5개를 오차 범위 안에 완성",
            "실패 조건: 3회 실패하거나 넘치면 실패",
            "터치 또는 Enter로 시작",
          ], "#7c3aed");
          return;
        }

        renderScene();
        if (state.mode === "running") {
          drawHud();
          return;
        }

        if (state.mode === "failed") {
          renderCard("실패", [
            `주문 성공 ${state.successCount}/${TOTAL_ORDERS} · 실패 ${state.failCount}/${MAX_FAILS}`,
            state.failReason === "overflow_3_times" ? "마지막 주문에서 물약이 넘쳤어요." : "오차 범위를 벗어났어요.",
            "실패 조건: 3회 실패하거나 넘치면 실패",
            "유속이 빨라지기 전에 손을 떼는 타이밍이 중요해요.",
          ], "#b91c1c");
          return;
        }

        renderCard("클리어!", [
          `주문 ${TOTAL_ORDERS}개 완성! ${state.lastRunTime.toFixed(1)}초`,
          "클리어 조건: 주문 5개를 오차 범위 안에 완성",
          "호스트가 다음 미플레이 스테이지를 선택합니다.",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "canvas 960x540, flask centered x=400, level percent 0-100",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          phase: state.phase,
          level_pct: Math.round(state.level * 10) / 10,
          order: state.order
            ? {
                index: state.orderIndex,
                target_pct: state.order.target,
                tolerance_pct: state.order.tolerance,
                flow_rate_now: Math.round(currentFlowRate() * 10) / 10,
              }
            : null,
          success: state.successCount,
          fails: state.failCount,
          judge_result: state.judgeResult,
          fail_reason: state.failReason || null,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode === "menu") {
          event.preventDefault();
          startStage();
          return;
        }
        if (event.code === "Space" && state.mode === "running") {
          event.preventDefault();
          if (!event.repeat) {
            pressPour();
          }
        }
      }

      function onKeyUp(event) {
        if (event.code === "Space") {
          event.preventDefault();
          releasePour();
        }
      }

      function bindHoldButton(button, onPress, onRelease) {
        if (!button) {
          return;
        }
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          onRelease?.();
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          button.dataset.active = "true";
          onPress?.();
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "potion-pour",
        title: "포션 장인",
        creator: "Anonymous Creator",
        genre: "Precision pour",
        clearCondition: "주문 5개를 오차 범위 안에 완성",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        pressPour();
      });
      window.addEventListener("pointerup", () => releasePour());
      window.addEventListener("pointercancel", () => releasePour());
      bindHoldButton(document.querySelector("#pour-btn"), pressPour, releasePour);
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
