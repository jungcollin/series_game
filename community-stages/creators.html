<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>제작자 - One Life Relay</title>
    <meta name="description" content="One Life Relay 커뮤니티 스테이지 제작자와 공개 게임 목록입니다. GitHub 문자열은 검증된 계정 소유권이 아닙니다." />
    <link rel="canonical" href="https://relay.collinworks.dev/community-stages/creators.html" />
    <link rel="icon" href="../favicon.ico" sizes="32x32" />
    <link rel="stylesheet" href="./gallery.css?v=20260909" />
    <style>
      .creator-page { width: min(100%, 880px); margin: 0 auto; padding: 96px 24px 64px; display: grid; gap: 16px; }
      .creator-page h1 { font-family: var(--font-display); }
      .creator-note, .creator-stats { color: var(--ink-2); font-size: 0.9rem; }
      .creator-list { display: grid; gap: 8px; list-style: none; }
      .creator-list a { color: var(--ink); }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#creator-main">본문으로 건너뛰기</a>
    <nav class="navbar" aria-label="주 메뉴">
      <div class="navbar-container">
        <a href="../index.html" class="navbar-brand"><span class="logo-text">OLR</span></a>
        <div class="navbar-actions">
          <a href="./gallery.html" class="nav-link">STAGES</a>
          <a href="./creators.html" class="nav-link nav-link--active" aria-current="page">CREATORS</a>
        </div>
      </div>
    </nav>
    <main id="creator-main" class="creator-page">
      <p class="section-kicker">CREATORS</p>
      <h1 id="creator-title">제작자</h1>
      <p class="creator-note">이름과 GitHub 값은 스테이지 메타데이터에 적힌 문자열입니다. 공식 인증 배지가 아니며, 계정 소유권을 증명하지 않습니다.</p>
      <p id="creator-stats" class="creator-stats" hidden></p>
      <ul id="creator-list" class="creator-list"></ul>
    </main>
    <script src="./relay-runtime.js"></script>
    <script src="./registry.js"></script>
    <script src="../app/infrastructure/api-client.js?v=20260909"></script>
    <script src="./relay-api.js?v=20260909"></script>
    <script>
      (function () {
        var entries = window.COMMUNITY_STAGE_REGISTRY || [];
        var params = new URLSearchParams(window.location.search);
        var github = params.get("github") || "";
        var name = params.get("name") || "";
        var titleEl = document.getElementById("creator-title");
        var listEl = document.getElementById("creator-list");
        var statsEl = document.getElementById("creator-stats");

        function escapeHtml(value) {
          if (window.RelayRuntime && window.RelayRuntime.escapeHtml) {
            return window.RelayRuntime.escapeHtml(value);
          }
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function normalize(creator) {
          if (window.RelayRuntime && window.RelayRuntime.normalizeCreator) {
            return window.RelayRuntime.normalizeCreator(creator);
          }
          if (typeof creator === "string") return { name: creator, github: null };
          return creator || { name: "Unknown", github: null };
        }

        var filtered = entries.filter(function (entry) {
          var creator = normalize(entry.creator);
          if (github) return creator.github === github;
          if (name) return creator.name === name;
          return true;
        });

        if (github || name) {
          titleEl.textContent = github || name;
        }

        if (!filtered.length) {
          listEl.innerHTML = "<li>해당 제작자의 공개 스테이지가 없습니다.</li>";
          return;
        }

        if (!(github || name)) {
          var groups = new Map();
          filtered.forEach(function (entry) {
            var creator = normalize(entry.creator);
            var key = creator.github || creator.name;
            if (!groups.has(key)) groups.set(key, { creator: creator, count: 0 });
            groups.get(key).count += 1;
          });
          listEl.innerHTML = Array.from(groups.values()).map(function (group) {
            var href = group.creator.github
              ? "./creators.html?github=" + encodeURIComponent(group.creator.github)
              : "./creators.html?name=" + encodeURIComponent(group.creator.name);
            return "<li><a href=\"" + href + "\">" + escapeHtml(group.creator.name) + "</a> · " + group.count + "개</li>";
          }).join("");
          return;
        }

        listEl.innerHTML = filtered.map(function (entry) {
          return "<li><a href=\"./play.html?stage=" + encodeURIComponent(entry.id) + "\">" + escapeHtml(entry.title) + "</a></li>";
        }).join("");

        if (github && window.RelayApi) {
          statsEl.hidden = false;
          statsEl.textContent = "집계를 불러오는 중…";
          window.RelayApi.request("/v1/creators/" + encodeURIComponent(github) + "/stats", { auth: true })
            .then(function (payload) {
              if (payload && payload.hidden) {
                statsEl.textContent = "플레이 표본이 부족해 집계를 표시하지 않습니다. (n=" + payload.sample_size + ")";
                return;
              }
              statsEl.textContent = "시작 " + payload.play_starts + " · 클리어 " + payload.clears + " · 기술 오류 " + payload.tech_errors + " · 표본 " + payload.sample_size;
            })
            .catch(function () {
              statsEl.textContent = "집계를 불러오지 못했습니다. 게임 목록은 그대로 볼 수 있습니다.";
            });
        }
      })();
    </script>
  </body>
</html>
