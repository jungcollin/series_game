<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>케이블카 기사</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 180px;
        min-width: 120px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 140px;
          min-width: 96px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 걸너뛰기</a>
    <p id="stage-instructions" class="sr-only">케이블카 기사. 캔버스를 터치하거나 Enter로 시작하세요. 화면을 터치한 채 유지하거나 스페이스 키를 누르고 있으면 가속하고, 떼면 감속합니다. 녹색 정지 구역 안에서 속도를 0으로 만들어 역에 정차하세요.</p>
    <canvas id="game" width="960" height="540" aria-label="케이블카 기사" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" id="hold-btn" class="mobile-btn" data-active="false">가속</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("cable-car") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const TRACK = 1720;
      const STATIONS = [420, 950, 1480].map((s, i) => ({ s, name: `${i + 1}번 역` }));
      const ZONE_HALF = 52;
      const V_MAX = 380;
      const V_DANGER = 300;
      const V_CRASH_END = 220;
      const MAX_MISSES = 3;
      const CABLE_DROP = 92;

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "속도를 조절해 케이블카를 역에 정확히 세우세요",
        s: 40,
        v: 0,
        hold: false,
        target: 0,
        parked: 0,
        misses: 0,
        pauseT: 0,
        failReason: "",
        toast: null,
      };

      function terrainY(s) {
        return 300 + 55 * Math.sin(s / 170) + 28 * Math.sin(s / 83 + 1.3);
      }

      function terrainSlope(s) {
        return (terrainY(s + 4) - terrainY(s - 4)) / 8;
      }

      function cameraX() {
        return Math.max(0, Math.min(state.s - 320, TRACK - VIEW.width + 60));
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) return;
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) return;
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) return;
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.s = 40;
        state.v = 0;
        state.hold = false;
        state.target = 0;
        state.parked = 0;
        state.misses = 0;
        state.pauseT = 0;
        state.failReason = "";
        state.toast = null;
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        state.failReason = reason;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode !== "running") {
          startStage();
        }
      }

      function showToast(text) {
        state.toast = { text, until: state.elapsed + 1.6 };
      }

      function missStation(reason) {
        state.misses += 1;
        if (state.misses >= MAX_MISSES) {
          failStage("정차 실패 3회");
          return;
        }
        showToast(`${reason} (실패 ${state.misses}/${MAX_MISSES})`);
        const st = STATIONS[state.target];
        state.s = Math.max(40, st.s - 240);
        state.v = 0;
        state.hold = false;
      }

      function update(dt) {
        if (state.mode !== "running") return;
        state.elapsed += dt;

        if (state.pauseT > 0) {
          state.pauseT -= dt;
          state.v = 0;
          if (state.pauseT <= 0 && state.parked >= STATIONS.length) {
            clearStage();
          }
          return;
        }

        const slope = terrainSlope(state.s);
        let accel = state.hold ? 175 : -115;
        accel += 150 * slope;
        state.v = Math.max(0, Math.min(V_MAX, state.v + accel * dt));
        state.s += state.v * dt;

        const st = STATIONS[state.target];
        if (!st) return;
        const inZone = Math.abs(state.s - st.s) <= ZONE_HALF;

        if (state.v <= 0.5 && inZone) {
          state.parked += 1;
          state.target += 1;
          state.pauseT = 1.0;
          showToast(`${st.name} 정차 성공! (${state.parked}/${STATIONS.length})`);
          return;
        }

        if (state.s > st.s + ZONE_HALF + 4) {
          missStation(`${st.name}을 지나쳤습니다`);
          return;
        }

        if (state.s >= TRACK - 24) {
          if (state.v > V_CRASH_END) {
            failStage("과속으로 종점에 도달해 추락했습니다");
          } else {
            missStation("종점까지 멈추지 못했습니다");
          }
          state.s = Math.min(state.s, TRACK - 24);
        }
      }

      function bindHoldButton(button, onPress, onRelease) {
        if (!button) return;
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          onRelease?.();
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          startFromTouch();
          button.dataset.active = "true";
          onPress?.();
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function drawScene() {
        const cam = cameraX();
        const sky = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        sky.addColorStop(0, "#7dd3fc");
        sky.addColorStop(0.6, "#e0f2fe");
        sky.addColorStop(1, "#bae6fd");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        // 원경 산
        ctx.fillStyle = "#a8b8c8";
        ctx.beginPath();
        ctx.moveTo(0, VIEW.height);
        for (let x = 0; x <= VIEW.width; x += 20) {
          ctx.lineTo(x, 260 + 60 * Math.sin((x + cam * 0.3) / 210));
        }
        ctx.lineTo(VIEW.width, VIEW.height);
        ctx.closePath();
        ctx.fill();

        // 지형
        ctx.fillStyle = "#4d7c5a";
        ctx.beginPath();
        ctx.moveTo(0, VIEW.height);
        for (let x = 0; x <= VIEW.width; x += 8) {
          ctx.lineTo(x, terrainY(x + cam) + 60);
        }
        ctx.lineTo(VIEW.width, VIEW.height);
        ctx.closePath();
        ctx.fill();

        // 케이블
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= VIEW.width; x += 8) {
          const y = terrainY(x + cam) - CABLE_DROP;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // 타워
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 5;
        for (let s = 120; s < TRACK; s += 230) {
          const x = s - cam;
          if (x < -20 || x > VIEW.width + 20) continue;
          const topY = terrainY(s) - CABLE_DROP;
          const baseY = terrainY(s) + 60;
          ctx.beginPath();
          ctx.moveTo(x, baseY);
          ctx.lineTo(x, topY);
          ctx.moveTo(x - 16, topY + 4);
          ctx.lineTo(x + 16, topY + 4);
          ctx.stroke();
        }

        // 역 플랫폼 + 정지 구역
        STATIONS.forEach((st, i) => {
          const x = st.s - cam;
          if (x < -140 || x > VIEW.width + 140) return;
          const gy = terrainY(st.s) + 58;
          ctx.fillStyle = "#78350f";
          ctx.fillRect(x - 70, gy, 140, 14);
          ctx.fillStyle = "#92400e";
          ctx.fillRect(x - 70, gy + 14, 10, 26);
          ctx.fillRect(x + 60, gy + 14, 10, 26);
          const zoneY = terrainY(st.s) - CABLE_DROP;
          ctx.fillStyle = i === state.target ? "rgba(34, 197, 94, 0.55)" : "rgba(148, 163, 184, 0.35)";
          ctx.fillRect(x - ZONE_HALF, zoneY - 6, ZONE_HALF * 2, 12);
          ctx.strokeStyle = i === state.target ? "#15803d" : "#64748b";
          ctx.lineWidth = 2;
          ctx.strokeRect(x - ZONE_HALF, zoneY - 6, ZONE_HALF * 2, 12);
          ctx.fillStyle = i < state.parked ? "#15803d" : "#0f172a";
          ctx.font = "800 18px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText(i < state.parked ? `${st.name} ✓` : st.name, x, gy - 8);
        });

        // 케이블카
        const carX = state.s - cam;
        const cableY = terrainY(state.s) - CABLE_DROP;
        const bodyY = cableY + 46;
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(carX, cableY);
        ctx.lineTo(carX, bodyY - 22);
        ctx.stroke();
        const tilt = terrainSlope(state.s) * 0.35;
        ctx.save();
        ctx.translate(carX, bodyY);
        ctx.rotate(tilt);
        ctx.fillStyle = state.v > V_DANGER ? "#dc2626" : "#e11d48";
        ctx.fillRect(-34, -22, 68, 48);
        ctx.fillStyle = "#bae6fd";
        ctx.fillRect(-26, -14, 52, 22);
        ctx.strokeStyle = "#7f1d1d";
        ctx.lineWidth = 3;
        ctx.strokeRect(-34, -22, 68, 48);
        ctx.restore();

        drawHud();
        drawToast();
      }

      function drawHud() {
        ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
        ctx.fillRect(0, 0, VIEW.width, 58);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "700 20px Trebuchet MS";
        ctx.textAlign = "left";
        ctx.fillText(`정차 ${state.parked}/${STATIONS.length}`, 18, 26);
        ctx.fillStyle = state.misses > 0 ? "#fca5a5" : "#f8fafc";
        ctx.fillText(`실패 ${state.misses}/${MAX_MISSES}`, 18, 50);

        // 속도계
        const bx = 220;
        const bw = 320;
        ctx.fillStyle = "rgba(248,250,252,0.25)";
        ctx.fillRect(bx, 18, bw, 22);
        const ratio = state.v / V_MAX;
        ctx.fillStyle = state.v > V_DANGER ? "#ef4444" : "#38bdf8";
        ctx.fillRect(bx, 18, bw * ratio, 22);
        const dangerX = bx + bw * (V_DANGER / V_MAX);
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(dangerX, 14);
        ctx.lineTo(dangerX, 44);
        ctx.stroke();
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 18px Trebuchet MS";
        ctx.fillText(`${Math.round(state.v * 0.36)} km/h`, bx + bw + 12, 35);

        const st = STATIONS[state.target];
        if (st) {
          const dist = Math.max(0, Math.round(st.s - state.s));
          ctx.textAlign = "right";
          ctx.fillStyle = "#fde68a";
          ctx.fillText(`다음 역까지 ${dist}m`, VIEW.width - 20, 30);
          ctx.textAlign = "left";
        }
      }

      function drawToast() {
        if (!state.toast || state.elapsed > state.toast.until) return;
        ctx.save();
        ctx.font = "800 26px Trebuchet MS";
        ctx.textAlign = "center";
        const w = ctx.measureText(state.toast.text).width + 48;
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(VIEW.width / 2 - w / 2, 74, w, 46);
        ctx.fillStyle = "#fde68a";
        ctx.fillText(state.toast.text, VIEW.width / 2, 106);
        ctx.restore();
        ctx.textAlign = "left";
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.94)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(108, 72, 744, 396);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(108, 72, 744, 396);

        ctx.fillStyle = accent;
        ctx.font = "700 40px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 142);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 23px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 214 + index * 44);
        });
        ctx.textAlign = "left";
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("케이블카 기사", [
            "속도를 조절해 케이블카를 역에 정확히 세우세요",
            "조작: 터치 유지로 가속, 떼면 감속 (스페이스 키 홀드도 가능)",
            "클리어 조건: 3개 역에 모두 정확히 정차하면 클리어",
            "실패 조건: 정차 실패 3회 또는 추락 시 실패",
            "녹색 구역 안에서 속도 0이 되어야 정차됩니다",
            "화면 터치 또는 Enter로 시작",
          ], "#0369a1");
          return;
        }

        if (state.mode === "running") {
          drawScene();
          return;
        }

        if (state.mode === "failed") {
          renderCard("운행 실패", [
            `원인: ${state.failReason || "정차 실패 3회 또는 추락 시 실패"}`,
            `정차 성공: ${state.parked}/${STATIONS.length}개 역`,
            "공유 목숨 1개가 즉시 종료되었습니다.",
            "화면 터치 또는 Enter로 다시 도전할 수 있습니다",
          ], "#b91c1c");
          return;
        }

        renderCard("모든 역 정차 완료!", [
          "3개 역에 모두 정확히 정차했습니다!",
          `소요 시간 ${state.lastRunTime.toFixed(1)}초`,
          "호스트가 다음 미플레이 스테이지를 랜덤으로 선택합니다.",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          mode: state.mode,
          position: Math.round(state.s),
          speed: Math.round(state.v),
          stations_parked: state.parked,
          stations_total: STATIONS.length,
          misses: state.misses,
          next_station_distance: STATIONS[state.target] ? Math.max(0, Math.round(STATIONS[state.target].s - state.s)) : null,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          fail_reason: state.failReason,
          note: state.note,
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode !== "running") {
          event.preventDefault();
          startStage();
          return;
        }
        if (state.mode !== "running") return;
        if (event.key === " " || event.key === "ArrowRight" || event.key === "ArrowUp") {
          event.preventDefault();
          state.hold = true;
        }
      }

      function onKeyUp(event) {
        if (event.key === " " || event.key === "ArrowRight" || event.key === "ArrowUp") {
          event.preventDefault();
          state.hold = false;
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "cable-car",
        title: "케이블카 기사",
        creator: "Anonymous Creator",
        genre: "Speed control",
        clearCondition: "3개 역에 모두 정확히 정차하면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
          return;
        }
        event.preventDefault();
        state.hold = true;
        canvas.setPointerCapture?.(event.pointerId);
      });
      const releaseHold = (event) => {
        if (event) event.preventDefault();
        state.hold = false;
      };
      canvas.addEventListener("pointerup", releaseHold);
      canvas.addEventListener("pointercancel", releaseHold);
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      bindHoldButton(
        document.querySelector("#hold-btn"),
        () => {
          state.hold = true;
        },
        () => {
          state.hold = false;
        }
      );

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
