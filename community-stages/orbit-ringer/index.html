<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>오르빗 링</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        background: #04060f;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }
      body { display: grid; place-items: center; }
      .skip-link {
        position: fixed; left: 12px; top: 12px; z-index: 20;
        width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);
        padding: 0; border-radius: 999px; background: #7de0ff; color: #04060f;
        font-weight: 800; text-decoration: none;
      }
      .skip-link:focus, .skip-link:focus-visible {
        width: auto; height: auto; overflow: visible; clip-path: none; padding: 11px 16px;
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
      .stage {
        position: relative;
        width: min(100vw, calc(100svh * 16 / 9));
        height: min(100svh, max(min(220px, 100svh), calc(100vw * 9 / 16)));
        max-width: 100%; max-height: 100%;
      }
      canvas {
        position: absolute; inset: 0;
        display: block; width: 100%; height: 100%;
        max-width: 100%; max-height: 100%;
        background: #04060f; touch-action: none; -webkit-tap-highlight-color: transparent;
      }
      #hud { background: transparent; }
      #hud:focus-visible { outline: 4px solid #7de0ff; outline-offset: -7px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important; scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#hud">게임 화면으로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">오르빗 링. 빛나는 링 게이트를 뚫고 나가는 3D 우주 비행. 화면 터치 드래그 또는 방향키로 기수를 조준해 다가오는 링의 중심을 통과하세요. 55초 안에 링 게이트 12개를 통과하면 클리어. 게이트 3회 미스 또는 유성 충돌 시 실패. 캔버스를 터치하거나 Enter로 시작합니다. 모바일에서는 화면을 터치한 채 드래그해 조준합니다.</p>
    <main class="stage" aria-label="오르빗 링 게임 영역">
      <canvas id="game" width="960" height="540" aria-hidden="true"></canvas>
      <canvas id="hud" width="960" height="540" tabindex="0" aria-label="오르빗 링" aria-describedby="stage-instructions"></canvas>
    </main>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script src="../vendor/three/three.min.js"></script>
    <script>
      (() => {
        "use strict";

        const VIEW_W = 960;
        const VIEW_H = 540;
        const FIXED_DT = 1 / 60;
        const MAX_DT = 1 / 20;
        const DURATION = 55;
        const GOAL_GATES = 12;
        const MAX_MISSES = 3;
        const BOUNDS = { x: 7, y: 4.2 };
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const META = {
          id: "orbit-ringer",
          title: "오르빗 링",
          description: "빛나는 링 게이트를 뚫고 나가는 3D 우주 비행.",
          creator: "jungcollin",
          genre: "3D rail flight",
          clearCondition: "55초 안에 링 게이트 12개 통과",
          failCondition: "게이트 3회 미스 또는 충돌 시 실패",
          controls: "드래그 또는 방향키로 기수 조준",
        };
        const COLORS = {
          space: "#04060f",
          ink: "#e6f6ff",
          cyan: "#7de0ff",
          amber: "#ffb454",
          magenta: "#c98bff",
          danger: "#ff6b6b",
        };
        const relayContext = window.RelayRuntime?.readContext(META.id) || {
          history: [], clearCount: 0, previousStageId: null,
        };

        // --- Seeded RNG (run 단위 재현 가능) ---
        let runSeed = 1;
        function reseed(seed) { runSeed = seed >>> 0 || 1; }
        function random() {
          runSeed = (runSeed + 0x6D2B79F5) >>> 0;
          let t = runSeed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        function randRange(lo, hi) { return lo + random() * (hi - lo); }

        // --- Plain game state (WebGL 없이도 동작) ---
        const state = {
          mode: "menu",
          elapsed: 0,
          lastRunTime: 0,
          gates: 0,
          misses: 0,
          speed: 14,
          ship: { x: 0, y: 0, vx: 0, vy: 0 },
          rings: [],
          meteors: [],
          particles: [],
          flash: 0,
          shake: 0,
          message: "",
          messageTime: 0,
          failReason: "",
        };
        const input = { left: false, right: false, up: false, down: false, dragging: false, targetX: 0, targetY: 0, hasTarget: false };

        function difficultyAt(seconds) {
          const difficulty = Math.max(0, Math.min(1, Number(seconds || 0) / DURATION));
          return {
            difficulty,
            phase: Math.min(3, 1 + Math.floor(difficulty * 3)),
            speed: 14 + difficulty * 10,
            ringRadius: 2.4 - difficulty * 0.9,
            ringSpacing: 26 - difficulty * 8,
            ringWander: 0.4 + difficulty * 1.6,
            meteorEvery: seconds < 8 ? Infinity : 3.2 - difficulty * 1.4,
            meteorMax: seconds < 8 ? 0 : 2 + Math.floor(difficulty * 3),
          };
        }

        function spawnRing(z) {
          const params = difficultyAt(state.elapsed);
          const margin = params.ringRadius + 0.6;
          state.rings.push({
            x: randRange(-(BOUNDS.x - margin), BOUNDS.x - margin),
            y: randRange(-(BOUNDS.y - margin * 0.7), BOUNDS.y - margin * 0.7),
            z,
            radius: params.ringRadius,
            resolved: false,
            passed: false,
          });
        }
        function spawnMeteor() {
          const params = difficultyAt(state.elapsed);
          if (state.meteors.length >= params.meteorMax) return;
          let x = randRange(-BOUNDS.x, BOUNDS.x);
          let y = randRange(-BOUNDS.y, BOUNDS.y);
          // 활성 링 경로를 막지 않도록 모든 미해결 링 중심과 거리를 둔다
          for (let attempt = 0; attempt < 6; attempt += 1) {
            const blocks = state.rings.some((ring) => !ring.resolved && Math.hypot(x - ring.x, y - ring.y) < 3.2);
            if (!blocks) break;
            x = randRange(-BOUNDS.x, BOUNDS.x);
            y = randRange(-BOUNDS.y, BOUNDS.y);
          }
          state.meteors.push({ x, y, z: -150, vx: randRange(-0.8, 0.8), vy: randRange(-0.5, 0.5), r: randRange(0.55, 0.9), spin: randRange(0.5, 2) });
        }

        function resetState() {
          state.elapsed = 0;
          state.lastRunTime = 0;
          state.gates = 0;
          state.misses = 0;
          state.speed = 14;
          state.ship = { x: 0, y: 0, vx: 0, vy: 0 };
          state.rings = [];
          state.meteors = [];
          state.particles = [];
          state.flash = 0;
          state.shake = 0;
          state.message = "";
          state.messageTime = 0;
          state.failReason = "";
          state.meteorTimer = 0;
          reseed((Date.now() ^ 0x9e3779b9) >>> 0);
          spawnRing(-70);
          spawnRing(-70 - difficultyAt(0).ringSpacing);
          hostClearReported = false;
          hostFailReported = false;
        }

        let hostReadyReported = false;
        let hostClearReported = false;
        let hostFailReported = false;
        function inRelayHost() {
          try { return window.parent && window.parent !== window && window.RelayStageHost; }
          catch (_error) { return false; }
        }
        function reportReady() {
          if (!inRelayHost() || hostReadyReported) return;
          hostReadyReported = true;
          window.RelayStageHost.onStageReady?.(window.relayStageMeta);
        }
        function reportClear() {
          if (!inRelayHost() || hostClearReported) return;
          hostClearReported = true;
          window.RelayStageHost.onStageCleared?.({
            stageId: META.id,
            stageTitle: META.title,
            clearCountAfter: relayContext.clearCount + 1,
            durationSec: Number(state.lastRunTime.toFixed(1)),
          });
        }
        function reportFail(reason) {
          if (!inRelayHost() || hostFailReported) return;
          hostFailReported = true;
          window.RelayStageHost.onStageFailed?.({
            stageId: META.id,
            stageTitle: META.title,
            reason,
            durationSec: Number(state.lastRunTime.toFixed(1)),
          });
        }
        function startStage() {
          if (state.mode === "running") return;
          resetState();
          state.mode = "running";
          window.relayStageResult.status = "running";
        }
        function clearStage() {
          if (state.mode !== "running") return;
          state.mode = "cleared";
          state.lastRunTime = state.elapsed;
          window.relayStageResult.status = "cleared";
          reportClear();
        }
        function failStage(reason) {
          if (state.mode !== "running") return;
          state.mode = "failed";
          state.lastRunTime = state.elapsed;
          state.failReason = reason;
          window.relayStageResult.status = "failed";
          reportFail(reason);
        }

        function burst(x, y, z, count) {
          const amount = reducedMotion ? Math.min(5, count) : count;
          for (let index = 0; index < amount; index += 1) {
            const angle = (Math.PI * 2 * index) / amount;
            state.particles.push({
              x, y, z,
              vx: Math.cos(angle) * randRange(2, 5),
              vy: Math.sin(angle) * randRange(2, 5),
              vz: randRange(-2, 6),
              life: randRange(0.4, 0.8),
            });
          }
        }

        function update(dt) {
          state.flash = Math.max(0, state.flash - dt * 2.4);
          state.shake = Math.max(0, state.shake - dt * 3.2);
          state.messageTime = Math.max(0, state.messageTime - dt);
          if (state.mode !== "running") return;

          state.elapsed += dt;
          const params = difficultyAt(state.elapsed);
          state.speed = params.speed;

          // Ship control
          const accel = 46;
          let ax = 0;
          let ay = 0;
          if (input.left) ax -= 1;
          if (input.right) ax += 1;
          if (input.up) ay += 1;
          if (input.down) ay -= 1;
          if (input.hasTarget) {
            state.ship.vx += Math.max(-1, Math.min(1, (input.targetX - state.ship.x) / 1.6)) * accel * dt;
            state.ship.vy += Math.max(-1, Math.min(1, (input.targetY - state.ship.y) / 1.6)) * accel * dt;
          }
          state.ship.vx += ax * accel * dt;
          state.ship.vy += ay * accel * dt;
          const damping = Math.pow(0.12, dt);
          state.ship.vx *= damping;
          state.ship.vy *= damping;
          const maxV = 11;
          state.ship.vx = Math.max(-maxV, Math.min(maxV, state.ship.vx));
          state.ship.vy = Math.max(-maxV, Math.min(maxV, state.ship.vy));
          state.ship.x = Math.max(-BOUNDS.x, Math.min(BOUNDS.x, state.ship.x + state.ship.vx * dt));
          state.ship.y = Math.max(-BOUNDS.y, Math.min(BOUNDS.y, state.ship.y + state.ship.vy * dt));

          // Rings move toward the ship
          state.rings.forEach((ring) => {
            ring.z += state.speed * dt;
            ring.x += Math.sin(state.elapsed * 0.9 + ring.radius * 3) * params.ringWander * 0.12 * dt;
            if (!ring.resolved && ring.z > 1.2) {
              ring.resolved = true;
              const gap = Math.hypot(state.ship.x - ring.x, state.ship.y - ring.y);
              if (gap <= ring.radius - 0.35) {
                ring.passed = true;
                state.gates += 1;
                state.flash = 0.5;
                state.message = `GATE ${state.gates}/${GOAL_GATES}`;
                state.messageTime = 0.9;
                burst(ring.x, ring.y, 0, 16);
                if (state.gates >= GOAL_GATES) clearStage();
              } else {
                state.misses += 1;
                state.shake = reducedMotion ? 0.08 : 0.35;
                state.message = `MISS ${state.misses}/${MAX_MISSES}`;
                state.messageTime = 1;
                if (state.misses >= MAX_MISSES) failStage("gate_missed_3");
              }
            }
          });
          state.rings = state.rings.filter((ring) => ring.z < 12);
          const lastRing = state.rings[state.rings.length - 1];
          if (lastRing && lastRing.z > -140 + params.ringSpacing) {
            spawnRing(-150);
          }

          // Meteors
          state.meteorTimer = (state.meteorTimer || 0) + dt;
          if (state.meteorTimer >= params.meteorEvery) {
            state.meteorTimer = 0;
            spawnMeteor();
          }
          state.meteors.forEach((meteor) => {
            meteor.z += (state.speed * 0.92) * dt;
            meteor.x += meteor.vx * dt;
            meteor.y += meteor.vy * dt;
            if (Math.abs(meteor.z) < 1.4 && Math.hypot(state.ship.x - meteor.x, state.ship.y - meteor.y) < meteor.r + 0.75) {
              failStage("meteor_collision");
            }
          });
          state.meteors = state.meteors.filter((meteor) => meteor.z < 10);

          // Particles
          state.particles.forEach((particle) => {
            particle.x += particle.vx * dt;
            particle.y += particle.vy * dt;
            particle.z += (particle.vz + state.speed * 0.6) * dt;
            particle.life -= dt;
          });
          state.particles = state.particles.filter((particle) => particle.life > 0 && particle.z < 8);

          if (state.elapsed >= DURATION && state.mode === "running") failStage("time_limit");
        }

        // --- Three.js view (optional at runtime) ---
        const glCanvas = document.querySelector("#game");
        const hudCanvas = document.querySelector("#hud");
        const hud = hudCanvas.getContext("2d");
        let webgl = null;

        function setupThree() {
          if (typeof THREE === "undefined") return null;
          let renderer;
          try {
            renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
          } catch (_error) {
            return null;
          }
          renderer.setPixelRatio(1);
          renderer.setSize(VIEW_W, VIEW_H, false);

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x04060f);
          scene.fog = new THREE.Fog(0x04060f, 30, 150);

          const camera = new THREE.PerspectiveCamera(62, VIEW_W / VIEW_H, 0.1, 220);
          camera.position.set(0, 1.4, 7.5);

          scene.add(new THREE.AmbientLight(0x8899ff, 0.4));
          const key = new THREE.DirectionalLight(0xffffff, 0.9);
          key.position.set(4, 6, 8);
          scene.add(key);
          const engine = new THREE.PointLight(0x7de0ff, 1.4, 18);
          engine.position.set(0, 0, 2);
          scene.add(engine);

          // Starfield
          const starCount = reducedMotion ? 250 : 600;
          const starPositions = new Float32Array(starCount * 3);
          for (let index = 0; index < starCount; index += 1) {
            starPositions[index * 3] = (Math.random() - 0.5) * 90;
            starPositions[index * 3 + 1] = (Math.random() - 0.5) * 60;
            starPositions[index * 3 + 2] = -Math.random() * 180;
          }
          const starGeometry = new THREE.BufferGeometry();
          starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
          const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xdceaff, size: 0.34, sizeAttenuation: true }));
          scene.add(stars);

          // Nebula glow discs
          const nebulaMaterial = new THREE.MeshBasicMaterial({ color: 0x1b2a55, transparent: true, opacity: 0.5, depthWrite: false });
          const nebula = new THREE.Mesh(new THREE.CircleGeometry(46, 40), nebulaMaterial);
          nebula.position.set(-26, 14, -160);
          scene.add(nebula);
          const nebula2 = new THREE.Mesh(new THREE.CircleGeometry(30, 40), new THREE.MeshBasicMaterial({ color: 0x3a1b4f, transparent: true, opacity: 0.4, depthWrite: false }));
          nebula2.position.set(30, -16, -150);
          scene.add(nebula2);

          // Ship
          const ship = new THREE.Group();
          const hullMaterial = new THREE.MeshStandardMaterial({ color: 0xdde8f5, metalness: 0.65, roughness: 0.3 });
          const hull = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.5, 12), hullMaterial);
          hull.rotation.x = -Math.PI / 2;
          ship.add(hull);
          const wingMaterial = new THREE.MeshStandardMaterial({ color: 0x2a4a7a, metalness: 0.4, roughness: 0.5 });
          [-1, 1].forEach((side) => {
            const wing = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.55), wingMaterial);
            wing.position.set(side * 0.62, 0, 0.42);
            wing.rotation.z = side * -0.22;
            ship.add(wing);
          });
          const glow = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 10, 10),
            new THREE.MeshBasicMaterial({ color: 0x7de0ff, transparent: true, opacity: 0.9 })
          );
          glow.position.z = 0.86;
          ship.add(glow);
          scene.add(ship);

          const ringGeometry = new THREE.TorusGeometry(1, 0.09, 12, 40);
          const ringMaterial = new THREE.MeshStandardMaterial({
            color: 0x123244, emissive: 0x7de0ff, emissiveIntensity: 1.6, metalness: 0.3, roughness: 0.35,
          });
          const ringPassedMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2440, emissive: 0xffb454, emissiveIntensity: 1.4, metalness: 0.3, roughness: 0.35,
          });
          const meteorGeometry = new THREE.IcosahedronGeometry(1, 0);
          const meteorMaterial = new THREE.MeshStandardMaterial({ color: 0x6b5648, metalness: 0.15, roughness: 0.9 });
          const particleGeometry = new THREE.SphereGeometry(0.07, 6, 6);
          const particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffd18a });

          return {
            renderer, scene, camera, engine, stars, ship, glow,
            ringGeometry, ringMaterial, ringPassedMaterial,
            meteorGeometry, meteorMaterial, particleGeometry, particleMaterial,
            ringMeshes: new Map(), meteorMeshes: new Map(), particleMeshes: [],
          };
        }

        function syncMeshes() {
          if (!webgl) return;
          const seenRings = new Set();
          state.rings.forEach((ring, index) => {
            const key = index;
            seenRings.add(key);
            let mesh = webgl.ringMeshes.get(key);
            if (!mesh) {
              mesh = new THREE.Mesh(webgl.ringGeometry, webgl.ringMaterial);
              webgl.scene.add(mesh);
              webgl.ringMeshes.set(key, mesh);
            }
            mesh.position.set(ring.x, ring.y, ring.z);
            mesh.scale.setScalar(ring.radius);
            mesh.material = ring.passed ? webgl.ringPassedMaterial : webgl.ringMaterial;
            mesh.rotation.z = reducedMotion ? 0 : state.elapsed * 0.6 + index;
          });
          webgl.ringMeshes.forEach((mesh, key) => {
            if (!seenRings.has(key)) {
              webgl.scene.remove(mesh);
              webgl.ringMeshes.delete(key);
            }
          });

          const seenMeteors = new Set();
          state.meteors.forEach((meteor, index) => {
            const key = index;
            seenMeteors.add(key);
            let mesh = webgl.meteorMeshes.get(key);
            if (!mesh) {
              mesh = new THREE.Mesh(webgl.meteorGeometry, webgl.meteorMaterial);
              webgl.scene.add(mesh);
              webgl.meteorMeshes.set(key, mesh);
            }
            mesh.position.set(meteor.x, meteor.y, meteor.z);
            mesh.scale.setScalar(meteor.r);
            mesh.rotation.x = reducedMotion ? 0 : state.elapsed * meteor.spin;
            mesh.rotation.y = reducedMotion ? 0 : state.elapsed * meteor.spin * 0.7;
          });
          webgl.meteorMeshes.forEach((mesh, key) => {
            if (!seenMeteors.has(key)) {
              webgl.scene.remove(mesh);
              webgl.meteorMeshes.delete(key);
            }
          });

          while (webgl.particleMeshes.length < state.particles.length) {
            const mesh = new THREE.Mesh(webgl.particleGeometry, webgl.particleMaterial.clone());
            webgl.scene.add(mesh);
            webgl.particleMeshes.push(mesh);
          }
          webgl.particleMeshes.forEach((mesh, index) => {
            const particle = state.particles[index];
            if (!particle) { mesh.visible = false; return; }
            mesh.visible = true;
            mesh.position.set(particle.x, particle.y, particle.z);
            mesh.material.opacity = Math.max(0, Math.min(1, particle.life * 1.6));
            mesh.material.transparent = true;
          });

          webgl.ship.position.set(state.ship.x, state.ship.y, 0);
          webgl.ship.rotation.z = -state.ship.vx * 0.055;
          webgl.ship.rotation.x = state.ship.vy * 0.03;
          webgl.engine.position.set(state.ship.x, state.ship.y, 1.6);
          webgl.glow.scale.setScalar(1 + Math.min(1, Math.hypot(state.ship.vx, state.ship.vy) / 11) * 0.8);

          const positions = webgl.stars.geometry.attributes.position;
          for (let index = 0; index < positions.count; index += 1) {
            let z = positions.getZ(index) + state.speed * FIXED_DT * 0.55;
            if (z > 6) z -= 186;
            positions.setZ(index, z);
          }
          positions.needsUpdate = true;
        }

        function renderScene() {
          if (!webgl) return;
          const speedRatio = (state.speed - 14) / 10;
          const targetFov = 62 + speedRatio * 10;
          webgl.camera.fov += (targetFov - webgl.camera.fov) * 0.06;
          webgl.camera.updateProjectionMatrix();
          const shakeX = state.shake > 0 ? (Math.random() - 0.5) * state.shake * 0.7 : 0;
          const shakeY = state.shake > 0 ? (Math.random() - 0.5) * state.shake * 0.7 : 0;
          webgl.camera.position.x += (state.ship.x * 0.34 + shakeX - webgl.camera.position.x) * 0.08;
          webgl.camera.position.y += (1.4 + state.ship.y * 0.26 + shakeY - webgl.camera.position.y) * 0.08;
          webgl.camera.lookAt(state.ship.x * 0.5, state.ship.y * 0.45, -14);
          syncMeshes();
          webgl.renderer.render(webgl.scene, webgl.camera);
        }

        // --- 2D overlay (HUD & cards) ---
        function roundRect(x, y, width, height, radius) {
          hud.beginPath();
          hud.roundRect(x, y, width, height, radius);
        }
        function drawHud() {
          const params = difficultyAt(state.elapsed);
          const entries = [
            ["GATE", `${state.gates}/${GOAL_GATES}`, COLORS.cyan],
            ["MISS", `${state.misses}/${MAX_MISSES}`, state.misses ? COLORS.danger : COLORS.ink],
            ["TIME", `${Math.max(0, DURATION - state.elapsed).toFixed(1)}`, COLORS.ink],
            ["SPEED", `${Math.round(state.speed * 6)}kt`, COLORS.amber],
          ];
          entries.forEach(([label, value, color], index) => {
            const x = 22 + index * 168;
            roundRect(x, 14, 150, 46, 10);
            hud.fillStyle = "rgba(4,6,15,0.78)"; hud.fill();
            hud.strokeStyle = "rgba(125,224,255,0.25)"; hud.lineWidth = 1.5; hud.stroke();
            hud.fillStyle = "rgba(230,246,255,0.6)";
            hud.font = "700 10px Trebuchet MS, sans-serif";
            hud.fillText(label, x + 12, 31);
            hud.fillStyle = color;
            hud.font = "800 19px Trebuchet MS, sans-serif";
            hud.fillText(value, x + 12, 52);
          });
          hud.textAlign = "right";
          hud.fillStyle = COLORS.magenta;
          hud.font = "800 12px Trebuchet MS, sans-serif";
          hud.fillText(`PHASE ${params.phase}/3`, VIEW_W - 24, 34);
          hud.textAlign = "left";

          // Next-ring aim assist: project next ring onto screen
          const next = state.rings.find((ring) => !ring.resolved);
          if (next && next.z < -4) {
            const screenX = VIEW_W / 2 + (next.x - state.ship.x * 0.5) * 38;
            const screenY = VIEW_H / 2 - (next.y - state.ship.y * 0.45) * 38;
            const scale = Math.max(0.25, Math.min(1, -next.z / 90));
            hud.save();
            hud.strokeStyle = `rgba(125,224,255,${0.25 + scale * 0.4})`;
            hud.lineWidth = 2;
            hud.setLineDash([6, 8]);
            hud.beginPath();
            hud.arc(screenX, screenY, next.radius * 38 * (0.5 + scale * 0.5), 0, Math.PI * 2);
            hud.stroke();
            hud.setLineDash([]);
            hud.restore();
          }

          if (state.messageTime > 0) {
            hud.save();
            hud.globalAlpha = Math.min(1, state.messageTime * 2);
            hud.textAlign = "center";
            hud.fillStyle = state.message.startsWith("MISS") ? COLORS.danger : COLORS.amber;
            hud.font = "900 30px Trebuchet MS, sans-serif";
            hud.fillText(state.message, VIEW_W / 2, 120);
            hud.restore();
          }
          if (state.flash > 0) {
            hud.fillStyle = `rgba(125,224,255,${state.flash * 0.12})`;
            hud.fillRect(0, 0, VIEW_W, VIEW_H);
          }
        }
        function drawCard(kind) {
          hud.fillStyle = "rgba(4,6,15,0.9)";
          hud.fillRect(0, 0, VIEW_W, VIEW_H);
          roundRect(128, 84, 704, 372, 22);
          hud.fillStyle = "rgba(13,22,44,0.96)"; hud.fill();
          hud.strokeStyle = kind === "failed" ? COLORS.danger : COLORS.cyan;
          hud.lineWidth = 2.5; hud.stroke();
          hud.textAlign = "center";
          hud.fillStyle = kind === "failed" ? COLORS.danger : COLORS.cyan;
          hud.font = "800 13px Trebuchet MS, sans-serif";
          hud.fillText("ORBIT RING RELAY · SECTOR 7", VIEW_W / 2, 122);
          hud.fillStyle = COLORS.ink;
          hud.font = "900 44px Trebuchet MS, sans-serif";
          hud.fillText(kind === "menu" ? META.title : kind === "failed" ? "항해 중단" : "전 게이트 통과", VIEW_W / 2, 176);
          hud.font = "600 19px Trebuchet MS, sans-serif";
          hud.fillStyle = "rgba(230,246,255,0.82)";
          if (kind === "menu") {
            hud.fillText(META.description, VIEW_W / 2, 216);
            hud.fillStyle = COLORS.cyan;
            hud.font = "700 17px Trebuchet MS, sans-serif";
            hud.fillText(`조작 · ${META.controls}`, VIEW_W / 2, 258);
            hud.fillStyle = "rgba(230,246,255,0.74)";
            hud.font = "600 16px Trebuchet MS, sans-serif";
            hud.fillText(`클리어 · ${META.clearCondition}`, VIEW_W / 2, 296);
            hud.fillText(`실패 · ${META.failCondition}`, VIEW_W / 2, 324);
            hud.fillText("유성에 부딪히면 즉시 실패합니다", VIEW_W / 2, 352);
            hud.fillStyle = COLORS.amber;
            hud.font = "800 18px Trebuchet MS, sans-serif";
            hud.fillText("화면 터치 또는 Enter로 출발", VIEW_W / 2, 410);
          } else if (kind === "failed") {
            const reasons = {
              gate_missed_3: "게이트를 3회 놓쳤습니다",
              meteor_collision: "유성과 충돌했습니다",
              time_limit: "제한 시간 55초 초과",
              debug_force_fail: "디버그 강제 실패",
            };
            hud.fillText(reasons[state.failReason] || META.failCondition, VIEW_W / 2, 232);
            hud.fillStyle = COLORS.amber;
            hud.font = "800 23px Trebuchet MS, sans-serif";
            hud.fillText(`GATE ${state.gates}/${GOAL_GATES}`, VIEW_W / 2, 286);
            hud.fillStyle = "rgba(230,246,255,0.62)";
            hud.font = "600 16px Trebuchet MS, sans-serif";
            hud.fillText("공유 목숨이 소진되었습니다.", VIEW_W / 2, 340);
          } else {
            hud.fillText("열두 개의 링을 빠짐없이 꿰뚫었습니다.", VIEW_W / 2, 232);
            hud.fillStyle = COLORS.amber;
            hud.font = "800 25px Trebuchet MS, sans-serif";
            hud.fillText(`${state.lastRunTime.toFixed(1)}초 · 미스 ${state.misses}회`, VIEW_W / 2, 288);
            hud.fillStyle = "rgba(230,246,255,0.62)";
            hud.font = "600 16px Trebuchet MS, sans-serif";
            hud.fillText(META.clearCondition, VIEW_W / 2, 340);
          }
          hud.textAlign = "left";
        }

        function render() {
          hud.clearRect(0, 0, VIEW_W, VIEW_H);
          if (!webgl) {
            hud.fillStyle = COLORS.space;
            hud.fillRect(0, 0, VIEW_W, VIEW_H);
            if (state.mode === "running") {
              hud.fillStyle = COLORS.ink;
              hud.font = "700 18px Trebuchet MS, sans-serif";
              hud.textAlign = "center";
              hud.fillText("이 환경에서는 WebGL을 사용할 수 없습니다", VIEW_W / 2, VIEW_H / 2 - 10);
              hud.textAlign = "left";
            }
          }
          if (state.mode === "menu") { drawCard("menu"); return; }
          if (state.mode === "failed") { drawCard("failed"); return; }
          if (state.mode === "cleared") { drawCard("cleared"); return; }
          renderScene();
          drawHud();
        }

        function renderGameToText() {
          const params = difficultyAt(state.elapsed);
          const next = state.rings.find((ring) => !ring.resolved) || null;
          return JSON.stringify({
            coordinate_system: "world units; ship plane z=0; rings approach +z",
            mode: state.mode,
            elapsed: Number(state.elapsed.toFixed(2)),
            difficulty: Number(params.difficulty.toFixed(3)),
            phase: params.phase,
            gates: state.gates,
            misses: state.misses,
            speed: Number(state.speed.toFixed(2)),
            ship: { x: Number(state.ship.x.toFixed(2)), y: Number(state.ship.y.toFixed(2)) },
            next_ring: next ? { x: Number(next.x.toFixed(2)), y: Number(next.y.toFixed(2)), z: Number(next.z.toFixed(1)), radius: Number(next.radius.toFixed(2)) } : null,
            meteors: state.meteors.map((meteor) => ({ x: Number(meteor.x.toFixed(2)), y: Number(meteor.y.toFixed(2)), z: Number(meteor.z.toFixed(1)), r: Number(meteor.r.toFixed(2)) })),
            webgl: Boolean(webgl),
            result: window.relayStageResult.status,
          });
        }

        // --- Input ---
        function pointerToWorld(event) {
          const rect = hudCanvas.getBoundingClientRect();
          const scale = Math.min(rect.width / VIEW_W, rect.height / VIEW_H);
          const contentWidth = VIEW_W * scale;
          const contentHeight = VIEW_H * scale;
          const left = rect.left + (rect.width - contentWidth) / 2;
          const top = rect.top + (rect.height - contentHeight) / 2;
          const px = (event.clientX - left) / scale;
          const py = (event.clientY - top) / scale;
          return {
            x: Math.max(-BOUNDS.x, Math.min(BOUNDS.x, ((px - VIEW_W / 2) / (VIEW_W / 2)) * (BOUNDS.x + 1))),
            y: Math.max(-BOUNDS.y, Math.min(BOUNDS.y, (-(py - VIEW_H / 2) / (VIEW_H / 2)) * (BOUNDS.y + 1))),
          };
        }
        function safeCapture(element, pointerId) {
          try { element.setPointerCapture?.(pointerId); } catch (_error) { /* synthetic pointer events */ }
        }
        function safeRelease(element, pointerId) {
          try { element.releasePointerCapture?.(pointerId); } catch (_error) { /* synthetic pointer events */ }
        }
        function onPointerDown(event) {
          event.preventDefault();
          hudCanvas.focus();
          if (state.mode !== "running") { startStage(); return; }
          input.dragging = true;
          const point = pointerToWorld(event);
          input.targetX = point.x;
          input.targetY = point.y;
          input.hasTarget = true;
          safeCapture(hudCanvas, event.pointerId);
        }
        function onPointerMove(event) {
          if (!input.dragging || state.mode !== "running") return;
          event.preventDefault();
          const point = pointerToWorld(event);
          input.targetX = point.x;
          input.targetY = point.y;
          input.hasTarget = true;
        }
        function onPointerUp(event) {
          input.dragging = false;
          input.hasTarget = false;
          safeRelease(hudCanvas, event.pointerId);
        }
        const keyMap = {
          ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
          ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
        };
        function onKeyDown(event) {
          if (event.key === "Enter" && state.mode !== "running") {
            event.preventDefault(); startStage(); return;
          }
          const name = keyMap[event.code];
          if (name) { event.preventDefault(); input[name] = true; }
        }
        function onKeyUp(event) {
          const name = keyMap[event.code];
          if (name) { event.preventDefault(); input[name] = false; }
        }

        let animationFrame = 0;
        let lastTimestamp = 0;
        function frame(timestamp) {
          const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
          lastTimestamp = timestamp;
          update(dt);
          render();
          animationFrame = requestAnimationFrame(frame);
        }

        window.relayStageMeta = {
          id: META.id, title: META.title, creator: META.creator,
          genre: META.genre, clearCondition: META.clearCondition,
        };
        window.relayStageResult = { status: "menu" };
        window.render_game_to_text = renderGameToText;
        window.advanceTime = (ms = 16.67) => {
          const steps = Math.max(1, Math.round(Number(ms) / (FIXED_DT * 1000)));
          for (let index = 0; index < steps; index += 1) update(FIXED_DT);
          render();
          return renderGameToText();
        };
        window.relayStageDebug = {
          forceClear() { if (state.mode !== "running") startStage(); state.gates = GOAL_GATES; clearStage(); render(); },
          forceFail() { if (state.mode !== "running") startStage(); failStage("debug_force_fail"); render(); },
          difficultyAt(seconds) { return difficultyAt(seconds); },
          setShip(x, y) {
            state.ship.x = Math.max(-BOUNDS.x, Math.min(BOUNDS.x, Number(x)));
            state.ship.y = Math.max(-BOUNDS.y, Math.min(BOUNDS.y, Number(y)));
          },
          aimNextRing() {
            const next = state.rings.find((ring) => !ring.resolved);
            if (!next) return null;
            state.ship.x = next.x;
            state.ship.y = next.y;
            return { x: next.x, y: next.y, z: next.z, radius: next.radius };
          },
        };

        const stageEl = document.querySelector(".stage");
        stageEl.addEventListener("pointerdown", onPointerDown, { passive: false });
        window.addEventListener("pointermove", onPointerMove, { passive: false });
        window.addEventListener("pointerup", onPointerUp);
        window.addEventListener("pointercancel", onPointerUp);
        window.addEventListener("keydown", onKeyDown);
        window.addEventListener("keyup", onKeyUp);
        window.addEventListener("blur", () => {
          Object.keys(input).forEach((key) => { if (typeof input[key] === "boolean") input[key] = false; });
        });
        window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

        webgl = setupThree();
        resetState();
        state.mode = "menu";
        window.relayStageResult.status = "menu";
        reportReady();
        render();
        animationFrame = requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
