<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>댐 수문장</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">댐 수문장. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 터치로 수문 열기/닫기 입니다. 화면 하단의 수문 세 개를 터치해 개폐하고, 수위 게이지가 녹색 안전 구간을 유지하도록 유입량과 방류량을 맞추세요. 수위가 위험선에 닿으면 즉시 실패하고 60초를 버티면 클리어합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="댐 수문장" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <script src="../relay-runtime.js"></script>
    <!-- Optional: ../sdk/v2/relay-sdk.js for the v2 host contract. Legacy RelayStageHost callbacks remain required. -->
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("dam-gate") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      const DURATION = 60;
      const LEVEL_MIN = 0;
      const LEVEL_MAX = 100;
      const SAFE_LOW = 30;
      const SAFE_HIGH = 70;
      const DANGER_LOW = 8;
      const DANGER_HIGH = 92;
      const GATE_COUNT = 3;
      const GATE_MAX_RATE = 24; // 수위 단위/초 (수문 1개 완전 개방 시)
      const GATE_ANIM = 0.45; // 개폐 애니메이션 시간(초)
      const GAUGE_X = 60;
      const GAUGE_W = 40;
      const GAUGE_TOP = 150;
      const GAUGE_H = 340;
      const GATE_Y = 470;
      const GATE_H = 46;
      const GATE_W = 130;
      const GATE_XS = [300, 480, 660];
      const GATE_KEYS = ["1", "2", "3"];

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "수문을 열고 닫아 수위를 안전 구간에 유지하세요",
        level: 50,
        inflow: 15,
        inflowTarget: 15,
        inflowShiftTimer: 0,
        outflow: 0,
        gates: [0, 0, 0], // 개방 비율 0..1
        gateTargets: [0, 0, 0],
        failReason: "",
        effects: [],
        phase: 0,
      };

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.level = 50;
        state.inflow = 18;
        state.inflowTarget = 18;
        state.inflowShiftTimer = 0;
        state.outflow = 0;
        state.gates = [0, 0, 0];
        state.gateTargets = [0, 0, 0];
        state.failReason = "";
        state.effects = [];
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.failReason = reason;
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function toggleGate(index) {
        if (index < 0 || index >= GATE_COUNT) {
          return;
        }
        const willOpen = state.gateTargets[index] <= 0.5;
        state.gateTargets[index] = willOpen ? 1 : 0;
        addEffect(willOpen ? "개방" : "폐쇄", GATE_XS[index] + GATE_W / 2, GATE_Y - 24, willOpen ? "#38bdf8" : "#94a3b8");
      }

      function gateIsOpenish(index) {
        // 목표가 개방이거나 개방 방향으로 진행 중이면 true (중복 토글 방지용)
        return state.gateTargets[index] > 0.5;
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const clientX = event.clientX ?? 0;
        const clientY = event.clientY ?? 0;
        return {
          x: ((clientX - rect.left) / rect.width) * VIEW.width,
          y: ((clientY - rect.top) / rect.height) * VIEW.height,
        };
      }

      function gateIndexAt(point) {
        for (let i = 0; i < GATE_COUNT; i += 1) {
          const gx = GATE_XS[i];
          if (point.x >= gx - 16 && point.x <= gx + GATE_W + 16 && point.y >= GATE_Y - 30 && point.y <= GATE_Y + GATE_H + 16) {
            return i;
          }
        }
        return -1;
      }

      function addEffect(text, x, y, color) {
        state.effects.push({ text, x, y, color, age: 0 });
      }

      function gateRectHit(x, w) {
        return { x, w };
      }

      function bindHoldButton(button, onPress, onRelease) {
        if (!button) {
          return;
        }
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          onRelease?.();
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          startFromTouch();
          button.dataset.active = "true";
          onPress?.();
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function update(dt) {
        // 이펙트는 모든 모드에서 진행
        state.effects.forEach((fx) => { fx.age += dt; });
        state.effects = state.effects.filter((fx) => fx.age < 0.8);
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;
        state.phase = state.elapsed / DURATION;

        // 유입량: 시간이 갈수록 변동 폭과 스파이크 증가
        state.inflowShiftTimer -= dt;
        if (state.inflowShiftTimer <= 0) {
          const spread = 8 + state.phase * 14; // 후반으로 갈수록 변동 폭 증가
          const base = 18 + state.phase * 14;
          state.inflowTarget = base + (Math.random() * 2 - 1) * spread;
          if (Math.random() < 0.25 + state.phase * 0.25) {
            state.inflowTarget += (Math.random() < 0.5 ? -1 : 1) * (5 + state.phase * 9);
          }
          state.inflowTarget = Math.max(4, Math.min(GATE_MAX_RATE * GATE_COUNT * 0.85, state.inflowTarget));
          state.inflowShiftTimer = Math.max(1.6, 4.2 - state.phase * 2.2);
        }
        // 유입량은 목표로 부드럽게 접근
        state.inflow += (state.inflowTarget - state.inflow) * Math.min(1, dt * 1.4);

        // 수문 개폐 애니메이션 (즉시 전환 아님 → 예측 조작 필요)
        for (let i = 0; i < GATE_COUNT; i += 1) {
          const dir = state.gateTargets[i] > state.gates[i] ? 1 : -1;
          if (Math.abs(state.gateTargets[i] - state.gates[i]) > 0.001) {
            state.gates[i] += dir * (dt / GATE_ANIM);
            state.gates[i] = Math.max(0, Math.min(1, state.gates[i]));
          }
        }
        state.outflow = state.gates.reduce((sum, g) => sum + g * GATE_MAX_RATE, 0);

        // 수위 변화
        state.level += (state.inflow - state.outflow) * dt * 0.22;
        state.level = Math.max(LEVEL_MIN, Math.min(LEVEL_MAX, state.level));

        // 위험선 판정
        if (state.level >= DANGER_HIGH) {
          failStage("수위 범람 (위험선 초과)");
          return;
        }
        if (state.level <= DANGER_LOW) {
          failStage("수위 고갈 (위험선 미만)");
          return;
        }
        // 60초 생존 클리어
        if (state.elapsed >= DURATION) {
          clearStage();
        }
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function levelToY(level) {
        return GAUGE_TOP + GAUGE_H * (1 - level / LEVEL_MAX);
      }

      function renderScene() {
        // 하늘 + 산 배경
        const sky = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        sky.addColorStop(0, "#0b1e33");
        sky.addColorStop(0.5, "#123c5e");
        sky.addColorStop(1, "#0f172a");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        ctx.fillStyle = "rgba(71, 85, 105, 0.55)";
        ctx.beginPath();
        ctx.moveTo(0, 320);
        ctx.lineTo(180, 180);
        ctx.lineTo(340, 300);
        ctx.lineTo(520, 150);
        ctx.lineTo(720, 290);
        ctx.lineTo(960, 190);
        ctx.lineTo(960, 540);
        ctx.lineTo(0, 540);
        ctx.closePath();
        ctx.fill();

        // 댐 본체 (저수지)
        const waterY = levelToY(state.level);
        ctx.fillStyle = "#334155";
        ctx.fillRect(GAUGE_X - 26, GAUGE_TOP - 6, GAUGE_W + 52, GAUGE_H + 12);
        // 물
        const waterGrad = ctx.createLinearGradient(0, waterY, 0, GAUGE_TOP + GAUGE_H);
        waterGrad.addColorStop(0, "rgba(56, 189, 248, 0.9)");
        waterGrad.addColorStop(1, "rgba(2, 132, 199, 0.95)");
        ctx.fillStyle = waterGrad;
        ctx.fillRect(GAUGE_X, waterY, GAUGE_W, GAUGE_TOP + GAUGE_H - waterY);
        // 수면 파문
        ctx.strokeStyle = "rgba(224, 242, 254, 0.8)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = GAUGE_X; x <= GAUGE_X + GAUGE_W; x += 6) {
          const yy = waterY + Math.sin(x / 9 + state.elapsed * 3) * 2.5;
          if (x === GAUGE_X) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();

        // 안전 구간 밴드
        const safeTop = levelToY(SAFE_HIGH);
        const safeBot = levelToY(SAFE_LOW);
        ctx.fillStyle = "rgba(34, 197, 94, 0.16)";
        ctx.fillRect(GAUGE_X - 26, safeTop, GAUGE_W + 52, safeBot - safeTop);
        // 위험선
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(GAUGE_X - 26, levelToY(DANGER_HIGH));
        ctx.lineTo(GAUGE_X + GAUGE_W + 26, levelToY(DANGER_HIGH));
        ctx.moveTo(GAUGE_X - 26, levelToY(DANGER_LOW));
        ctx.lineTo(GAUGE_X + GAUGE_W + 26, levelToY(DANGER_LOW));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#fca5a5";
        ctx.font = "700 14px Trebuchet MS";
        ctx.textAlign = "left";
        ctx.fillText("범람 위험", GAUGE_X + GAUGE_W + 32, levelToY(DANGER_HIGH) + 5);
        ctx.fillText("고갈 위험", GAUGE_X + GAUGE_W + 32, levelToY(DANGER_LOW) + 5);
        ctx.fillStyle = "#4ade80";
        ctx.fillText("안전 구간", GAUGE_X + GAUGE_W + 32, (safeTop + safeBot) / 2 + 5);

        // 수문 + 방류
        for (let i = 0; i < GATE_COUNT; i += 1) {
          const gx = GATE_XS[i];
          const open = state.gates[i];
          // 수로 벽
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(gx - 10, GATE_Y - 14, GATE_W + 20, GATE_H + 22);
          // 흐르는 물
          if (open > 0.03) {
            const grad = ctx.createLinearGradient(0, GATE_Y, 0, GATE_Y + GATE_H);
            grad.addColorStop(0, "rgba(125, 211, 252, " + (0.35 + open * 0.6) + ")");
            grad.addColorStop(1, "rgba(14, 165, 233, " + (0.4 + open * 0.6) + ")");
            ctx.fillStyle = grad;
            ctx.fillRect(gx - 4, GATE_Y, GATE_W + 8, GATE_H);
            // 물살 선
            ctx.strokeStyle = "rgba(224,242,254," + (0.25 + open * 0.5) + ")";
            ctx.lineWidth = 2;
            const flowOffset = (state.elapsed * 90 * (0.4 + open)) % 26;
            for (let x = gx - 4 - flowOffset; x < gx + GATE_W + 4; x += 26) {
              ctx.beginPath();
              ctx.moveTo(x, GATE_Y + 6);
              ctx.lineTo(x + 12, GATE_Y + GATE_H - 6);
              ctx.stroke();
            }
          }
          // 게이트 판 (위에서 내려옴: 개방률에 따라 올라감)
          const plateH = (GATE_H + 14) * (1 - open);
          ctx.fillStyle = "#64748b";
          ctx.fillRect(gx - 4, GATE_Y - 14, GATE_W + 8, plateH);
          ctx.fillStyle = state.gateTargets[i] > 0.5 ? "#38bdf8" : "#475569";
          ctx.fillRect(gx - 4, GATE_Y - 20, GATE_W + 8, 6);
          // 라벨
          ctx.fillStyle = "#f8fafc";
          ctx.font = "800 20px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText("수문 " + (i + 1), gx + GATE_W / 2, GATE_Y + GATE_H + 30);
          ctx.font = "700 14px Trebuchet MS";
          ctx.fillStyle = "rgba(226,232,240,0.8)";
          ctx.fillText(state.gateTargets[i] > 0.5 ? "개방 중" : "폐쇄", gx + GATE_W / 2, GATE_Y + GATE_H + 50);
        }
        ctx.textAlign = "left";

        // 이펙트
        for (const fx of state.effects) {
          const alpha = 1 - fx.age / 0.8;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = fx.color;
          ctx.font = "800 22px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText(fx.text, fx.x, fx.y - fx.age * 30);
          ctx.restore();
        }
        ctx.textAlign = "left";
      }

      function renderHud() {
        // 상단 바
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, 0, VIEW.width, 96);

        // 남은 시간
        const remain = Math.max(0, DURATION - state.elapsed);
        ctx.textAlign = "left";
        ctx.font = "800 30px Trebuchet MS";
        ctx.fillStyle = remain < 10 ? "#4ade80" : "#f8fafc";
        ctx.fillText(remain.toFixed(1) + "s", 24, 40);
        ctx.font = "700 15px Trebuchet MS";
        ctx.fillStyle = "rgba(248,250,252,0.7)";
        ctx.fillText("남은 시간 / 목표 " + DURATION + "초", 24, 64);

        // 유입량 예고 게이지
        ctx.fillStyle = "rgba(248,250,252,0.95)";
        roundRect(230, 16, 320, 64, 10);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.font = "800 17px Trebuchet MS";
        ctx.fillText("유입량 " + Math.round(state.inflow) + " → " + Math.round(state.inflowTarget), 244, 40);
        // 유입량 바
        const maxFlow = GATE_MAX_RATE * GATE_COUNT;
        ctx.fillStyle = "#cbd5e1";
        ctx.fillRect(244, 50, 292, 12);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(244, 50, 292 * Math.min(1, state.inflow / maxFlow), 12);
        // 목표 마커
        ctx.fillStyle = "#b45309";
        const mx = 244 + 292 * Math.min(1, state.inflowTarget / maxFlow);
        ctx.fillRect(mx - 2, 46, 4, 20);

        // 방류량 표시
        ctx.fillStyle = "rgba(248,250,252,0.95)";
        roundRect(578, 16, 180, 64, 10);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.font = "800 17px Trebuchet MS";
        ctx.fillText("방류량 " + Math.round(state.outflow), 592, 40);
        ctx.fillStyle = "#cbd5e1";
        ctx.fillRect(592, 50, 152, 12);
        ctx.fillStyle = "#0ea5e9";
        ctx.fillRect(592, 50, 152 * Math.min(1, state.outflow / maxFlow), 12);

        // 수위 수치
        ctx.textAlign = "right";
        ctx.font = "800 26px Trebuchet MS";
        const inSafe = state.level > SAFE_LOW && state.level < SAFE_HIGH;
        ctx.fillStyle = inSafe ? "#4ade80" : "#fbbf24";
        ctx.fillText("수위 " + Math.round(state.level), VIEW.width - 24, 40);
        ctx.font = "700 14px Trebuchet MS";
        ctx.fillStyle = "rgba(248,250,252,0.7)";
        ctx.fillText(inSafe ? "안전 구간" : "주의 구간", VIEW.width - 24, 62);
        ctx.textAlign = "left";
      }

      function renderCard(title, lines, accent, footer) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        roundRect(190, 70, 580, 400, 18);
        ctx.fill();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = accent;
        ctx.font = "700 40px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 138);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 22px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 208 + index * 42);
        });

        if (footer) {
          ctx.fillStyle = accent;
          roundRect(VIEW.width / 2 - 130, 408, 260, 46, 23);
          ctx.fill();
          ctx.fillStyle = "#f8fafc";
          ctx.font = "800 22px Trebuchet MS";
          ctx.fillText(footer, VIEW.width / 2, 438);
        }
        ctx.textAlign = "left";
      }

      function render() {
        if (state.mode === "menu") {
          renderScene();
          renderCard("댐 수문장", [
            "수문을 열고 닫아 수위를 안전 구간에 유지하세요",
            "조작: 터치로 수문 열기/닫기 (키보드 1·2·3)",
            "클리어 조건: 60초 동안 수위를 안전 구간에 유지",
            "실패 조건: 수위가 위험선을 넘으면 실패",
            "수문은 천천히 열리고 닫힙니다 — 미리 대비하세요!",
          ], "#0ea5e9", "터치 또는 Enter로 시작");
          return;
        }

        if (state.mode === "running") {
          renderScene();
          renderHud();
          return;
        }

        if (state.mode === "failed") {
          renderScene();
          renderCard("실패", [
            "실패 원인: " + state.failReason,
            "클리어 조건: 60초 동안 수위를 안전 구간에 유지",
            "버틴 시간: " + state.lastRunTime.toFixed(1) + "초",
            "공유 목숨 1개가 즉시 종료되었습니다.",
          ], "#b91c1c");
          return;
        }

        renderScene();
        renderCard("클리어!", [
          "60초 동안 수위를 안전하게 지켰습니다",
          "최종 수위: " + Math.round(state.level) + " (안전 " + SAFE_LOW + "~" + SAFE_HIGH + ")",
          "호스트가 다음 미플레이 스테이지를 선택합니다.",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          level: Math.round(state.level * 10) / 10,
          safe_range: [SAFE_LOW, SAFE_HIGH],
          danger_lines: [DANGER_LOW, DANGER_HIGH],
          inflow: Math.round(state.inflow * 10) / 10,
          inflow_forecast: Math.round(state.inflowTarget * 10) / 10,
          outflow: Math.round(state.outflow * 10) / 10,
          gates_open_ratio: state.gates.map((g) => Math.round(g * 100) / 100),
          gates_target_open: state.gateTargets.map((t) => t > 0.5),
          remaining_time: Math.round(Math.max(0, DURATION - state.elapsed) * 10) / 10,
          fail_reason: state.failReason || undefined,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode === "menu") {
          event.preventDefault();
          startStage();
          return;
        }
        if (state.mode === "running") {
          const idx = GATE_KEYS.indexOf(event.key);
          if (idx >= 0) {
            event.preventDefault();
            toggleGate(idx);
          }
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "dam-gate",
        title: "댐 수문장",
        creator: "Anonymous Creator",
        genre: "Water control",
        clearCondition: "60초 동안 수위를 안전 구간에 유지",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        const point = canvasPoint(event);
        const idx = gateIndexAt(point);
        if (idx >= 0) {
          toggleGate(idx);
        }
      }, { passive: false });
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
