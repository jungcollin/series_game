<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>컬링 한 수</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 18px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">컬링 한 수. 캔버스를 터치하거나 Enter로 시작하세요. 드래그로 방향·파워 조절 후 놓기. 스톤 아래쪽을 눌러 뒤로 당기듯 드래그하면 조준 화살표가 나타나고, 놓으면 스톤이 미끄러집니다. 하우스 중심의 빨간 원 안에 스톤이 멈추면 성공입니다. 던질 때마다 얼음 마찰이 달라지니 HUD를 확인하세요. 스톤 3개 성공 시 클리어, 4개를 놓치면 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="컬링 한 수" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" class="mobile-btn" id="btn-auto" aria-label="정면으로 던지기">직진 투척</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("curling-stone") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      // 아이스 시트 레이아웃 (960x540, 시트는 세로로 긴 중앙 영역)
      const SHEET = { left: 300, right: 660, top: 30, bottom: 510 };
      const HOUSE = { x: 480, y: 128, rOuter: 66, rMid: 44, rInner: 26 };
      const HACK = { x: 480, y: 470 };
      const STONE_R = 15;
      const MAX_POWER = 620; // px/s 초기 속도 스케일
      const STOP_SPEED = 12;

      // 얼음 상태(마찰 계수와 컬 강도)
      const ICE_TYPES = [
        { label: "미끄러움", friction: 46, curl: 7 },
        { label: "보통", friction: 62, curl: 11 },
        { label: "마찰 큼", friction: 82, curl: 16 },
      ];

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "파워와 방향을 맞춰 스톤을 하우스 중심에 멈추세요",
        phase: "aim", // aim | sliding | rest
        success: 0,
        miss: 0,
        stone: { x: HACK.x, y: HACK.y, vx: 0, vy: 0 },
        aiming: false,
        aimStart: null,
        aimNow: null,
        aimPower: 0,
        ice: ICE_TYPES[1],
        curlDir: 1,
        restTimer: 0,
        restMessage: "",
        flash: 0,
        flashKind: "",
        failReason: "",
        trail: [],
      };

      function pickIce() {
        state.ice = ICE_TYPES[Math.floor(Math.random() * ICE_TYPES.length)];
        state.curlDir = Math.random() < 0.5 ? -1 : 1;
      }

      function resetStone() {
        state.stone = { x: HACK.x, y: HACK.y, vx: 0, vy: 0 };
        state.phase = "aim";
        state.aiming = false;
        state.aimStart = null;
        state.aimNow = null;
        state.aimPower = 0;
        state.restMessage = "";
        state.trail = [];
        pickIce();
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.success = 0;
        state.miss = 0;
        state.flash = 0;
        state.flashKind = "";
        state.failReason = "";
        resetStone();
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        state.failReason = reason;
        state.aiming = false;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        state.aiming = false;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * VIEW.width,
          y: ((event.clientY - rect.top) / rect.height) * VIEW.height,
        };
      }

      function computeAim() {
        if (!state.aimStart || !state.aimNow) {
          state.aimPower = 0;
          return null;
        }
        // 뒤로 당기는(슬링샷) 방식: 시작점 → 현재점의 반대 방향으로 발사
        const dx = state.aimStart.x - state.aimNow.x;
        const dy = state.aimStart.y - state.aimNow.y;
        const len = Math.hypot(dx, dy);
        if (len < 14) {
          state.aimPower = 0;
          return null;
        }
        const power = Math.min(1, len / 260);
        state.aimPower = power;
        return { dx: dx / len, dy: dy / len, power };
      }

      function launchStone() {
        const aim = computeAim();
        state.aiming = false;
        if (!aim) {
          state.aimStart = null;
          state.aimNow = null;
          return;
        }
        state.stone.vx = aim.dx * aim.power * MAX_POWER;
        state.stone.vy = aim.dy * aim.power * MAX_POWER;
        state.phase = "sliding";
        state.trail = [];
        state.aimStart = null;
        state.aimNow = null;
      }

      function evaluateRest() {
        const dist = Math.hypot(state.stone.x - HOUSE.x, state.stone.y - HOUSE.y);
        if (dist <= HOUSE.rInner) {
          state.success += 1;
          state.flash = 0.9;
          state.flashKind = "success";
          state.restMessage = "하우스 중심 적중!";
          if (state.success >= 3) {
            clearStage();
            return;
          }
        } else {
          state.miss += 1;
          state.flash = 0.9;
          state.flashKind = "miss";
          state.restMessage = dist <= HOUSE.rOuter ? "아쉽게 빗나감 (하우스 가장자리)" : "빗나감";
          if (state.miss >= 4) {
            failStage("missed_4");
            return;
          }
        }
        state.phase = "rest";
        state.restTimer = 1.0;
      }

      function update(dt) {
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;
        if (state.flash > 0) {
          state.flash -= dt;
        }

        if (state.phase === "sliding") {
          const s = state.stone;
          const speed = Math.hypot(s.vx, s.vy);
          if (speed > 0) {
            // 마찰 감속
            const dec = state.ice.friction * dt;
            const ns = Math.max(0, speed - dec);
            const ratio = ns / speed;
            // 컬: 진행 방향에 수직으로 살짝 휨 (속도가 느려질수록 강하게)
            const curlAmount = state.ice.curl * (1 - ns / MAX_POWER) * dt;
            const px = -s.vy / speed;
            const py = s.vx / speed;
            s.vx = s.vx * ratio + px * curlAmount * state.curlDir;
            s.vy = s.vy * ratio + py * curlAmount * state.curlDir;
            s.x += s.vx * dt;
            s.y += s.vy * dt;
            state.trail.push({ x: s.x, y: s.y });
            if (state.trail.length > 220) {
              state.trail.shift();
            }
          }

          // 벽 반사(약한 감쇠)
          if (s.x < SHEET.left + STONE_R) {
            s.x = SHEET.left + STONE_R;
            s.vx = Math.abs(s.vx) * 0.45;
          }
          if (s.x > SHEET.right - STONE_R) {
            s.x = SHEET.right - STONE_R;
            s.vx = -Math.abs(s.vx) * 0.45;
          }

          const nowSpeed = Math.hypot(s.vx, s.vy);
          if (nowSpeed < STOP_SPEED || s.y < SHEET.top - 40 || s.y > SHEET.bottom + 30) {
            s.vx = 0;
            s.vy = 0;
            evaluateRest();
          }
        } else if (state.phase === "rest") {
          state.restTimer -= dt;
          if (state.restTimer <= 0) {
            resetStone();
          }
        }
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(128, 92, 704, 356);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 92, 704, 356);

        ctx.fillStyle = accent;
        ctx.font = "700 42px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 162);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 24px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 232 + index * 46);
        });
        ctx.textAlign = "left";
      }

      function drawSheet() {
        // 얼음 시트
        ctx.fillStyle = "#7dd3fc";
        ctx.fillRect(SHEET.left, SHEET.top, SHEET.right - SHEET.left, SHEET.bottom - SHEET.top);
        ctx.fillStyle = "rgba(224, 242, 254, 0.55)";
        for (let i = 0; i < 8; i += 1) {
          const y = SHEET.top + 30 + i * 56;
          ctx.fillRect(SHEET.left + 12, y, SHEET.right - SHEET.left - 24, 3);
        }
        ctx.strokeStyle = "#0284c7";
        ctx.lineWidth = 4;
        ctx.strokeRect(SHEET.left, SHEET.top, SHEET.right - SHEET.left, SHEET.bottom - SHEET.top);

        // 하우스 (동심원)
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(HOUSE.x, HOUSE.y, HOUSE.rOuter, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#3b82f6";
        ctx.beginPath();
        ctx.arc(HOUSE.x, HOUSE.y, HOUSE.rMid, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(HOUSE.x, HOUSE.y, HOUSE.rInner, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f8fafc";
        ctx.beginPath();
        ctx.arc(HOUSE.x, HOUSE.y, 8, 0, Math.PI * 2);
        ctx.fill();

        // 호그라인과 해킹 라인
        ctx.strokeStyle = "rgba(15, 23, 42, 0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(SHEET.left, 240);
        ctx.lineTo(SHEET.right, 240);
        ctx.stroke();
        ctx.fillStyle = "#0f172a";
        ctx.font = "600 16px Trebuchet MS";
        ctx.fillText("호그라인", SHEET.left + 8, 236);
        ctx.fillText("투척선", HACK.x - 96, HACK.y + 6);
        ctx.beginPath();
        ctx.moveTo(SHEET.left, HACK.y);
        ctx.lineTo(SHEET.right, HACK.y);
        ctx.stroke();
      }

      function drawStone(x, y, scale = 1) {
        const r = STONE_R * scale;
        ctx.fillStyle = "#334155";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#94a3b8";
        ctx.beginPath();
        ctx.arc(x, y - r * 0.15, r * 0.62, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(x - r * 0.4, y - r * 0.55, r * 0.8, r * 0.22);
      }

      function renderRunning() {
        // 배경
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        drawSheet();

        // 궤적
        if (state.trail.length > 1) {
          ctx.strokeStyle = "rgba(2, 132, 199, 0.45)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(state.trail[0].x, state.trail[0].y);
          state.trail.forEach((p) => ctx.lineTo(p.x, p.y));
          ctx.stroke();
        }

        // 조준 화살표
        if (state.phase === "aim" && state.aiming) {
          const aim = computeAim();
          if (aim) {
            const len = 60 + aim.power * 150;
            const ex = state.stone.x + aim.dx * len;
            const ey = state.stone.y + aim.dy * len;
            ctx.strokeStyle = `rgba(239, 68, 68, ${0.5 + aim.power * 0.5})`;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(state.stone.x, state.stone.y);
            ctx.lineTo(ex, ey);
            ctx.stroke();
            ctx.fillStyle = ctx.strokeStyle;
            ctx.beginPath();
            ctx.moveTo(ex, ey);
            ctx.lineTo(ex - aim.dx * 16 - aim.dy * 8, ey - aim.dy * 16 + aim.dx * 8);
            ctx.lineTo(ex - aim.dx * 16 + aim.dy * 8, ey - aim.dy * 16 - aim.dx * 8);
            ctx.closePath();
            ctx.fill();
          }
        }

        if (state.phase !== "rest" || state.flash > 0.2) {
          drawStone(state.stone.x, state.stone.y);
        }

        // HUD
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, 0, VIEW.width, 62);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "700 23px Trebuchet MS";
        ctx.fillText(`성공 ${state.success}/3`, 24, 40);
        ctx.fillStyle = state.miss > 0 ? "#fca5a5" : "#cbd5e1";
        ctx.fillText(`실패 ${state.miss}/4`, 150, 40);
        ctx.fillStyle = "#7dd3fc";
        ctx.textAlign = "right";
        ctx.fillText(`얼음 상태: ${state.ice.label} / 컬 ${state.curlDir > 0 ? "오른쪽" : "왼쪽"}`, VIEW.width - 24, 40);
        ctx.textAlign = "left";

        // 파워 게이지 (조준 중)
        if (state.phase === "aim") {
          const gx = 300;
          const gy = VIEW.height - 40;
          const gw = 360;
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(gx, gy, gw, 18);
          ctx.fillStyle = state.aimPower > 0.85 ? "#ef4444" : "#22c55e";
          ctx.fillRect(gx + 2, gy + 2, (gw - 4) * state.aimPower, 14);
          ctx.strokeStyle = "#94a3b8";
          ctx.lineWidth = 2;
          ctx.strokeRect(gx, gy, gw, 18);
          ctx.fillStyle = "#cbd5e1";
          ctx.font = "600 17px Trebuchet MS";
          ctx.fillText(state.aiming ? "놓으면 투척" : "스톤 아래를 눌러 뒤로 당기세요", gx, gy - 8);
        }

        // 결과 메시지
        if (state.restMessage && state.flash > 0) {
          ctx.fillStyle = state.flashKind === "success" ? "#22c55e" : "#ef4444";
          ctx.font = "800 38px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText(state.restMessage, VIEW.width / 2, 320);
          ctx.textAlign = "left";
        }
        if (state.flash > 0) {
          ctx.fillStyle = state.flashKind === "success"
            ? `rgba(34, 197, 94, ${state.flash * 0.22})`
            : `rgba(239, 68, 68, ${state.flash * 0.28})`;
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        }
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("컬링 한 수", [
            "파워와 방향을 맞춰 스톤을 하우스 중심에 멈추세요",
            "조작: 드래그로 방향·파워 조절 후 놓기",
            "클리어 조건: 스톤 3개를 하우스 중심부에 넣으면 클리어",
            "실패 조건: 4개를 놓치면 실패",
            "던질 때마다 얼음 마찰과 컬 방향이 바뀝니다.",
            "터치 또는 Enter로 시작. 스톤 아래를 눌러 뒤로 당기세요.",
          ], "#0284c7");
          return;
        }

        if (state.mode === "running") {
          renderRunning();
          return;
        }

        if (state.mode === "failed") {
          renderCard("실패", [
            "4개를 놓치면 실패",
            `성공: ${state.success}개 / 실패: ${state.miss}개`,
            `플레이 시간: ${state.lastRunTime.toFixed(1)}초`,
            "터치 또는 Enter로 다시 도전하세요.",
          ], "#b91c1c");
          return;
        }

        renderCard("클리어", [
          "스톤 3개를 하우스 중심부에 넣으면 클리어",
          `하우스 중심에 ${state.success}개 적중! (${state.lastRunTime.toFixed(1)}초)`,
          "터치 또는 Enter로 다시 플레이할 수 있습니다.",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down",
          mode: state.mode,
          phase: state.phase,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          success: state.success,
          miss: state.miss,
          ice: state.ice.label,
          curl_dir: state.curlDir > 0 ? "right" : "left",
          stone: {
            x: Math.round(state.stone.x),
            y: Math.round(state.stone.y),
            speed: Math.round(Math.hypot(state.stone.vx, state.stone.vy)),
          },
          house: { x: HOUSE.x, y: HOUSE.y, r_inner: HOUSE.rInner },
          aim_power: Math.round(state.aimPower * 100) / 100,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
          return;
        }
        if (event.key === " " && state.mode === "running" && state.phase === "aim") {
          // 키보드 접근성: 정면으로 중간 파워 투척
          event.preventDefault();
          state.stone.vx = 0;
          state.stone.vy = -MAX_POWER * 0.62;
          state.phase = "sliding";
          state.trail = [];
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "curling-stone",
        title: "컬링 한 수",
        creator: "Anonymous Creator",
        genre: "Precision slide",
        clearCondition: "스톤 3개를 하우스 중심부에 넣으면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        if (state.phase === "aim") {
          state.aiming = true;
          state.aimStart = canvasPoint(event);
          state.aimNow = canvasPoint(event);
          canvas.setPointerCapture?.(event.pointerId);
        }
      });
      canvas.addEventListener("pointermove", (event) => {
        if (state.aiming) {
          state.aimNow = canvasPoint(event);
        }
      });
      canvas.addEventListener("pointerup", () => {
        if (state.aiming) {
          launchStone();
        }
      });
      canvas.addEventListener("pointercancel", () => {
        state.aiming = false;
        state.aimStart = null;
        state.aimNow = null;
      });
      canvas.addEventListener("touchstart", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
        }
      }, { passive: false });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      const autoBtn = document.querySelector("#btn-auto");
      autoBtn?.addEventListener("click", (event) => {
        event.preventDefault();
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        if (state.phase === "aim") {
          state.stone.vx = 0;
          state.stone.vy = -MAX_POWER * 0.62;
          state.phase = "sliding";
          state.trail = [];
        }
      });

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
