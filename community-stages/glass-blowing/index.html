<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유리공예</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 20px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(217, 119, 6, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">유리공예. 캔버스를 터치하거나 Enter로 시작하세요. 터치 유지로 불기, 떼면 정지. 화면을 길게 누르는 동안 압력이 오르고 유리가 부풉니다. 압력을 녹색 구간에 유지해 유리를 목표 링까지 키우면 작품 완성입니다. 적색 구간에 들어가면 금이 가고, 금이 누적되면 파손됩니다. 작품 3개 완성 시 클리어, 3개 파손 시 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="유리공예" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" class="mobile-btn" id="btn-blow" aria-label="불기 (길게 누르기)">불기</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("glass-blowing") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      // 작품별 목표 반경과 내구도(적색 구간 허용 시간 초)
      const PIECES = [
        { name: "작은 꽃병", targetRadius: 74, durability: 1.6, greenLo: 34, greenHi: 62, redLo: 82 },
        { name: "물컵", targetRadius: 96, durability: 1.2, greenLo: 40, greenHi: 68, redLo: 84 },
        { name: "대형 화병", targetRadius: 122, durability: 0.9, greenLo: 46, greenHi: 72, redLo: 86 },
      ];

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "불기 압력을 녹색 구간에 유지해 작품을 완성하세요",
        blowing: false,
        pieceIndex: 0,
        completed: 0,
        broken: 0,
        pressure: 0,
        radius: 22,
        crack: 0,
        spin: 0,
        flash: 0,
        flashKind: "",
        failReason: "",
        wobble: 0,
      };

      function currentPiece() {
        return PIECES[Math.min(state.pieceIndex, PIECES.length - 1)];
      }

      function resetPiece() {
        state.pressure = 0;
        state.radius = 22;
        state.crack = 0;
        state.wobble = 0;
        state.blowing = false;
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.pieceIndex = 0;
        state.completed = 0;
        state.broken = 0;
        state.flash = 0;
        state.flashKind = "";
        state.failReason = "";
        resetPiece();
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        state.failReason = reason;
        state.blowing = false;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        state.blowing = false;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function bindHoldButton(button, onPress, onRelease) {
        if (!button) {
          return;
        }
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          onRelease?.();
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          startFromTouch();
          button.dataset.active = "true";
          onPress?.();
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function completePiece() {
        state.completed += 1;
        state.flash = 0.9;
        state.flashKind = "complete";
        if (state.completed >= PIECES.length) {
          clearStage();
          return;
        }
        state.pieceIndex += 1;
        resetPiece();
      }

      function breakPiece() {
        state.broken += 1;
        state.flash = 0.9;
        state.flashKind = "broken";
        if (state.broken >= 3) {
          failStage("glass_broken_3");
          return;
        }
        state.pieceIndex = Math.min(state.pieceIndex + 1, PIECES.length - 1);
        resetPiece();
      }

      function update(dt) {
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;
        const piece = currentPiece();

        state.spin += dt * (state.blowing ? 2.4 : 1.1);
        if (state.flash > 0) {
          state.flash -= dt;
        }

        if (state.blowing) {
          state.pressure = Math.min(100, state.pressure + dt * 46);
        } else {
          state.pressure = Math.max(0, state.pressure - dt * 26);
        }

        if (state.pressure >= piece.redLo) {
          // 적색 구간: 금 누적
          state.crack += dt;
          state.wobble = Math.min(1, state.wobble + dt * 3);
          if (state.crack >= piece.durability) {
            breakPiece();
            return;
          }
        } else {
          state.crack = Math.max(0, state.crack - dt * 0.35);
          state.wobble = Math.max(0, state.wobble - dt * 2);
        }

        if (state.pressure >= piece.greenLo && state.pressure <= piece.greenHi) {
          // 녹색 구간: 유리 성장 (목표에 가까울수록 느려짐)
          const headroom = Math.max(0.15, 1 - state.radius / (piece.targetRadius + 24));
          state.radius += dt * 20 * headroom;
          if (state.radius >= piece.targetRadius) {
            completePiece();
            return;
          }
        } else if (state.pressure > piece.greenHi && state.pressure < piece.redLo) {
          // 과압 경고 구간: 살짝만 성장하며 불안정
          state.radius += dt * 6;
          state.wobble = Math.min(1, state.wobble + dt * 1.2);
          if (state.radius >= piece.targetRadius) {
            completePiece();
            return;
          }
        }
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(128, 92, 704, 356);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 92, 704, 356);

        ctx.fillStyle = accent;
        ctx.font = "700 42px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 162);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 24px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 232 + index * 46);
        });
        ctx.textAlign = "left";
      }

      function drawGauge(piece) {
        const gx = 800;
        const gy = 120;
        const gw = 40;
        const gh = 320;
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(gx, gy, gw, gh);

        // 녹색 구간 / 적색 구간 배경
        const yFor = (p) => gy + gh - (p / 100) * gh;
        ctx.fillStyle = "rgba(34, 197, 94, 0.5)";
        ctx.fillRect(gx, yFor(piece.greenHi), gw, yFor(piece.greenLo) - yFor(piece.greenHi));
        ctx.fillStyle = "rgba(239, 68, 68, 0.6)";
        ctx.fillRect(gx, yFor(100), gw, yFor(piece.redLo) - yFor(100));

        // 압력 채움
        const inRed = state.pressure >= piece.redLo;
        const inGreen = state.pressure >= piece.greenLo && state.pressure <= piece.greenHi;
        ctx.fillStyle = inRed ? "#ef4444" : inGreen ? "#22c55e" : "#fbbf24";
        ctx.fillRect(gx + 4, yFor(state.pressure), gw - 8, (state.pressure / 100) * gh - 4);

        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 2;
        ctx.strokeRect(gx, gy, gw, gh);

        ctx.fillStyle = "#e2e8f0";
        ctx.font = "700 18px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("압력", gx + gw / 2, gy - 12);
        ctx.font = "700 22px Trebuchet MS";
        ctx.fillText(`${Math.round(state.pressure)}`, gx + gw / 2, gy + gh + 28);
        ctx.textAlign = "left";
      }

      function renderRunning() {
        // 배경: 작업장
        const grad = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        grad.addColorStop(0, "#1c1917");
        grad.addColorStop(1, "#0c0a09");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        // 가마 불빛
        ctx.fillStyle = "rgba(249, 115, 22, 0.16)";
        ctx.beginPath();
        ctx.ellipse(480, 470, 340, 90, 0, 0, Math.PI * 2);
        ctx.fill();

        const piece = currentPiece();
        const cx = 420;
        const cy = 270;

        // 목표 링(점선)
        ctx.save();
        ctx.setLineDash([10, 8]);
        ctx.strokeStyle = "rgba(248, 250, 252, 0.55)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, piece.targetRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // 파이프
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = "#57534e";
        ctx.fillRect(-360, -7, 360 - state.radius * 0.4, 14);
        ctx.fillStyle = "#78716c";
        ctx.fillRect(-360, -7, 26, 14);

        // 유리 물레 (회전 줄무늬)
        const wob = state.wobble * 6 * Math.sin(state.spin * 7);
        const r = state.radius;
        ctx.rotate(Math.sin(state.spin) * 0.06 * (1 + state.wobble));
        const glassGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3 + wob, r * 0.2, 0, wob, r);
        glassGrad.addColorStop(0, "rgba(254, 215, 170, 0.95)");
        glassGrad.addColorStop(0.55, state.crack > 0.2 ? "rgba(248, 113, 113, 0.85)" : "rgba(251, 146, 60, 0.85)");
        glassGrad.addColorStop(1, "rgba(194, 65, 12, 0.9)");
        ctx.fillStyle = glassGrad;
        ctx.beginPath();
        ctx.ellipse(0, wob, r, r * 0.92, 0, 0, Math.PI * 2);
        ctx.fill();

        // 회전 하이라이트
        ctx.strokeStyle = "rgba(255, 247, 237, 0.5)";
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i += 1) {
          const a = state.spin * 2 + (i * Math.PI * 2) / 3;
          ctx.beginPath();
          ctx.arc(0, wob, r * 0.72, a, a + 0.9);
          ctx.stroke();
        }

        // 금 표시
        if (state.crack > 0.05) {
          ctx.strokeStyle = "rgba(127, 29, 29, 0.9)";
          ctx.lineWidth = 2;
          const crackLines = Math.min(5, 1 + Math.floor(state.crack * 3));
          for (let i = 0; i < crackLines; i += 1) {
            const a = i * 1.3 + 0.4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r * 0.3, wob + Math.sin(a) * r * 0.3);
            ctx.lineTo(Math.cos(a) * r * 0.95, wob + Math.sin(a) * r * 0.9);
            ctx.stroke();
          }
        }
        ctx.restore();

        // 불기 중 공기 흐름 표시
        if (state.blowing) {
          ctx.strokeStyle = "rgba(186, 230, 253, 0.7)";
          ctx.lineWidth = 3;
          for (let i = 0; i < 4; i += 1) {
            const t = (state.elapsed * 3 + i * 0.25) % 1;
            const x = cx - 340 + t * (340 - r * 0.5);
            ctx.beginPath();
            ctx.arc(x, cy, 4 + t * 3, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        // HUD
        ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
        ctx.fillRect(0, 0, VIEW.width, 64);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "700 24px Trebuchet MS";
        ctx.fillText(`작품 ${state.completed}/${PIECES.length}`, 24, 40);
        ctx.fillStyle = state.broken > 0 ? "#fca5a5" : "#cbd5e1";
        ctx.fillText(`파손 ${state.broken}/3`, 200, 40);
        ctx.fillStyle = "#fbbf24";
        ctx.textAlign = "center";
        ctx.fillText(`현재: ${piece.name} (목표 반경 ${piece.targetRadius})`, VIEW.width / 2, 40);
        ctx.textAlign = "left";

        drawGauge(piece);

        // 안내
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 18px Trebuchet MS";
        ctx.fillText(state.blowing ? "불고 있는 중… 떼면 압력이 빠집니다" : "터치 유지로 불기, 떼면 정지", 24, VIEW.height - 20);

        // 플래시 연출
        if (state.flash > 0) {
          ctx.fillStyle = state.flashKind === "complete"
            ? `rgba(34, 197, 94, ${state.flash * 0.35})`
            : `rgba(239, 68, 68, ${state.flash * 0.4})`;
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "800 40px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText(state.flashKind === "complete" ? "작품 완성!" : "파손!", VIEW.width / 2, 120);
          ctx.textAlign = "left";
        }
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("유리공예", [
            "불기 압력을 녹색 구간에 유지해 작품을 완성하세요",
            "조작: 터치 유지로 불기, 떼면 정지",
            "클리어 조건: 작품 3개를 균일하게 완성하면 클리어",
            "실패 조건: 3개를 망치면 실패",
            "압력이 적색 구간에 들어가면 유리에 금이 갑니다.",
            "터치 또는 Enter로 시작. 스페이스를 눌러도 불 수 있습니다.",
          ], "#f97316");
          return;
        }

        if (state.mode === "running") {
          renderRunning();
          return;
        }

        if (state.mode === "failed") {
          renderCard("실패", [
            "3개를 망치면 실패",
            `완성한 작품: ${state.completed}개 / 파손: ${state.broken}개`,
            `플레이 시간: ${state.lastRunTime.toFixed(1)}초`,
            "터치 또는 Enter로 다시 도전하세요.",
          ], "#b91c1c");
          return;
        }

        renderCard("클리어", [
          "작품 3개를 균일하게 완성하면 클리어",
          `모든 작품을 완성했습니다! (${state.lastRunTime.toFixed(1)}초)`,
          "터치 또는 Enter로 다시 플레이할 수 있습니다.",
        ], "#15803d");
      }

      function renderGameToText() {
        const piece = currentPiece();
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          completed: state.completed,
          broken: state.broken,
          piece: { name: piece.name, target_radius: piece.targetRadius },
          pressure: Math.round(state.pressure),
          glass_radius: Math.round(state.radius),
          crack: Math.round(state.crack * 100) / 100,
          blowing: state.blowing,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function setBlowing(value) {
        state.blowing = value;
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
          return;
        }
        if ((event.key === " " || event.key === "Spacebar") && state.mode === "running") {
          event.preventDefault();
          setBlowing(true);
        }
      }

      function onKeyUp(event) {
        if (event.key === " " || event.key === "Spacebar") {
          setBlowing(false);
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "glass-blowing",
        title: "유리공예",
        creator: "Anonymous Creator",
        genre: "Pressure control",
        clearCondition: "작품 3개를 균일하게 완성하면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        setBlowing(true);
        canvas.setPointerCapture?.(event.pointerId);
      });
      canvas.addEventListener("pointerup", () => setBlowing(false));
      canvas.addEventListener("pointercancel", () => setBlowing(false));
      canvas.addEventListener("touchstart", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
        }
      }, { passive: false });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("blur", () => setBlowing(false));
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      bindHoldButton(document.querySelector("#btn-blow"), () => setBlowing(true), () => setBlowing(false));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
