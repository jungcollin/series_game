<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>보물 잠수</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">보물 잠수. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 터치 드래그로 잠수 방향 조절 입니다. 드래그 방향으로 잠수부가 헤엄치며, 키보드 방향키도 사용할 수 있습니다. 해저의 보물 상자 5개를 모두 수거한 뒤 수면으로 돌아오면 클리어합니다. 해파리에 닿으면 산소가 크게 줄고, 산소가 바닥나면 즉시 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="보물 잠수" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <script src="../relay-runtime.js"></script>
    <!-- Optional: ../sdk/v2/relay-sdk.js for the v2 host contract. Legacy RelayStageHost callbacks remain required. -->
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("treasure-dive") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      const WORLD = { width: 2400, height: 1350 }; // 카메라 스크롤 월드
      const SURFACE_Y = 130;          // 수면 y
      const SEABED_Y = WORLD.height - 120;
      const OXYGEN_MAX = 100;
      const OXYGEN_DRAIN = 1.6;       // 초당 기본 소모
      const OXYGEN_PICKUP = 14;       // 보물 획득 시 회복
      const JELLY_DAMAGE = 18;        // 해파리 접촉 시 산소 손실
      const JELLY_STUN = 0.9;         // 접촉 후 무적/경직 시간
      const DIVER_SPEED = 210;        // px/s
      const TREASURE_COUNT = 5;
      const JELLY_COUNT = 7;
      const PICKUP_RADIUS = 46;
      const HIT_RADIUS = 40;
      const SURFACE_ZONE_X = [900, 1500]; // 수면 귀환 존 (출발 지점 부근)

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "산소가 떨어지기 전에 보물을 싣고 수면으로 돌아오세요",
        diver: { x: WORLD.width / 2, y: SURFACE_Y + 30, vx: 0, vy: 0, facing: 1 },
        oxygen: OXYGEN_MAX,
        treasures: [],   // {x,y,got}
        jellies: [],     // {x,y,baseY,phase,r}
        collected: 0,
        stun: 0,
        failReason: "",
        effects: [],
        bubbles: [],
        keys: { left: false, right: false, up: false, down: false },
        drag: null,      // {startX,startY,curX,curY}
        cam: { x: 0, y: 0 },
      };

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function placeTreasures() {
        const spots = [];
        const marginX = 160;
        const minGapX = 320;
        const minGapY = 150;
        let guard = 0;
        while (spots.length < TREASURE_COUNT && guard < 400) {
          guard += 1;
          const x = marginX + Math.random() * (WORLD.width - marginX * 2);
          const y = WORLD.height * 0.45 + Math.random() * (SEABED_Y - WORLD.height * 0.45 - 40);
          if (spots.every((s) => Math.hypot(s.x - x, s.y - y) > Math.min(minGapX, minGapY * 2))) {
            spots.push({ x, y });
          }
        }
        // 최소 개수 보장 안 되면 격자 fallback
        while (spots.length < TREASURE_COUNT) {
          spots.push({ x: 200 + spots.length * 440, y: WORLD.height * 0.72 });
        }
        state.treasures = spots.map((s) => ({ x: s.x, y: s.y, got: false }));
      }

      function placeJellies() {
        state.jellies = [];
        for (let i = 0; i < JELLY_COUNT; i += 1) {
          const x = 140 + (i + 0.5) * ((WORLD.width - 280) / JELLY_COUNT) + (Math.random() * 120 - 60);
          const y = WORLD.height * 0.3 + Math.random() * (SEABED_Y - WORLD.height * 0.35 - 80);
          state.jellies.push({ x, baseY: y, y, phase: Math.random() * Math.PI * 2, r: 26 + Math.random() * 10 });
        }
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.diver = { x: WORLD.width / 2, y: SURFACE_Y + 30, vx: 0, vy: 0, facing: 1 };
        state.oxygen = OXYGEN_MAX;
        state.collected = 0;
        state.stun = 0;
        state.failReason = "";
        state.effects = [];
        state.bubbles = [];
        state.keys = { left: false, right: false, up: false, down: false };
        state.drag = null;
        placeTreasures();
        placeJellies();
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.failReason = reason;
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function addEffect(text, x, y, color) {
        state.effects.push({ text, x, y, color, age: 0 });
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const clientX = event.clientX ?? 0;
        const clientY = event.clientY ?? 0;
        return {
          x: ((clientX - rect.left) / rect.width) * VIEW.width,
          y: ((clientY - rect.top) / rect.height) * VIEW.height,
        };
      }

      function bindHoldButton(button, onPress, onRelease) {
        if (!button) {
          return;
        }
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          onRelease?.();
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          startFromTouch();
          button.dataset.active = "true";
          onPress?.();
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function inputVector() {
        let ix = 0;
        let iy = 0;
        if (state.keys.left) ix -= 1;
        if (state.keys.right) ix += 1;
        if (state.keys.up) iy -= 1;
        if (state.keys.down) iy += 1;
        if (state.drag) {
          const dx = state.drag.curX - state.drag.startX;
          const dy = state.drag.curY - state.drag.startY;
          const len = Math.hypot(dx, dy);
          if (len > 14) {
            ix += dx / len;
            iy += dy / len;
          }
        }
        const mag = Math.hypot(ix, iy);
        if (mag > 1) {
          ix /= mag;
          iy /= mag;
        }
        return { x: ix, y: iy };
      }

      function updateCamera() {
        const targetX = Math.max(0, Math.min(WORLD.width - VIEW.width, state.diver.x - VIEW.width / 2));
        const targetY = Math.max(0, Math.min(WORLD.height - VIEW.height, state.diver.y - VIEW.height / 2));
        state.cam.x += (targetX - state.cam.x) * 0.18;
        state.cam.y += (targetY - state.cam.y) * 0.18;
      }

      function update(dt) {
        state.effects.forEach((fx) => { fx.age += dt; });
        state.effects = state.effects.filter((fx) => fx.age < 0.9);
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;
        if (state.stun > 0) {
          state.stun -= dt;
        }

        // 이동
        const input = state.stun > 0 ? { x: 0, y: 0 } : inputVector();
        state.diver.vx = input.x * DIVER_SPEED;
        state.diver.vy = input.y * DIVER_SPEED;
        state.diver.x = Math.max(30, Math.min(WORLD.width - 30, state.diver.x + state.diver.vx * dt));
        state.diver.y = Math.max(SURFACE_Y, Math.min(SEABED_Y, state.diver.y + state.diver.vy * dt));
        if (input.x !== 0) {
          state.diver.facing = input.x > 0 ? 1 : -1;
        }

        // 헤엄치면 산소 추가 소모
        const moving = Math.hypot(input.x, input.y) > 0.1;
        state.oxygen -= (OXYGEN_DRAIN + (moving ? 0.5 : 0)) * dt;

        // 거품 이펙트
        if (moving && Math.random() < dt * 6) {
          state.bubbles.push({ x: state.diver.x, y: state.diver.y - 16, r: 3 + Math.random() * 4, age: 0 });
        }
        state.bubbles.forEach((b) => { b.age += dt; b.y -= dt * 60; });
        state.bubbles = state.bubbles.filter((b) => b.age < 1.2 && b.y > SURFACE_Y - 20);

        // 해파리 움직임 (상하 진동)
        for (const j of state.jellies) {
          j.phase += dt * 1.4;
          j.y = j.baseY + Math.sin(j.phase) * 46;
        }

        // 해파리 충돌
        if (state.stun <= 0) {
          for (const j of state.jellies) {
            if (Math.hypot(j.x - state.diver.x, j.y - state.diver.y) < HIT_RADIUS) {
              state.oxygen -= JELLY_DAMAGE;
              state.stun = JELLY_STUN;
              addEffect("-" + JELLY_DAMAGE + " 산소!", state.diver.x, state.diver.y - 30, "#f472b6");
              // 밀려남
              state.diver.x += (state.diver.x < j.x ? -60 : 60);
              break;
            }
          }
        }

        // 보물 획득
        for (const tr of state.treasures) {
          if (!tr.got && Math.hypot(tr.x - state.diver.x, tr.y - state.diver.y) < PICKUP_RADIUS) {
            tr.got = true;
            state.collected += 1;
            state.oxygen = Math.min(OXYGEN_MAX, state.oxygen + OXYGEN_PICKUP);
            addEffect("보물 " + state.collected + "/" + TREASURE_COUNT + " +" + OXYGEN_PICKUP, tr.x, tr.y - 34, "#facc15");
          }
        }

        // 수면 귀환 판정: 보물 전부 수거 후 수면 존 도달
        if (state.collected >= TREASURE_COUNT && state.diver.y <= SURFACE_Y + 8) {
          clearStage();
          return;
        }

        if (state.oxygen <= 0) {
          state.oxygen = 0;
          failStage("산소 고갈");
          return;
        }

        updateCamera();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function renderWorld() {
        const cam = state.cam;
        // 물 배경 (깊이에 따라 어두워짐)
        const grad = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        const depth = cam.y / (WORLD.height - VIEW.height);
        grad.addColorStop(0, depth > 0.5 ? "#082f49" : "#0c4a6e");
        grad.addColorStop(1, "#020617");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.save();
        ctx.translate(-cam.x, -cam.y);

        // 수면
        ctx.fillStyle = "rgba(125, 211, 252, 0.5)";
        ctx.fillRect(0, SURFACE_Y - 60, WORLD.width, 60);
        ctx.strokeStyle = "rgba(224, 242, 254, 0.9)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let x = 0; x <= WORLD.width; x += 10) {
          const yy = SURFACE_Y + Math.sin(x / 40 + state.elapsed * 2) * 5;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
        // 귀환 존 표시 (볼록한 보트)
        const zoneMid = (SURFACE_ZONE_X[0] + SURFACE_ZONE_X[1]) / 2;
        ctx.fillStyle = "#b45309";
        ctx.fillRect(zoneMid - 90, SURFACE_Y - 78, 180, 26);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 18px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("귀환 지점", zoneMid, SURFACE_Y - 88);

        // 해저
        ctx.fillStyle = "#78350f";
        ctx.beginPath();
        ctx.moveTo(0, WORLD.height);
        for (let x = 0; x <= WORLD.width; x += 60) {
          ctx.lineTo(x, SEABED_Y + 40 + Math.sin(x / 160) * 26);
        }
        ctx.lineTo(WORLD.width, WORLD.height);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#92400e";
        ctx.fillRect(0, SEABED_Y + 60, WORLD.width, WORLD.height - SEABED_Y - 60);

        // 볬 상자
        for (const tr of state.treasures) {
          if (tr.got) continue;
          const bob = Math.sin(state.elapsed * 2 + tr.x / 90) * 4;
          ctx.fillStyle = "#facc15";
          ctx.fillRect(tr.x - 22, tr.y - 14 + bob, 44, 30);
          ctx.fillStyle = "#a16207";
          ctx.fillRect(tr.x - 22, tr.y - 14 + bob, 44, 10);
          ctx.fillStyle = "#fde047";
          ctx.fillRect(tr.x - 4, tr.y - 20 + bob, 8, 12);
          // 반짝임
          ctx.fillStyle = "rgba(253, 224, 71, " + (0.35 + Math.sin(state.elapsed * 4 + tr.x) * 0.25) + ")";
          ctx.beginPath();
          ctx.arc(tr.x, tr.y + bob, 34, 0, Math.PI * 2);
          ctx.fill();
        }

        // 해파리
        for (const j of state.jellies) {
          const pulse = 1 + Math.sin(j.phase * 2) * 0.12;
          ctx.fillStyle = "rgba(244, 114, 182, 0.75)";
          ctx.beginPath();
          ctx.ellipse(j.x, j.y, j.r * pulse, j.r * 0.8, 0, Math.PI, 0);
          ctx.fill();
          ctx.strokeStyle = "rgba(251, 207, 232, 0.7)";
          ctx.lineWidth = 3;
          for (let t = -2; t <= 2; t += 1) {
            ctx.beginPath();
            ctx.moveTo(j.x + t * j.r * 0.32, j.y + 2);
            ctx.quadraticCurveTo(
              j.x + t * j.r * 0.32 + Math.sin(j.phase + t) * 8,
              j.y + j.r * 0.9,
              j.x + t * j.r * 0.36,
              j.y + j.r * 1.5
            );
            ctx.stroke();
          }
        }

        // 거품
        ctx.fillStyle = "rgba(186, 230, 253, 0.5)";
        for (const b of state.bubbles) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 잠수부
        const d = state.diver;
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.scale(d.facing, 1);
        if (state.stun > 0 && Math.floor(state.elapsed * 10) % 2 === 0) {
          ctx.globalAlpha = 0.45;
        }
        // 몸통
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.ellipse(0, 0, 26, 13, 0, 0, Math.PI * 2);
        ctx.fill();
        // 머리/헬멧
        ctx.fillStyle = "#e2e8f0";
        ctx.beginPath();
        ctx.arc(22, -4, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0ea5e9";
        ctx.beginPath();
        ctx.arc(25, -4, 6, 0, Math.PI * 2);
        ctx.fill();
        // 산소통
        ctx.fillStyle = "#94a3b8";
        ctx.fillRect(-22, -18, 10, 20);
        // 오리발
        const kick = Math.sin(state.elapsed * 9) * 7;
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.moveTo(-26, 4);
        ctx.lineTo(-44, 10 + kick);
        ctx.lineTo(-40, 16 + kick);
        ctx.lineTo(-24, 10);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 이펙트
        for (const fx of state.effects) {
          const alpha = 1 - fx.age / 0.9;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = fx.color;
          ctx.font = "800 24px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText(fx.text, fx.x, fx.y - fx.age * 34);
          ctx.restore();
        }
        ctx.restore();
        ctx.textAlign = "left";

        // 드래그 조이스틱 표시
        if (state.drag && state.mode === "running") {
          const { startX, startY, curX, curY } = state.drag;
          ctx.strokeStyle = "rgba(248,250,252,0.5)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(startX, startY, 46, 0, Math.PI * 2);
          ctx.stroke();
          const dx = curX - startX;
          const dy = curY - startY;
          const len = Math.hypot(dx, dy) || 1;
          const knob = Math.min(46, len);
          ctx.fillStyle = "rgba(248,250,252,0.8)";
          ctx.beginPath();
          ctx.arc(startX + (dx / len) * knob, startY + (dy / len) * knob, 18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function renderHud() {
        ctx.fillStyle = "rgba(2, 6, 23, 0.8)";
        ctx.fillRect(0, 0, VIEW.width, 92);

        // 산소 게이지
        const ox = state.oxygen / OXYGEN_MAX;
        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(248,250,252,0.92)";
        roundRect(20, 14, 300, 56, 10);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.font = "800 17px Trebuchet MS";
        ctx.fillText("산소 " + Math.max(0, Math.round(state.oxygen)) + "%", 32, 36);
        ctx.fillStyle = "#cbd5e1";
        ctx.fillRect(32, 44, 272, 14);
        ctx.fillStyle = ox > 0.5 ? "#22d3ee" : ox > 0.25 ? "#fbbf24" : "#ef4444";
        ctx.fillRect(32, 44, 272 * Math.max(0, ox), 14);

        // 볬 현황
        ctx.fillStyle = "rgba(248,250,252,0.92)";
        roundRect(344, 14, 190, 56, 10);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.font = "800 20px Trebuchet MS";
        ctx.fillText("볬 " + state.collected + "/" + TREASURE_COUNT, 360, 40);
        ctx.font = "700 14px Trebuchet MS";
        ctx.fillStyle = state.collected >= TREASURE_COUNT ? "#15803d" : "#64748b";
        ctx.fillText(state.collected >= TREASURE_COUNT ? "수면으로 귀환!" : "상자를 찾으세요", 360, 60);

        // 수면까지 거리
        const dist = Math.max(0, Math.round((state.diver.y - SURFACE_Y) / 10));
        ctx.textAlign = "right";
        ctx.font = "800 20px Trebuchet MS";
        ctx.fillStyle = "#e0f2fe";
        ctx.fillText("수면까지 " + dist + "m", VIEW.width - 24, 38);
        ctx.font = "700 14px Trebuchet MS";
        ctx.fillStyle = "rgba(224,242,254,0.7)";
        ctx.fillText("경과 " + state.elapsed.toFixed(1) + "s", VIEW.width - 24, 60);
        ctx.textAlign = "left";
      }

      function renderCard(title, lines, accent, footer) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.85)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        roundRect(190, 70, 580, 400, 18);
        ctx.fill();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = accent;
        ctx.font = "700 40px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 138);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 22px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 208 + index * 42);
        });

        if (footer) {
          ctx.fillStyle = accent;
          roundRect(VIEW.width / 2 - 130, 408, 260, 46, 23);
          ctx.fill();
          ctx.fillStyle = "#f8fafc";
          ctx.font = "800 22px Trebuchet MS";
          ctx.fillText(footer, VIEW.width / 2, 438);
        }
        ctx.textAlign = "left";
      }

      function render() {
        if (state.mode === "menu") {
          renderWorld();
          renderCard("볬 잠수", [
            "해저의 볬 5개를 모으고 수면으로 돌아오세요",
            "조작: 터치 드래그로 잠수 방향 조절 (키보드 방향키)",
            "클리어 조건: 볬 5개를 싣고 수면 귀환 시 클리어",
            "실패 조건: 산소가 바닥나면 실패",
            "해파리에 닿으면 산소가 크게 줄어듭니다!",
          ], "#0ea5e9", "터치 또는 Enter로 시작");
          return;
        }

        if (state.mode === "running") {
          renderWorld();
          renderHud();
          return;
        }

        if (state.mode === "failed") {
          renderWorld();
          renderCard("실패", [
            "실패 원인: " + state.failReason,
            "수거한 볬: " + state.collected + "/" + TREASURE_COUNT,
            "클리어 조건: 볬 5개를 싣고 수면 귀환 시 클리어",
            "공유 목숨 1개가 즉시 종료되었습니다.",
          ], "#b91c1c");
          return;
        }

        renderWorld();
        renderCard("클리어!", [
          "볬 5개를 모두 싣고 수면으로 귀환했습니다",
          "걸린 시간: " + state.lastRunTime.toFixed(1) + "초",
          "남은 산소: " + Math.round(state.oxygen) + "%",
          "호스트가 다음 미플레이 스테이지를 선택합니다.",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, camera over 2400x1350 world, x right, y down",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          diver: { x: Math.round(state.diver.x), y: Math.round(state.diver.y) },
          oxygen: Math.round(state.oxygen * 10) / 10,
          treasures_collected: state.collected,
          treasures_total: TREASURE_COUNT,
          treasures: state.treasures.map((tr) => ({ x: Math.round(tr.x), y: Math.round(tr.y), got: tr.got })),
          jellies: state.jellies.map((j) => ({ x: Math.round(j.x), y: Math.round(j.y) })),
          surface_zone_x: SURFACE_ZONE_X,
          surface_y: SURFACE_Y,
          distance_to_surface_m: Math.max(0, Math.round((state.diver.y - SURFACE_Y) / 10)),
          stun: Math.round(state.stun * 100) / 100,
          fail_reason: state.failReason || undefined,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      const KEYMAP = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down",
        a: "left",
        d: "right",
        w: "up",
        s: "down",
      };

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode === "menu") {
          event.preventDefault();
          startStage();
          return;
        }
        const dir = KEYMAP[event.key];
        if (dir && state.mode === "running") {
          event.preventDefault();
          state.keys[dir] = true;
        }
      }

      function onKeyUp(event) {
        const dir = KEYMAP[event.key];
        if (dir) {
          state.keys[dir] = false;
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "treasure-dive",
        title: "보물 잠수",
        creator: "Anonymous Creator",
        genre: "Oxygen management",
        clearCondition: "보물 5개를 싣고 수면 귀환 시 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        const p = canvasPoint(event);
        state.drag = { startX: p.x, startY: p.y, curX: p.x, curY: p.y };
        canvas.setPointerCapture?.(event.pointerId);
      }, { passive: false });
      canvas.addEventListener("pointermove", (event) => {
        if (!state.drag) {
          return;
        }
        const p = canvasPoint(event);
        state.drag.curX = p.x;
        state.drag.curY = p.y;
      });
      const endDrag = (event) => {
        if (event) event.preventDefault();
        state.drag = null;
      };
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
      canvas.addEventListener("lostpointercapture", endDrag);
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
