<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>별자리 잇기</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">별자리 잇기. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 터치 드래그로 별을 순서대로 연결합니다. 모바일에서는 손가락으로 별에서 별로 드래그하세요. 클리어 조건은 별자리 3개 완성, 실패 조건은 잘못된 별 연결 5회입니다.</p>
    <canvas id="game" width="960" height="540" aria-label="별자리 잇기" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const STAR_RADIUS = 16;
      const TOUCH_RADIUS = 42;
      const MAX_MISTAKES = 5;
      const relayContext = window.RelayRuntime?.readContext("star-trail") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const CONSTELLATIONS = [
        {
          name: "큰곰자리",
          stars: [
            [150, 140], [260, 170], [350, 130], [430, 190],
            [520, 230], [470, 320], [360, 290],
          ],
        },
        {
          name: "카시오페아자리",
          stars: [
            [230, 300], [340, 200], [450, 280], [560, 170], [670, 260],
          ],
        },
        {
          name: "오리온자리",
          stars: [
            [200, 160], [330, 140], [360, 260], [330, 300], [360, 340],
            [250, 440], [430, 450], [470, 220],
          ],
        },
      ];

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        level: 0,
        nextIndex: 0,
        mistakes: 0,
        drawing: false,
        pointer: null,
        errorFlash: 0,
        levelBanner: 0,
        completedFlash: 0,
        twinkle: 0,
        note: "흩어진 별을 순서대로 연결해 별자리를 완성하세요",
      };

      // 배경 장식 별 (고정 시드)
      const bgStars = [];
      (function seedBg() {
        let seed = 1234567;
        const rand = () => {
          seed = (seed * 1103515245 + 12345) & 0x7fffffff;
          return seed / 0x7fffffff;
        };
        for (let i = 0; i < 90; i += 1) {
          bgStars.push({ x: rand() * VIEW.width, y: rand() * VIEW.height, r: 0.6 + rand() * 1.6, p: rand() * Math.PI * 2 });
        }
      })();

      function currentConstellation() {
        return CONSTELLATIONS[Math.min(state.level, CONSTELLATIONS.length - 1)];
      }

      function starPos(index) {
        const s = currentConstellation().stars[index];
        return { x: s[0], y: s[1] };
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.level = 0;
        state.nextIndex = 0;
        state.mistakes = 0;
        state.drawing = false;
        state.pointer = null;
        state.errorFlash = 0;
        state.levelBanner = 2.0;
        state.completedFlash = 0;
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * VIEW.width,
          y: ((event.clientY - rect.top) / rect.height) * VIEW.height,
        };
      }

      function starAt(point, excludeIndex) {
        const stars = currentConstellation().stars;
        for (let i = 0; i < stars.length; i += 1) {
          if (i === excludeIndex) continue;
          const dx = point.x - stars[i][0];
          const dy = point.y - stars[i][1];
          if (dx * dx + dy * dy <= TOUCH_RADIUS * TOUCH_RADIUS) {
            return i;
          }
        }
        return -1;
      }

      function registerMistake() {
        state.mistakes += 1;
        state.errorFlash = 0.5;
        state.drawing = false;
        state.pointer = null;
        if (state.mistakes >= MAX_MISTAKES) {
          failStage("wrong_connection_limit");
        }
      }

      function completeConstellation() {
        state.completedFlash = 1.2;
        state.drawing = false;
        state.pointer = null;
        if (state.level >= CONSTELLATIONS.length - 1) {
          clearStage();
          return;
        }
        state.level += 1;
        state.nextIndex = 0;
        state.levelBanner = 2.0;
      }

      function handleStarTouched(index) {
        if (index === state.nextIndex) {
          state.nextIndex += 1;
          if (state.nextIndex >= currentConstellation().stars.length) {
            completeConstellation();
          }
        } else if (index > state.nextIndex || index < state.nextIndex) {
          // 순서가 아닌 다른 별에 닿으면 오연결
          registerMistake();
        }
      }

      function onPointerDown(event) {
        if (state.mode !== "running") {
          event.preventDefault();
          startStage();
          return;
        }
        event.preventDefault();
        const point = canvasPoint(event);
        if (state.nextIndex > 0 || state.drawing) return;
        const startIndex = starAt(point, -1);
        if (startIndex === 0) {
          state.drawing = true;
          state.pointer = point;
          state.nextIndex = 1;
          if (state.nextIndex >= currentConstellation().stars.length) {
            completeConstellation();
          }
        }
      }

      function onPointerMove(event) {
        if (state.mode !== "running" || !state.drawing) return;
        event.preventDefault();
        const point = canvasPoint(event);
        state.pointer = point;
        const touched = starAt(point, state.nextIndex - 1);
        if (touched !== -1) {
          handleStarTouched(touched);
        }
      }

      function onPointerUp() {
        if (state.mode !== "running") return;
        // 손을 떼면 진행 중인 선은 유지하되 다음 터치에서 이어가도록 현재 별부터 다시 시작 가능하게 한다
        state.drawing = false;
        state.pointer = null;
      }

      function update(dt) {
        state.twinkle += dt;
        if (state.mode !== "running") return;
        state.elapsed += dt;
        if (state.errorFlash > 0) state.errorFlash = Math.max(0, state.errorFlash - dt);
        if (state.levelBanner > 0) state.levelBanner = Math.max(0, state.levelBanner - dt);
        if (state.completedFlash > 0) state.completedFlash = Math.max(0, state.completedFlash - dt);
      }

      function drawSky() {
        const gradient = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        gradient.addColorStop(0, "#0b1030");
        gradient.addColorStop(1, "#1e1b4b");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        for (const s of bgStars) {
          const a = 0.35 + 0.3 * Math.sin(state.twinkle * 2 + s.p);
          ctx.fillStyle = `rgba(226, 232, 240, ${a.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawStarShape(x, y, r, color, glow) {
        if (glow) {
          const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
          g.addColorStop(0, glow);
          g.addColorStop(1, "rgba(253, 224, 71, 0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r * 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(x, y, r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      function renderRunning() {
        drawSky();
        const con = currentConstellation();

        // 확정된 선
        ctx.strokeStyle = "rgba(147, 197, 253, 0.95)";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.beginPath();
        for (let i = 0; i < state.nextIndex; i += 1) {
          const p = starPos(i);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // 진행 중인 선
        if (state.drawing && state.pointer && state.nextIndex > 0) {
          const last = starPos(state.nextIndex - 1);
          ctx.strokeStyle = "rgba(253, 224, 71, 0.8)";
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.moveTo(last.x, last.y);
          ctx.lineTo(state.pointer.x, state.pointer.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 별들
        for (let i = 0; i < con.stars.length; i += 1) {
          const p = starPos(i);
          const isDone = i < state.nextIndex;
          const isNext = i === state.nextIndex;
          if (isNext) {
            // 힌트: 파동
            const pulse = (state.twinkle * 1.2) % 1;
            ctx.strokeStyle = `rgba(253, 224, 71, ${(0.8 * (1 - pulse)).toFixed(3)})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(p.x, p.y, STAR_RADIUS + pulse * 22, 0, Math.PI * 2);
            ctx.stroke();
          }
          const glowAlpha = isNext ? 0.5 + 0.4 * Math.sin(state.twinkle * 6) : (isDone ? 0.35 : 0);
          drawStarShape(
            p.x,
            p.y,
            isNext ? STAR_RADIUS : STAR_RADIUS * 0.85,
            isDone ? "#fde047" : isNext ? "#fef9c3" : "#94a3b8",
            glowAlpha > 0 ? `rgba(253, 224, 71, ${Math.max(0, glowAlpha).toFixed(3)})` : null,
          );
          if (isDone) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.font = "700 13px Trebuchet MS";
            ctx.textAlign = "center";
            ctx.fillText(String(i + 1), p.x, p.y + 4);
          }
        }

        // 오류 플래시
        if (state.errorFlash > 0) {
          ctx.fillStyle = `rgba(220, 38, 38, ${(state.errorFlash * 0.5).toFixed(3)})`;
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        }

        // 완성 플래시
        if (state.completedFlash > 0) {
          ctx.fillStyle = `rgba(253, 224, 71, ${(state.completedFlash * 0.18).toFixed(3)})`;
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        }

        // HUD
        ctx.fillStyle = "rgba(15, 23, 42, 0.7)";
        ctx.fillRect(0, 0, VIEW.width, 56);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "700 20px Trebuchet MS";
        ctx.textAlign = "left";
        ctx.fillText(`별자리 ${state.level + 1}/${CONSTELLATIONS.length}: ${con.name}`, 18, 36);
        ctx.textAlign = "right";
        const remain = MAX_MISTAKES - state.mistakes;
        ctx.fillStyle = remain <= 2 ? "#fca5a5" : "#f8fafc";
        ctx.fillText(`오연결 ${state.mistakes}/${MAX_MISTAKES}`, VIEW.width - 18, 36);
        ctx.textAlign = "left";

        // 레벨 배너
        if (state.levelBanner > 0) {
          ctx.fillStyle = `rgba(15, 23, 42, ${Math.min(0.85, state.levelBanner).toFixed(3)})`;
          ctx.fillRect(280, 220, 400, 100);
          ctx.strokeStyle = "#fde047";
          ctx.lineWidth = 3;
          ctx.strokeRect(280, 220, 400, 100);
          ctx.fillStyle = "#fde047";
          ctx.font = "700 30px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText(con.name, VIEW.width / 2, 262);
          ctx.fillStyle = "#e2e8f0";
          ctx.font = "600 18px Trebuchet MS";
          ctx.fillText("빛나는 별부터 순서대로 연결하세요", VIEW.width / 2, 296);
          ctx.textAlign = "left";
        }
      }

      function renderCard(title, lines, accent, footer) {
        drawSky();
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(30, 27, 75, 0.97)";
        ctx.fillRect(128, 82, 704, 386);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 82, 704, 386);

        ctx.fillStyle = accent;
        ctx.font = "700 40px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 152);

        ctx.fillStyle = "#e2e8f0";
        ctx.font = "600 23px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 222 + index * 42);
        });
        if (footer) {
          ctx.fillStyle = "#fde047";
          ctx.font = "700 22px Trebuchet MS";
          ctx.fillText(footer, VIEW.width / 2, 440);
        }
        ctx.textAlign = "left";
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("별자리 잇기", [
            "흩어진 별을 순서대로 연결해 별자리를 완성하세요",
            "조작: 터치 드래그로 별을 순서대로 연결",
            "모바일: 손가락으로 빛나는 별에서 다음 별로 드래그",
            "클리어 조건: 별자리 3개를 모두 완성하면 클리어",
            "실패 조건: 잘못된 별 연결 5회 시 실패",
          ], "#fde047", "화면을 터치하거나 Enter를 눌러 시작");
          return;
        }

        if (state.mode === "running") {
          renderRunning();
          return;
        }

        if (state.mode === "failed") {
          renderCard("실패", [
            "잘못된 별 연결 5회로 실패했습니다",
            `완성한 별자리: ${state.level}개 · 플레이 시간 ${state.lastRunTime.toFixed(1)}초`,
            "다음 순서의 별만 연결해야 합니다",
          ], "#f87171", "화면을 터치하면 다시 시작합니다");
          return;
        }

        renderCard("클리어", [
          "별자리 3개를 모두 완성했습니다!",
          `플레이 시간 ${state.lastRunTime.toFixed(1)}초 · 오연결 ${state.mistakes}회`,
          "밤하늘이 아름다운 별자리로 가득 찼습니다",
        ], "#4ade80", "화면을 터치하면 다시 시작합니다");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "canvas 960x540, origin top-left",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          level: state.level + 1,
          constellation: currentConstellation().name,
          connected: state.nextIndex,
          total_stars: currentConstellation().stars.length,
          mistakes: state.mistakes,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode !== "running") {
          event.preventDefault();
          startStage();
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "star-trail",
        title: "별자리 잇기",
        creator: "Anonymous Creator",
        genre: "Constellation puzzle",
        clearCondition: "별자리 3개를 모두 완성하면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerUp);
      canvas.addEventListener("touchstart", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
        }
      }, { passive: false });
      canvas.addEventListener("click", () => {
        if (state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
        canvas.focus();
      });
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
