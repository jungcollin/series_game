<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인형뽑기</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">인형뽑기. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 터치로 집게 정지·하강 입니다. 첫 터치로 좌우로 왕복하는 집게를 멈추고, 두 번째 터치로 집게를 내려 인형을 집습니다. 인형 위치와 정확히 맞아야 성공하며, 약한 인형은 올리는 도중 미끄러질 수 있습니다. 인형 4개를 뽑으면 클리어, 5회 실패 시 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="인형뽑기" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" id="btn-act" class="mobile-btn" aria-label="집게 정지 또는 하강">정지/하강</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("claw-machine") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const MACHINE = { left: 140, right: 820, top: 120, floor: 430, chuteX: 90 };
      const WIN_GOAL = 4;
      const FAIL_LIMIT = 5;
      const DOLL_COLORS = ["#f472b6", "#facc15", "#4ade80", "#60a5fa", "#fb923c", "#c084fc"];

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "움직이는 집게를 멈춰 인형을 정확히 집으세요",
        wins: 0,
        fails: 0,
        phase: "move", // move -> stopped -> dropping -> grabbing -> rising -> returning
        clawX: 480,
        clawY: MACHINE.top,
        clawDir: 1,
        clawSpeed: 240,
        clawSway: 0,
        phaseTimer: 0,
        dolls: [],
        heldDoll: null,
        dropResult: null, // "success" | "miss" | "slip"
        flash: 0,
        flashColor: "#22c55e",
        message: "",
        messageTimer: 0,
      };

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function spawnDolls() {
        const dolls = [];
        const count = 7;
        for (let i = 0; i < count; i += 1) {
          const slotWidth = (MACHINE.right - MACHINE.left - 120) / count;
          const x = MACHINE.left + 70 + slotWidth * i + rand(-18, 18);
          const weak = Math.random() < 0.35;
          dolls.push({
            x,
            y: MACHINE.floor,
            r: weak ? 22 : 28,
            weak,
            color: DOLL_COLORS[i % DOLL_COLORS.length],
            gone: false,
            slipY: 0,
          });
        }
        state.dolls = dolls;
      }

      function resetClaw() {
        state.phase = "move";
        state.clawX = rand(MACHINE.left + 80, MACHINE.right - 80);
        state.clawY = MACHINE.top;
        state.clawDir = Math.random() < 0.5 ? 1 : -1;
        state.clawSpeed = rand(200, 300);
        state.heldDoll = null;
        state.dropResult = null;
      }

      function startAttempt() {
        spawnDolls();
        resetClaw();
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.wins = 0;
        state.fails = 0;
        state.flash = 0;
        state.message = "터치로 집게를 멈추세요!";
        state.messageTimer = 2.5;
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
        startAttempt();
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
          return true;
        }
        return false;
      }

      function showMessage(text, seconds = 1.6) {
        state.message = text;
        state.messageTimer = seconds;
      }

      function judgeDrop() {
        // find nearest doll under claw
        let best = null;
        let bestDist = Infinity;
        for (const doll of state.dolls) {
          if (doll.gone) continue;
          const d = Math.abs(doll.x - state.clawX);
          if (d < bestDist) {
            bestDist = d;
            best = doll;
          }
        }
        if (best && bestDist <= best.r * 0.85) {
          state.heldDoll = best;
          best.gone = true;
          state.dropResult = "grabbed";
          showMessage("집었다! 조심히 올리는 중…", 1.4);
        } else {
          state.heldDoll = null;
          state.dropResult = "miss";
          showMessage("빗나갔어요!", 1.4);
        }
      }

      function resolveAttempt() {
        if (state.dropResult === "grabbed" && state.heldDoll) {
          state.wins += 1;
          state.flash = 0.6;
          state.flashColor = "#22c55e";
          showMessage(`성공! 인형 ${state.wins}/${WIN_GOAL}`, 1.8);
          if (state.wins >= WIN_GOAL) {
            clearStage();
            return;
          }
        } else {
          state.fails += 1;
          state.flash = 0.6;
          state.flashColor = "#ef4444";
          showMessage(`실패… ${state.fails}/${FAIL_LIMIT}`, 1.8);
          if (state.fails >= FAIL_LIMIT) {
            failStage("five_misses");
            return;
          }
        }
        // next attempt: dolls rearranged
        startAttempt();
      }

      function handleAction() {
        if (startFromTouch()) {
          return;
        }
        if (state.mode !== "running") {
          return;
        }
        if (state.phase === "move") {
          state.phase = "stopped";
          showMessage("위치 고정! 다시 터치하면 하강", 2.5);
        } else if (state.phase === "stopped") {
          state.phase = "dropping";
        }
      }

      function update(dt) {
        if (state.flash > 0) {
          state.flash = Math.max(0, state.flash - dt);
        }
        if (state.messageTimer > 0) {
          state.messageTimer = Math.max(0, state.messageTimer - dt);
        }
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;

        if (state.phase === "move") {
          state.clawX += state.clawDir * state.clawSpeed * dt;
          if (state.clawX > MACHINE.right - 40) {
            state.clawX = MACHINE.right - 40;
            state.clawDir = -1;
          } else if (state.clawX < MACHINE.left + 40) {
            state.clawX = MACHINE.left + 40;
            state.clawDir = 1;
          }
        } else if (state.phase === "stopped") {
          state.clawSway += dt;
          // gentle idle sway, no movement
        } else if (state.phase === "dropping") {
          state.clawY += 320 * dt;
          if (state.clawY >= MACHINE.floor - 10) {
            state.clawY = MACHINE.floor - 10;
            judgeDrop();
            state.phase = "grabbing";
            state.phaseTimer = 0.45;
          }
        } else if (state.phase === "grabbing") {
          state.phaseTimer -= dt;
          if (state.phaseTimer <= 0) {
            state.phase = "rising";
          }
        } else if (state.phase === "rising") {
          state.clawY -= 260 * dt;
          if (state.heldDoll) {
            // weak dolls can slip mid-rise
            const slipChance = state.heldDoll.weak ? 0.45 : 0.1;
            if (state.dropResult === "grabbed" && Math.random() < slipChance * dt * 2.2) {
              state.dropResult = "slip";
              state.heldDoll.slipY = 0;
              showMessage("앗! 미끄러졌어요…", 1.4);
            }
            if (state.dropResult === "slip") {
              state.heldDoll.slipY += 500 * dt;
              if (state.heldDoll.slipY > 200) {
                state.heldDoll = null;
                state.dropResult = "miss";
              }
            }
          }
          if (state.clawY <= MACHINE.top) {
            state.clawY = MACHINE.top;
            state.phase = "returning";
            state.phaseTimer = 0.3;
          }
        } else if (state.phase === "returning") {
          state.phaseTimer -= dt;
          if (state.phaseTimer <= 0) {
            resolveAttempt();
          }
        }
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(128, 92, 704, 356);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 92, 704, 356);

        ctx.fillStyle = accent;
        ctx.font = "700 42px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 162);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 24px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 232 + index * 46);
        });
        ctx.textAlign = "left";
      }

      function drawDoll(doll) {
        const y = doll.y + (doll.slipY || 0);
        if (y > VIEW.height + 40) return;
        ctx.fillStyle = doll.color;
        ctx.beginPath();
        ctx.arc(doll.x, y - doll.r, doll.r, 0, Math.PI * 2);
        ctx.fill();
        // ears
        ctx.beginPath();
        ctx.arc(doll.x - doll.r * 0.6, y - doll.r * 1.8, doll.r * 0.35, 0, Math.PI * 2);
        ctx.arc(doll.x + doll.r * 0.6, y - doll.r * 1.8, doll.r * 0.35, 0, Math.PI * 2);
        ctx.fill();
        // face
        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(doll.x - doll.r * 0.3, y - doll.r * 1.1, 3, 0, Math.PI * 2);
        ctx.arc(doll.x + doll.r * 0.3, y - doll.r * 1.1, 3, 0, Math.PI * 2);
        ctx.fill();
        if (doll.weak) {
          ctx.strokeStyle = "rgba(248,250,252,0.9)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(doll.x, y - doll.r, doll.r + 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 11px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText("약", doll.x, y - doll.r * 2.2);
          ctx.textAlign = "left";
        }
      }

      function drawClaw() {
        const x = state.clawX + (state.phase === "stopped" ? Math.sin(state.clawSway * 3) * 3 : 0);
        const y = state.clawY;
        // cable
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, y);
        ctx.stroke();
        // claw body
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(x - 14, y - 10, 28, 20);
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 14, y - 10, 28, 20);
        // prongs
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(x - 12, y + 10);
        ctx.quadraticCurveTo(x - 26, y + 34, x - 8, y + 44);
        ctx.moveTo(x + 12, y + 10);
        ctx.quadraticCurveTo(x + 26, y + 34, x + 8, y + 44);
        ctx.stroke();
        // held doll follows claw
        if (state.heldDoll) {
          const d = state.heldDoll;
          d.x = x;
          d.y = y + 44 + d.r + (d.slipY || 0);
        }
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("인형뽑기", [
            "움직이는 집게를 멈춰 인형을 정확히 집으세요",
            "조작: 터치로 집게 정지·하강",
            "첫 터치: 좌우 이동 정지 / 두 번째 터치: 하강",
            "테두리가 있는 '약' 인형은 올리는 도중 미끄러질 수 있어요",
            "클리어 조건: 인형 4개를 뽑으면 클리어",
            "실패 조건: 5회 실패 시 실패",
            "터치 또는 Enter로 시작",
          ], "#f97316");
          return;
        }

        if (state.mode === "running") {
          // machine cabinet
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
          ctx.fillStyle = "#7c2d12";
          ctx.fillRect(MACHINE.left - 60, 90, MACHINE.right - MACHINE.left + 120, MACHINE.floor - 90 + 70);
          ctx.fillStyle = "#bae6fd";
          ctx.fillRect(MACHINE.left - 30, 110, MACHINE.right - MACHINE.left + 60, MACHINE.floor - 110);
          // glass shine
          ctx.fillStyle = "rgba(248,250,252,0.12)";
          ctx.beginPath();
          ctx.moveTo(MACHINE.left - 30, 110);
          ctx.lineTo(MACHINE.left + 120, 110);
          ctx.lineTo(MACHINE.left + 20, MACHINE.floor);
          ctx.lineTo(MACHINE.left - 30, MACHINE.floor);
          ctx.closePath();
          ctx.fill();
          // floor
          ctx.fillStyle = "#78350f";
          ctx.fillRect(MACHINE.left - 30, MACHINE.floor, MACHINE.right - MACHINE.left + 60, 14);
          // chute
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(MACHINE.chuteX - 40, MACHINE.floor - 30, 80, 44);
          ctx.strokeStyle = "#f97316";
          ctx.lineWidth = 3;
          ctx.strokeRect(MACHINE.chuteX - 40, MACHINE.floor - 30, 80, 44);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 14px Trebuchet MS";
          ctx.textAlign = "center";
          ctx.fillText("출구", MACHINE.chuteX, MACHINE.floor + 34);
          ctx.textAlign = "left";
          // rail
          ctx.fillStyle = "#475569";
          ctx.fillRect(MACHINE.left - 30, MACHINE.top - 22, MACHINE.right - MACHINE.left + 60, 10);
          // dolls
          for (const doll of state.dolls) {
            if (!doll.gone) drawDoll(doll);
          }
          if (state.heldDoll) drawDoll(state.heldDoll);
          drawClaw();

          // HUD
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.fillRect(0, 0, VIEW.width, 76);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "800 24px Trebuchet MS";
          ctx.fillText(`성공 ${state.wins}/${WIN_GOAL}`, 24, 34);
          ctx.fillStyle = "#fca5a5";
          ctx.fillText(`실패 ${state.fails}/${FAIL_LIMIT}`, 24, 64);
          ctx.fillStyle = "#facc15";
          ctx.textAlign = "right";
          const phaseLabel = {
            move: "집게 이동 중 — 터치로 정지",
            stopped: "정지됨 — 터치로 하강",
            dropping: "하강 중…",
            grabbing: "집는 중…",
            rising: "올리는 중…",
            returning: "정리 중…",
          }[state.phase];
          ctx.fillText(phaseLabel, VIEW.width - 24, 48);
          ctx.textAlign = "left";

          // message banner
          if (state.messageTimer > 0 && state.message) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            const w = ctx.measureText(state.message).width + 48;
            ctx.fillRect((VIEW.width - w) / 2, 470, w, 44);
            ctx.fillStyle = "#f8fafc";
            ctx.font = "700 22px Trebuchet MS";
            ctx.textAlign = "center";
            ctx.fillText(state.message, VIEW.width / 2, 500);
            ctx.textAlign = "left";
          }

          // flash feedback
          if (state.flash > 0) {
            ctx.fillStyle = state.flashColor === "#22c55e"
              ? `rgba(34,197,94,${(state.flash * 0.35).toFixed(3)})`
              : `rgba(239,68,68,${(state.flash * 0.35).toFixed(3)})`;
            ctx.fillRect(0, 0, VIEW.width, VIEW.height);
          }
          return;
        }

        if (state.mode === "failed") {
          renderCard("실패", [
            "인형을 너무 많이 놓쳤어요",
            "5회 실패 시 실패",
            `성공 ${state.wins}/${WIN_GOAL} · 실패 ${state.fails}/${FAIL_LIMIT}`,
            `플레이 시간 ${state.lastRunTime.toFixed(1)}초`,
            "터치 또는 Enter로 다시 도전",
          ], "#b91c1c");
          return;
        }

        renderCard("클리어", [
          "인형뽑기 성공!",
          "인형 4개를 뽑으면 클리어",
          `실패 ${state.fails}회 만에 완료`,
          `플레이 시간 ${state.lastRunTime.toFixed(1)}초`,
          "터치 또는 Enter로 다시 플레이",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          wins: state.wins,
          win_goal: WIN_GOAL,
          fails: state.fails,
          fail_limit: FAIL_LIMIT,
          phase: state.phase,
          claw: { x: Math.round(state.clawX), y: Math.round(state.clawY) },
          dolls_remaining: state.dolls.filter((d) => !d.gone).length,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode === "menu") {
          event.preventDefault();
          startStage();
          return;
        }
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          handleAction();
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "claw-machine",
        title: "인형뽑기",
        creator: "Anonymous Creator",
        genre: "Claw timing",
        clearCondition: "인형 4개를 뽑으면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        handleAction();
      }, { passive: false });
      canvas.addEventListener("touchstart", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
        }
      }, { passive: false });
      document.querySelector("#btn-act")?.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        handleAction();
      });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
