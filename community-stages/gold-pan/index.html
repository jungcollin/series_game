<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사금 장인</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0f172a;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 96px;
        min-width: 64px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.78);
        color: #f8fafc;
        font: 800 24px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 80px;
          min-width: 56px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">사금 장인. 캔버스를 터치하거나 Enter로 시작하세요. 조작은 화면을 좌우로 밀어 팬 흔들기 입니다. 화면을 좌우로 규칙적으로 드래그하거나 좌우 화살표 키를 번갈아 눌러 팬을 흔들면 모래가 털려 나갑니다. 너무 빠르거나 불규칙하게 흔들면 금 조각이 튀어 유실됩니다. 모래를 다 털면 남은 금을 얻습니다. 금 10점을 모으면 클리어, 금 5점을 흘려내면 실패합니다.</p>
    <canvas id="game" width="960" height="540" aria-label="사금 장인" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button type="button" id="btn-left" class="mobile-btn" aria-label="왼쪽으로 흔들기">◀</button>
        <button type="button" id="btn-right" class="mobile-btn" aria-label="오른쪽으로 흔들기">▶</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const relayContext = window.RelayRuntime?.readContext("gold-pan") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      const PAN = { x: 480, y: 400, rx: 190, ry: 60 };
      const WIN_GOAL = 10;
      const LOSE_LIMIT = 5;
      // good shake: direction flips at a steady rhythm
      const GOOD_MIN_GAP = 0.18; // seconds
      const GOOD_MAX_GAP = 0.7;
      const BAD_GAP = 0.09; // too fast = violent

      const state = {
        mode: "menu",
        elapsed: 0,
        lastRunTime: 0,
        note: "팬을 좌우로 흔들어 모래를 털고 금만 남기세요",
        gold: 0,
        lost: 0,
        sand: 1, // 0..1 fraction remaining in current pan
        panIndex: 0,
        nuggets: [], // {x,y,r,gone,spillVx}
        panShake: 0, // visual offset
        panVel: 0,
        lastDir: 0, // -1 or 1
        lastShakeAt: -999,
        gaps: [], // recent intervals for rhythm gauge
        rhythm: 0, // 0..1 smoothed quality
        combo: 0,
        flash: 0,
        flashColor: "#22c55e",
        message: "",
        messageTimer: 0,
        panClearing: false,
        clearTimer: 0,
      };

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function spawnPan() {
        state.panIndex += 1;
        const goldCount = 3 + Math.floor(rand(0, 4)); // 3-6
        state.sand = rand(0.55, 1);
        state.nuggets = [];
        for (let i = 0; i < goldCount; i += 1) {
          state.nuggets.push({
            x: PAN.x + rand(-PAN.rx * 0.7, PAN.rx * 0.7),
            y: PAN.y + rand(-PAN.ry * 0.4, PAN.ry * 0.4),
            r: rand(9, 13),
            gone: false,
            spillVx: 0,
            spillY: 0,
          });
        }
        state.panClearing = false;
        state.clearTimer = 0;
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) {
          return;
        }
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) {
          return;
        }
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) {
          return;
        }
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.gold = 0;
        state.lost = 0;
        state.combo = 0;
        state.rhythm = 0;
        state.gaps = [];
        state.lastDir = 0;
        state.lastShakeAt = -999;
        state.panIndex = 0;
        state.flash = 0;
        state.message = "좌우로 규칙적으로 흔들어 보세요!";
        state.messageTimer = 2.5;
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
        spawnPan();
      }

      function failStage(reason = "failed") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
          return true;
        }
        return false;
      }

      function showMessage(text, seconds = 1.4) {
        state.message = text;
        state.messageTimer = seconds;
      }

      function loseGold() {
        const alive = state.nuggets.filter((n) => !n.gone);
        if (!alive.length) return;
        const victim = alive[Math.floor(Math.random() * alive.length)];
        victim.gone = true;
        victim.spillVx = state.lastDir * rand(300, 500);
        victim.spillY = 0;
        state.lost += 1;
        state.combo = 0;
        state.flash = 0.5;
        state.flashColor = "#ef4444";
        showMessage(`금을 흘렸어요! 유실 ${state.lost}/${LOSE_LIMIT}`, 1.6);
        if (state.lost >= LOSE_LIMIT) {
          failStage("gold_spilled");
        }
      }

      function shake(dir) {
        if (startFromTouch()) {
          return;
        }
        if (state.mode !== "running" || state.panClearing) {
          return;
        }
        state.panVel += dir * 420;
        const now = state.elapsed;
        const gap = now - state.lastShakeAt;
        const alternated = state.lastDir !== 0 && dir !== state.lastDir;
        state.lastShakeAt = now;
        state.lastDir = dir;

        if (!alternated) {
          // same direction repeatedly: poor technique
          state.combo = 0;
          state.rhythm = Math.max(0, state.rhythm - 0.25);
          if (Math.random() < 0.12) loseGold();
          return;
        }
        if (gap < BAD_GAP) {
          // violent shake
          state.combo = 0;
          state.rhythm = Math.max(0, state.rhythm - 0.3);
          if (Math.random() < 0.35) loseGold();
          return;
        }
        if (gap > GOOD_MAX_GAP) {
          state.combo = 0;
          state.rhythm = Math.max(0, state.rhythm - 0.1);
        }
        if (gap >= GOOD_MIN_GAP && gap <= GOOD_MAX_GAP) {
          // good rhythmic shake
          state.combo += 1;
          state.rhythm = Math.min(1, state.rhythm + 0.12);
          state.gaps.push(gap);
          if (state.gaps.length > 6) state.gaps.shift();
          const bonus = Math.min(0.02, state.combo * 0.003);
          state.sand = Math.max(0, state.sand - (0.045 + bonus));
          if (state.sand <= 0 && !state.panClearing) {
            state.panClearing = true;
            state.clearTimer = 1.0;
            const kept = state.nuggets.filter((n) => !n.gone).length;
            state.gold += kept;
            state.flash = 0.6;
            state.flashColor = "#22c55e";
            showMessage(`판 완료! 금 +${kept} (누적 ${state.gold}/${WIN_GOAL})`, 1.8);
          }
        } else {
          state.combo = 0;
          state.rhythm = Math.max(0, state.rhythm - 0.15);
        }
      }

      function update(dt) {
        if (state.flash > 0) {
          state.flash = Math.max(0, state.flash - dt);
        }
        if (state.messageTimer > 0) {
          state.messageTimer = Math.max(0, state.messageTimer - dt);
        }
        // pan visual physics
        state.panVel *= Math.pow(0.0001, dt); // strong damping
        state.panShake += state.panVel * dt;
        state.panShake += (0 - state.panShake) * Math.min(1, dt * 10);
        state.panShake = Math.max(-60, Math.min(60, state.panShake));
        if (state.mode !== "running") {
          return;
        }
        state.elapsed += dt;
        // rhythm decays over time
        state.rhythm = Math.max(0, state.rhythm - dt * 0.08);
        if (state.panClearing) {
          state.clearTimer -= dt;
          if (state.clearTimer <= 0) {
            if (state.gold >= WIN_GOAL) {
              clearStage();
              return;
            }
            spawnPan();
          }
        }
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(128, 92, 704, 356);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(128, 92, 704, 356);

        ctx.fillStyle = accent;
        ctx.font = "700 42px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 162);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 24px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 232 + index * 46);
        });
        ctx.textAlign = "left";
      }

      function render() {
        if (state.mode === "menu") {
          renderCard("사금 장인", [
            "팬을 좌우로 흔들어 모래를 털고 금만 남기세요",
            "조작: 화면을 좌우로 밀어 팬 흔들기",
            "키보드: ← / → 키 번갈아 누르기",
            "일정한 리듬으로 교대로 흔들면 모래가 잘 털려요",
            "너무 빠르거나 한쪽만 밀면 금이 튀어요",
            "클리어 조건: 금 10점을 모으면 클리어",
            "실패 조건: 금 5점을 흘려내면 실패",
            "터치 또는 Enter로 시작",
          ], "#d97706");
          return;
        }

        if (state.mode === "running") {
          // stream background
          const sky = ctx.createLinearGradient(0, 0, 0, VIEW.height);
          sky.addColorStop(0, "#164e63");
          sky.addColorStop(1, "#0e7490");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
          // water
          ctx.fillStyle = "rgba(103,232,249,0.35)";
          ctx.fillRect(0, 300, VIEW.width, VIEW.height - 300);
          // stream bed
          ctx.fillStyle = "#a16207";
          ctx.fillRect(0, 470, VIEW.width, 70);

          // pan (bowl from side view)
          const px = PAN.x + state.panShake;
          ctx.fillStyle = "#57534e";
          ctx.beginPath();
          ctx.ellipse(px, PAN.y, PAN.rx, PAN.ry, 0, 0, Math.PI);
          ctx.fill();
          ctx.fillStyle = "#78716c";
          ctx.beginPath();
          ctx.ellipse(px, PAN.y - 4, PAN.rx - 14, PAN.ry - 12, 0, 0, Math.PI);
          ctx.fill();
          // sand layer inside pan
          if (state.sand > 0) {
            ctx.fillStyle = "#eab308";
            ctx.globalAlpha = 0.55 + 0.35 * state.sand;
            ctx.beginPath();
            ctx.ellipse(px, PAN.y + 6, (PAN.rx - 26) * (0.35 + 0.65 * state.sand), (PAN.ry - 20) * state.sand, 0, 0, Math.PI);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          // gold nuggets
          for (const n of state.nuggets) {
            if (!n.gone) {
              ctx.fillStyle = "#fde047";
              ctx.beginPath();
              ctx.arc(n.x + state.panShake * 0.6, n.y, n.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = "#ca8a04";
              ctx.lineWidth = 2;
              ctx.stroke();
            }
          }

          // HUD
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.fillRect(0, 0, VIEW.width, 96);
          ctx.fillStyle = "#fde047";
          ctx.font = "800 24px Trebuchet MS";
          ctx.fillText(`누적 금 ${state.gold}/${WIN_GOAL}`, 24, 34);
          ctx.fillStyle = "#fca5a5";
          ctx.fillText(`유실 ${state.lost}/${LOSE_LIMIT}`, 24, 66);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 16px Trebuchet MS";
          ctx.fillText(`판 ${state.panIndex}`, 24, 88);
          // sand gauge
          ctx.fillStyle = "#f8fafc";
          ctx.textAlign = "right";
          ctx.fillText("모래 잔량", VIEW.width - 24, 22);
          ctx.textAlign = "left";
          ctx.fillStyle = "#334155";
          ctx.fillRect(VIEW.width - 244, 30, 220, 14);
          ctx.fillStyle = "#eab308";
          ctx.fillRect(VIEW.width - 244, 30, 220 * state.sand, 14);
          ctx.strokeStyle = "#94a3b8";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(VIEW.width - 244, 30, 220, 14);
          // rhythm gauge
          ctx.fillStyle = "#f8fafc";
          ctx.textAlign = "right";
          ctx.fillText("리듬", VIEW.width - 24, 62);
          ctx.textAlign = "left";
          ctx.fillStyle = "#334155";
          ctx.fillRect(VIEW.width - 244, 68, 220, 14);
          ctx.fillStyle = state.rhythm > 0.4 ? "#22c55e" : "#f97316";
          ctx.fillRect(VIEW.width - 244, 68, 220 * state.rhythm, 14);
          ctx.strokeStyle = "#94a3b8";
          ctx.strokeRect(VIEW.width - 244, 68, 220, 14);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 15px Trebuchet MS";
          ctx.fillText(`콤보 x${state.combo}`, VIEW.width - 244, 98);

          // direction hint arrows near pan
          ctx.fillStyle = "rgba(248,250,252,0.75)";
          ctx.font = "800 40px Trebuchet MS";
          ctx.textAlign = "center";
          const pulse = 0.55 + 0.35 * Math.sin(state.elapsed * 6);
          ctx.globalAlpha = state.lastDir === 1 ? pulse : 0.35;
          ctx.fillText("◀", px - PAN.rx - 60, PAN.y + 14);
          ctx.globalAlpha = state.lastDir === -1 ? pulse : 0.35;
          ctx.fillText("▶", px + PAN.rx + 60, PAN.y + 14);
          ctx.globalAlpha = 1;
          ctx.textAlign = "left";

          // message banner
          if (state.messageTimer > 0 && state.message) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            const w = ctx.measureText(state.message).width + 48;
            ctx.fillRect((VIEW.width - w) / 2, 486, w, 40);
            ctx.fillStyle = "#f8fafc";
            ctx.font = "700 20px Trebuchet MS";
            ctx.textAlign = "center";
            ctx.fillText(state.message, VIEW.width / 2, 514);
            ctx.textAlign = "left";
          }

          // flash feedback
          if (state.flash > 0) {
            ctx.fillStyle = state.flashColor === "#22c55e"
              ? `rgba(34,197,94,${(state.flash * 0.3).toFixed(3)})`
              : `rgba(239,68,68,${(state.flash * 0.3).toFixed(3)})`;
            ctx.fillRect(0, 0, VIEW.width, VIEW.height);
          }
          return;
        }

        if (state.mode === "failed") {
          renderCard("실패", [
            "금을 너무 많이 흘려냈어요",
            "금 5점을 흘려내면 실패",
            `누적 금 ${state.gold}/${WIN_GOAL} · 유실 ${state.lost}/${LOSE_LIMIT}`,
            `플레이 시간 ${state.lastRunTime.toFixed(1)}초`,
            "터치 또는 Enter로 다시 도전",
          ], "#b91c1c");
          return;
        }

        renderCard("클리어", [
          "사금 채취 성공!",
          "금 10점을 모으면 클리어",
          `유실 ${state.lost}점 만에 완료`,
          `플레이 시간 ${state.lastRunTime.toFixed(1)}초`,
          "터치 또는 Enter로 다시 플레이",
        ], "#15803d");
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 canvas, x right, y down",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          gold: state.gold,
          win_goal: WIN_GOAL,
          lost: state.lost,
          lose_limit: LOSE_LIMIT,
          sand: Math.round(state.sand * 100) / 100,
          pan: state.panIndex,
          combo: state.combo,
          nuggets_in_pan: state.nuggets.filter((n) => !n.gone).length,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode === "menu") {
          event.preventDefault();
          startStage();
          return;
        }
        if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") {
          event.preventDefault();
          shake(-1);
        } else if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") {
          event.preventDefault();
          shake(1);
        } else if (event.key === "Enter") {
          event.preventDefault();
          if (state.mode === "failed" || state.mode === "cleared") startStage();
        }
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "gold-pan",
        title: "사금 장인",
        creator: "Anonymous Creator",
        genre: "Shake rhythm",
        clearCondition: "금 10점을 모으면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      // swipe handling: horizontal drag direction changes count as shakes
      let dragStartX = null;
      let dragLastX = null;
      let dragAccum = 0;
      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        if (startFromTouch()) {
          return;
        }
        dragStartX = event.clientX;
        dragLastX = event.clientX;
        dragAccum = 0;
      }, { passive: false });
      canvas.addEventListener("pointermove", (event) => {
        if (dragStartX === null || state.mode !== "running") {
          return;
        }
        event.preventDefault();
        const dx = event.clientX - dragLastX;
        dragLastX = event.clientX;
        dragAccum += dx;
        const threshold = 24;
        if (dragAccum > threshold) {
          shake(1);
          dragAccum = 0;
        } else if (dragAccum < -threshold) {
          shake(-1);
          dragAccum = 0;
        }
      }, { passive: false });
      const endDrag = () => {
        dragStartX = null;
        dragAccum = 0;
      };
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
      canvas.addEventListener("touchstart", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
        }
      }, { passive: false });
      const btnLeft = document.querySelector("#btn-left");
      const btnRight = document.querySelector("#btn-right");
      btnLeft?.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        shake(-1);
      });
      btnRight?.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        canvas.focus();
        shake(1);
      });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
