<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Stages</title>
    <link rel="icon" href="../favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=20260908" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=20260908" />
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <a class="skip-link" href="#launcher-main">본문으로 건너뛰기</a>
    <main id="launcher-main" class="launcher-shell">
      <header class="launcher-head">
        <p class="eyebrow">ONE LIFE RELAY</p>
        <h1>Community Stages</h1>
        <p class="subtitle">
          다음 스테이지는 신규 30종 중 아직 안 해본 게임에서 랜덤으로 골라야 합니다.
        </p>
      </header>
      <div class="launcher-actions">
        <button id="random-next" class="primary-btn" type="button">랜덤 다음 스테이지</button>
        <p id="run-status" class="run-status" aria-live="polite"></p>
      </div>
      <section id="stage-list" class="stage-list"></section>
    </main>
    <script src="./relay-runtime.js"></script>
    <script src="./registry.js"></script>
    <script>
      const entries = window.COMMUNITY_STAGE_REGISTRY || [];
      const RANDOM_POOL_IDS = new Set([
        "sushi-conveyor",
        "morse-lighthouse",
        "ice-floe-hop",
        "potion-pour",
        "star-trail",
        "bee-garden",
        "clock-repair",
        "cable-car",
        "grill-master",
        "mine-cart",
        "fireworks-master",
        "traffic-light",
        "dam-gate",
        "treasure-dive",
        "glass-blowing",
        "curling-stone",
        "pinball-flipper",
        "bridge-build",
        "claw-machine",
        "gold-pan",
        "ski-slalom",
        "scale-balance",
        "ping-pong",
        "pool-bank",
        "parking-master",
        "ferris-wheel",
        "parachute-drop",
        "lunar-lander",
        "daruma-strike",
        "kendama-master",
      ]);
      const randomPool = entries.filter((entry) => RANDOM_POOL_IDS.has(entry.id));
      const listEl = document.querySelector("#stage-list");
      const randomNextBtn = document.querySelector("#random-next");
      const runStatusEl = document.querySelector("#run-status");
      const context = window.RelayRuntime.readContext();
      const titleById = new Map(entries.map((entry) => [entry.id, entry.title]));

      function formatPlayedStages(history) {
        if (!history.length) {
          return "없음";
        }
        return history.map((id) => titleById.get(id) || id).join(", ");
      }

      window.RelayRuntime.decorateRegistryLinks(entries, listEl);

      const alreadyPlayed = formatPlayedStages(context.history);
      const finished = new URLSearchParams(window.location.search).get("finished") === "1";
      runStatusEl.textContent = finished
        ? `클리어 ${context.clearCount}개. 이번 플레이에서 더 이상 남은 미플레이 스테이지가 없습니다. 진행 기록: ${alreadyPlayed}`
        : `클리어 ${context.clearCount}개. 이번 플레이에서 이미 진행한 스테이지: ${alreadyPlayed}`;

      randomNextBtn.addEventListener("click", () => {
        const next = window.RelayRuntime.pickRandomNext(randomPool, context);
        if (!next) {
          runStatusEl.textContent = `클리어 ${context.clearCount}개. 이번 플레이에서 남은 미플레이 스테이지가 없습니다. 진행 기록: ${alreadyPlayed}`;
          return;
        }
        const nextUrl = new URL(
          window.RelayRuntime.buildStageUrl(next.path, context, context.previousStageId),
          window.location.href,
        );
        if (!RANDOM_POOL_IDS.has(next.id) || nextUrl.origin !== window.location.origin) {
          return;
        }
        window.location.assign(`${nextUrl.pathname}${nextUrl.search}`);
      });
    </script>
  </body>
</html>
