<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>진공 튜브 배송</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #0b1220;
      }

      body {
        display: grid;
        place-items: center;
      }

      a,
      canvas {
        -webkit-tap-highlight-color: rgba(148, 163, 184, 0.2);
      }

      .skip-link {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        border-radius: 999px;
        background: rgba(11, 18, 32, 0.92);
        color: #f8fafc;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.15s ease;
      }

      .skip-link:focus,
      .skip-link:focus-visible {
        width: auto;
        height: auto;
        padding: 12px 16px;
        overflow: visible;
        clip: auto;
        clip-path: none;
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0b1220;
        touch-action: manipulation;
      }

      canvas:focus-visible {
        outline: 4px solid rgba(248, 250, 252, 0.9);
        outline-offset: -8px;
      }

      .mobile-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 16px;
        z-index: 16;
        display: flex;
        justify-content: center;
        padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }

      .mobile-controls__row {
        pointer-events: auto;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: min(100%, 360px);
      }

      .mobile-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        flex: 0 1 120px;
        min-width: 96px;
        min-height: 64px;
        padding: 0 16px;
        background: rgba(11, 18, 32, 0.78);
        color: #f8fafc;
        font: 800 20px "Trebuchet MS", "Segoe UI", sans-serif;
        box-shadow: 0 14px 28px rgba(11, 18, 32, 0.26);
        touch-action: none;
      }

      .mobile-btn[data-active="true"] {
        transform: scale(0.96);
        background: rgba(37, 99, 235, 0.9);
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-controls {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .mobile-controls {
          bottom: 12px;
          padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
        }

        .mobile-controls__row {
          gap: 8px;
          width: min(100%, 320px);
        }

        .mobile-btn {
          flex-basis: 120px;
          min-width: 96px;
          min-height: 56px;
          border-radius: 18px;
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#game">게임 캔버스로 건너뛰기</a>
    <p id="stage-instructions" class="sr-only">진공 튜브 배송. 흡입·송출 벨브를 길게 눌러 튜브 안 소포 캡슐의 압력을 조절하는 물리 타이밍 게임입니다. 캡슐이 배송 포트에 안전 속도로 진입하면 배송 성공이고, 빠른 속도로 포트나 벽에 부딪히면 소포가 파손됩니다. 소포 5개를 배송하면 클리어, 3개가 파손되면 실패입니다. 키보드는 좌우 화살표, 모바일은 화면 하단 흡입·송출 버튼을 길게 누르세요.</p>
    <canvas id="game" width="960" height="540" aria-label="진공 튜브 배송" aria-describedby="stage-instructions" tabindex="0"></canvas>
    <div class="mobile-controls" aria-hidden="false">
      <div class="mobile-controls__row">
        <button id="btn-suction" class="mobile-btn" type="button" aria-label="흡입 벨브, 캡슐을 왼쪽으로 당깁니다">◀ 흡입</button>
        <button id="btn-exhaust" class="mobile-btn" type="button" aria-label="송출 벨브, 캡슐을 오른쪽으로 밉니다">송출 ▶</button>
      </div>
    </div>
    <script src="../relay-runtime.js"></script>
    <script src="../registry.js"></script>
    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const VIEW = { width: canvas.width, height: canvas.height };
      const FIXED_DT = 1 / 60;
      const MAX_DT = 1 / 20;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const relayContext = window.RelayRuntime?.readContext("vacuum-tube-post") || {
        history: [],
        clearCount: 0,
        previousStageId: null,
      };

      let animationFrame = 0;
      let lastTimestamp = 0;
      let hostFailedReported = false;
      let hostClearedReported = false;

      // --- 게임 상수 (논리 좌표계 960x540) ---
      const TUBE = { left: 80, right: 880, cy: 300, height: 96 };
      const CAPSULE = { width: 72, height: 44 };
      const TARGET_DELIVERIES = 5;
      const MAX_BROKEN = 3;
      const BASE_ACCEL = 520;      // px/s^2, 라운드 진행 시 관성 증가로 감소
      const DRAG = 0.35;           // 마찰 감쇠 계수
      const SAFE_SPEED = 130;      // px/s 이하면 안전 배송
      const CRASH_SPEED = 150;     // px/s 이상으로 벽 충돌 시 파손

      const state = {
        mode: "menu", // menu | running | cleared | failed
        elapsed: 0,
        lastRunTime: 0,
        delivered: 0,
        broken: 0,
        round: 0,
        port: { left: 0, right: 0 },
        capsule: { x: 0, v: 0 },
        pressure: 0,          // -1(흡입) ~ +1(송출), 화면 표시용으로 감쇠
        inputLeft: false,
        inputRight: false,
        flash: 0,             // 배송 성공 플래시 타이머
        shake: 0,             // 파손 진동 타이머
        banner: "",           // "배송 성공!" / "소포 파손…" 등 안내
        bannerTime: 0,
        note: "진공 튜브의 압력 벨브로 소포를 안전하게 배송하는 물리 타이밍 게임",
      };

      function currentAccel() {
        // 관성 증가: 라운드마다 가속이 줄어 감속 타이밍이 어려워진다
        return BASE_ACCEL / (1 + state.round * 0.22);
      }

      function placePort() {
        const width = 130 - Math.min(state.round * 10, 40); // 라운드 진행 시 포트 축소
        const min = TUBE.left + 190;
        const max = TUBE.right - 40 - width;
        const left = min + Math.random() * (max - min);
        state.port.left = left;
        state.port.right = left + width;
      }

      function resetCapsule() {
        state.capsule.x = TUBE.left + CAPSULE.width / 2 + 8;
        state.capsule.v = 0;
        state.pressure = 0;
      }

      function inRelayHost() {
        try {
          return window.parent && window.parent !== window && window.RelayStageHost;
        } catch (error) {
          return false;
        }
      }

      function reportReadyToHost() {
        if (!inRelayHost()) return;
        window.RelayStageHost.onStageReady?.(window.relayStageMeta);
      }

      function reportFailedToHost(reason = "failed") {
        if (!inRelayHost() || hostFailedReported) return;
        hostFailedReported = true;
        window.RelayStageHost.onStageFailed?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          reason,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function reportClearedToHost() {
        if (!inRelayHost() || hostClearedReported) return;
        hostClearedReported = true;
        window.RelayStageHost.onStageCleared?.({
          stageId: window.relayStageMeta.id,
          stageTitle: window.relayStageMeta.title,
          clearCountAfter: relayContext.clearCount + 1,
          durationSec: Number(state.lastRunTime.toFixed(1)),
        });
      }

      function startStage() {
        state.mode = "running";
        state.elapsed = 0;
        state.lastRunTime = 0;
        state.delivered = 0;
        state.broken = 0;
        state.round = 0;
        state.flash = 0;
        state.shake = 0;
        state.banner = "";
        state.bannerTime = 0;
        placePort();
        resetCapsule();
        window.relayStageResult.status = "running";
        hostFailedReported = false;
        hostClearedReported = false;
      }

      function failStage(reason = "packages_broken") {
        state.mode = "failed";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "failed";
        reportFailedToHost(reason);
      }

      function clearStage() {
        state.mode = "cleared";
        state.lastRunTime = state.elapsed;
        window.relayStageResult.status = "cleared";
        reportClearedToHost();
      }

      function startFromTouch() {
        if (state.mode === "menu" || state.mode === "failed" || state.mode === "cleared") {
          startStage();
        }
      }

      function bindHoldButton(button, onPress, onRelease) {
        if (!button) return;
        const release = (event) => {
          if (event) event.preventDefault();
          button.dataset.active = "false";
          onRelease?.();
        };
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          startFromTouch();
          button.dataset.active = "true";
          onPress?.();
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      }

      function setLeft(on) { state.inputLeft = on; }
      function setRight(on) { state.inputRight = on; }

      bindHoldButton(document.querySelector("#btn-suction"), () => setLeft(true), () => setLeft(false));
      bindHoldButton(document.querySelector("#btn-exhaust"), () => setRight(true), () => setRight(false));

      // 데스크톱 포인터: 캔버스 좌/우 절반을 길게 눌러도 벨브 조작 가능
      canvas.addEventListener("pointerdown", (event) => {
        if (state.mode !== "running") {
          startFromTouch();
          return;
        }
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const nx = (event.clientX - rect.left) / rect.width;
        if (nx < 0.5) setLeft(true); else setRight(true);
      });
      const canvasRelease = () => { setLeft(false); setRight(false); };
      canvas.addEventListener("pointerup", canvasRelease);
      canvas.addEventListener("pointercancel", canvasRelease);
      canvas.addEventListener("pointerleave", canvasRelease);

      function breakPackage(reason) {
        state.broken += 1;
        state.banner = "소포 파손!";
        state.bannerTime = 1.2;
        state.shake = reducedMotion ? 0 : 0.5;
        if (state.broken >= MAX_BROKEN) {
          failStage(reason);
          return;
        }
        resetCapsule();
        placePort();
      }

      function deliverPackage() {
        state.delivered += 1;
        state.banner = "배송 성공!";
        state.bannerTime = 1.0;
        state.flash = reducedMotion ? 0.25 : 0.6;
        if (state.delivered >= TARGET_DELIVERIES) {
          clearStage();
          return;
        }
        state.round += 1;
        resetCapsule();
        placePort();
      }

      function update(dt) {
        if (state.mode !== "running") return;
        state.elapsed += dt;

        // 압력 입력: 흡입(왼쪽) / 송출(오른쪽)
        let input = 0;
        if (state.inputLeft) input -= 1;
        if (state.inputRight) input += 1;
        state.pressure += (input - state.pressure) * Math.min(1, dt * 10);

        const capsule = state.capsule;
        capsule.v += input * currentAccel() * dt;
        capsule.v -= capsule.v * DRAG * dt;
        capsule.x += capsule.v * dt;

        // 벽 충돌
        const minX = TUBE.left + CAPSULE.width / 2;
        const maxX = TUBE.right - CAPSULE.width / 2;
        if (capsule.x <= minX) {
          if (Math.abs(capsule.v) >= CRASH_SPEED) {
            breakPackage("wall_crash_left");
            return;
          }
          capsule.x = minX;
          capsule.v = Math.abs(capsule.v) * 0.4;
        } else if (capsule.x >= maxX) {
          if (Math.abs(capsule.v) >= CRASH_SPEED) {
            breakPackage("wall_crash_right");
            return;
          }
          capsule.x = maxX;
          capsule.v = -Math.abs(capsule.v) * 0.4;
        }

        // 포트 판정: 캡슐 중심이 포트 안쪽 경계를 지나는 순간 속도 검사
        const inPort = capsule.x > state.port.left && capsule.x < state.port.right;
        if (inPort) {
          if (Math.abs(capsule.v) <= SAFE_SPEED) {
            deliverPackage();
            return;
          }
          if (Math.abs(capsule.v) >= CRASH_SPEED + 40) {
            breakPackage("port_crash");
            return;
          }
          // 중간 속도: 포트를 지나치면 계속 진행(관통)
        }

        if (state.flash > 0) state.flash = Math.max(0, state.flash - dt);
        if (state.shake > 0) state.shake = Math.max(0, state.shake - dt);
        if (state.bannerTime > 0) state.bannerTime = Math.max(0, state.bannerTime - dt);
      }

      // --- 렌더링 ---
      function drawTube() {
        const { left, right, cy, height } = TUBE;
        const top = cy - height / 2;
        // 튜브 외곽 (투명 유리 느낌)
        ctx.fillStyle = "rgba(56, 78, 112, 0.35)";
        ctx.fillRect(left, top, right - left, height);
        const grad = ctx.createLinearGradient(0, top, 0, top + height);
        grad.addColorStop(0, "rgba(148, 197, 255, 0.28)");
        grad.addColorStop(0.35, "rgba(148, 197, 255, 0.05)");
        grad.addColorStop(1, "rgba(148, 197, 255, 0.16)");
        ctx.fillStyle = grad;
        ctx.fillRect(left, top, right - left, height);
        ctx.strokeStyle = "#7dd3fc";
        ctx.lineWidth = 4;
        ctx.strokeRect(left, top, right - left, height);

        // 양 끝 벽
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(left - 10, top - 8, 10, height + 16);
        ctx.fillRect(right, top - 8, 10, height + 16);

        // 배송 포트
        const portTop = top - 22;
        ctx.fillStyle = "rgba(74, 222, 128, 0.28)";
        ctx.fillRect(state.port.left, portTop, state.port.right - state.port.left, height + 44);
        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(state.port.left, portTop, state.port.right - state.port.left, height + 44);
        ctx.setLineDash([]);
        ctx.fillStyle = "#bbf7d0";
        ctx.font = "700 20px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("배송 포트", (state.port.left + state.port.right) / 2, portTop - 10);

        // 안전 속도 안내
        ctx.fillStyle = "rgba(187, 247, 208, 0.75)";
        ctx.font = "600 15px Trebuchet MS";
        ctx.fillText(`진입 속도 ${SAFE_SPEED} 이하`, (state.port.left + state.port.right) / 2, top + height + 40);
        ctx.textAlign = "left";
      }

      function drawCapsule() {
        const { x } = state.capsule;
        const y = TUBE.cy;
        let dx = 0;
        if (state.shake > 0) dx = (Math.random() - 0.5) * state.shake * 18;
        const w = CAPSULE.width;
        const h = CAPSULE.height;
        const left = x - w / 2 + dx;
        const top = y - h / 2;

        const speed = Math.abs(state.capsule.v);
        const danger = speed >= CRASH_SPEED;
        const warning = speed >= SAFE_SPEED;

        ctx.fillStyle = danger ? "#ef4444" : warning ? "#f59e0b" : "#fbbf24";
        ctx.beginPath();
        ctx.roundRect(left, top, w, h, 18);
        ctx.fill();
        ctx.strokeStyle = "#78350f";
        ctx.lineWidth = 3;
        ctx.stroke();

        // 소포 라벨
        ctx.fillStyle = "#78350f";
        ctx.font = "700 16px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText("POST", x + dx, y + 6);

        // 속도 경고 표시
        if (warning && state.mode === "running") {
          ctx.fillStyle = danger ? "#fecaca" : "#fde68a";
          ctx.font = "800 18px Trebuchet MS";
          ctx.fillText(danger ? "위험 속도!" : "감속 필요", x + dx, top - 14);
        }
        ctx.textAlign = "left";
      }

      function drawGauge(cx, cy, radius, ratio, color, label) {
        const clamped = Math.max(-1, Math.min(1, ratio));
        ctx.lineWidth = 10;
        ctx.strokeStyle = "rgba(148, 163, 184, 0.3)";
        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI * 0.75, Math.PI * 2.25);
        ctx.stroke();
        if (Math.abs(clamped) > 0.02) {
          const start = Math.PI * 1.5;
          const end = start + clamped * Math.PI * 0.75;
          ctx.strokeStyle = color;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, Math.min(start, end), Math.max(start, end));
          ctx.stroke();
        }
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "600 15px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(label, cx, cy + radius + 22);
        ctx.textAlign = "left";
      }

      function drawHud() {
        ctx.fillStyle = "rgba(11, 18, 32, 0.85)";
        ctx.fillRect(0, 0, VIEW.width, 72);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "800 22px Trebuchet MS";
        ctx.fillText(`배송 ${state.delivered} / ${TARGET_DELIVERIES}`, 28, 45);
        ctx.fillStyle = state.broken > 0 ? "#fca5a5" : "#94a3b8";
        ctx.fillText(`파손 ${state.broken} / ${MAX_BROKEN}`, 240, 45);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 18px Trebuchet MS";
        ctx.fillText(`라운드 ${state.round + 1}`, 420, 45);

        const speed = Math.round(Math.abs(state.capsule.v));
        ctx.fillStyle = speed >= CRASH_SPEED ? "#ef4444" : speed >= SAFE_SPEED ? "#f59e0b" : "#4ade80";
        ctx.font = "800 22px Trebuchet MS";
        ctx.textAlign = "right";
        ctx.fillText(`속도 ${speed}`, VIEW.width - 28, 45);
        ctx.textAlign = "left";

        // 압력 게이지
        drawGauge(640, 470, 34, state.pressure, "#38bdf8", "압력");
        // 벨브 상태 표시
        ctx.font = "700 17px Trebuchet MS";
        ctx.fillStyle = state.inputLeft ? "#7dd3fc" : "rgba(148,163,184,0.5)";
        ctx.textAlign = "center";
        ctx.fillText("◀ 흡입", 740, 480);
        ctx.fillStyle = state.inputRight ? "#7dd3fc" : "rgba(148,163,184,0.5)";
        ctx.fillText("송출 ▶", 860, 480);
        ctx.textAlign = "left";
      }

      function drawBanner() {
        if (state.bannerTime <= 0 || !state.banner) return;
        const ok = state.banner.includes("성공");
        ctx.fillStyle = ok ? "rgba(22, 101, 52, 0.9)" : "rgba(153, 27, 27, 0.9)";
        ctx.fillRect(VIEW.width / 2 - 170, 108, 340, 64);
        ctx.strokeStyle = ok ? "#4ade80" : "#f87171";
        ctx.lineWidth = 3;
        ctx.strokeRect(VIEW.width / 2 - 170, 108, 340, 64);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "800 30px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(state.banner, VIEW.width / 2, 150);
        ctx.textAlign = "left";
      }

      function renderCard(title, lines, accent) {
        ctx.fillStyle = "rgba(11, 18, 32, 0.94)";
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        ctx.fillStyle = "rgba(248, 250, 252, 0.98)";
        ctx.fillRect(108, 66, 744, 408);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(108, 66, 744, 408);

        ctx.fillStyle = accent;
        ctx.font = "700 40px Trebuchet MS";
        ctx.textAlign = "center";
        ctx.fillText(title, VIEW.width / 2, 132);

        ctx.fillStyle = "#0f172a";
        ctx.font = "600 22px Trebuchet MS";
        lines.forEach((line, index) => {
          ctx.fillText(line, VIEW.width / 2, 196 + index * 44);
        });
        ctx.textAlign = "left";
      }

      function render() {
        ctx.clearRect(0, 0, VIEW.width, VIEW.height);
        // 배경
        const bg = ctx.createLinearGradient(0, 0, 0, VIEW.height);
        bg.addColorStop(0, "#0b1220");
        bg.addColorStop(1, "#111c31");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, VIEW.width, VIEW.height);

        if (state.mode === "menu") {
          renderCard("진공 튜브 배송", [
            "진공 튜브 안의 소포 캡슐을 배송 포트까지 보내세요.",
            "조작: 벨브 버튼 터치·클릭으로 압력 조절",
            "키보드 ← → 도 사용 가능. 모바일은 화면 하단 버튼.",
            "클리어 조건: 소포 5개를 목표 지점에 배송하면 클리어",
            "실패 조건: 소포 3개가 부서지면 실패",
            "포트에는 안전 속도 이하로 진입하세요. 빠르면 파손!",
            "터치 또는 Enter로 시작",
          ], "#38bdf8");
          return;
        }

        drawTube();
        drawCapsule();
        drawHud();
        drawBanner();

        if (state.flash > 0) {
          ctx.fillStyle = `rgba(74, 222, 128, ${state.flash * 0.25})`;
          ctx.fillRect(0, 0, VIEW.width, VIEW.height);
        }

        if (state.mode === "failed") {
          renderCard("실패", [
            "소포 3개가 부서졌습니다.",
            `배송 성공 ${state.delivered}개 · 플레이 시간 ${state.lastRunTime.toFixed(1)}초`,
            "공유 목숨 1개가 즉시 종료되었습니다.",
          ], "#b91c1c");
          return;
        }

        if (state.mode === "cleared") {
          renderCard("클리어", [
            "소포 5개를 모두 안전하게 배송했습니다!",
            `파손 ${state.broken}개 · 플레이 시간 ${state.lastRunTime.toFixed(1)}초`,
            "호스트가 다음 스테이지를 준비합니다.",
          ], "#15803d");
        }
      }

      function renderGameToText() {
        return JSON.stringify({
          coordinate_system: "960x540 logical canvas, origin top-left, +x right",
          mode: state.mode,
          elapsed: Math.round(state.elapsed * 10) / 10,
          result: window.relayStageResult.status,
          delivered: state.delivered,
          broken: state.broken,
          round: state.round + 1,
          capsule: {
            x: Math.round(state.capsule.x),
            velocity: Math.round(state.capsule.v),
          },
          port: { left: Math.round(state.port.left), right: Math.round(state.port.right) },
          pressure: Math.round(state.pressure * 100) / 100,
          safe_speed: SAFE_SPEED,
          crash_speed: CRASH_SPEED,
          note: state.note,
          relay_context: {
            previous_stage_id: relayContext.previousStageId,
            clear_count_before_this_stage: relayContext.clearCount,
            visited_stage_ids: relayContext.history,
          },
        });
      }

      function onKeyDown(event) {
        if (event.key === "Enter" && state.mode === "menu") {
          event.preventDefault();
          startStage();
          return;
        }
        if (state.mode !== "running") return;
        if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") {
          event.preventDefault();
          setLeft(true);
        }
        if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") {
          event.preventDefault();
          setRight(true);
        }
      }

      function onKeyUp(event) {
        if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") setLeft(false);
        if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") setRight(false);
      }

      function frame(timestamp) {
        const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, MAX_DT) : FIXED_DT;
        lastTimestamp = timestamp;
        update(dt);
        render();
        animationFrame = requestAnimationFrame(frame);
      }

      window.render_game_to_text = renderGameToText;
      window.advanceTime = (ms = 16.67) => {
        const steps = Math.max(1, Math.round(ms / (FIXED_DT * 1000)));
        for (let index = 0; index < steps; index += 1) {
          update(FIXED_DT);
        }
        render();
        return renderGameToText();
      };
      window.relayStageMeta = {
        id: "vacuum-tube-post",
        title: "진공 튜브 배송",
        creator: "jungcollin",
        genre: "Physics timing",
        clearCondition: "소포 5개를 목표 지점에 배송하면 클리어",
      };
      window.relayStageResult = { status: "running" };
      window.relayStageDebug = {
        forceClear() {
          startStage();
          clearStage();
          render();
        },
        forceFail() {
          startStage();
          failStage("debug_force_fail");
          render();
        },
      };

      canvas.addEventListener("touchstart", (event) => {
        if (state.mode !== "running") {
          event.preventDefault();
          startFromTouch();
        }
      }, { passive: false });
      canvas.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationFrame));

      reportReadyToHost();
      render();
      canvas.focus();
      animationFrame = requestAnimationFrame(frame);
    </script>
  </body>
</html>
